<style>
/* Layout: recipe editor on the left, results and reference check on the right; one column on phones. The ingredient base is a second tab. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --field:#f6f8f9; --surface-2:#e8edf1;
  --ink:#14212b; --ink-2:#4b5c69; --line:#d3dbe2;
  --accent:#0a6a62; --accent-ink:#ffffff; --accent-soft:#d9eeeb;
  --warn:#9a4a05; --warn-soft:#fbecd6;
  --bad:#a8231b; --bad-soft:#fbe2df;
  --good:#1c6e38; --good-soft:#dcf1e3;
  --m-p:#2f6aa8; --m-p-ink:#ffffff;
  --m-f:#c79a1d; --m-f-ink:#1c1500;
  --m-c:#7466ad; --m-c-ink:#ffffff;
  --abc-a:#0a6a62; --abc-b:#3f998f; --abc-c:#7bb3ac;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1317; --surface:#151d23; --field:#0f171c; --surface-2:#1d2830;
    --ink:#e5ecf1; --ink-2:#9db0bd; --line:#2a3741;
    --accent:#4cc2b4; --accent-ink:#04201d; --accent-soft:#143532;
    --warn:#f0a35e; --warn-soft:#3a2915;
    --bad:#ff8f86; --bad-soft:#3d1f1c;
    --good:#76d394; --good-soft:#17321f;
    --m-p:#6fa3de; --m-p-ink:#08131d;
    --m-f:#e0b84a; --m-f-ink:#1c1500;
    --m-c:#a99be0; --m-c-ink:#120d27;
    --abc-a:#4cc2b4; --abc-b:#2f8f84; --abc-c:#24574f;
    --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#151d23; --field:#0f171c; --surface-2:#1d2830;
  --ink:#e5ecf1; --ink-2:#9db0bd; --line:#2a3741;
  --accent:#4cc2b4; --accent-ink:#04201d; --accent-soft:#143532;
  --warn:#f0a35e; --warn-soft:#3a2915;
  --bad:#ff8f86; --bad-soft:#3d1f1c;
  --good:#76d394; --good-soft:#17321f;
  --m-p:#6fa3de; --m-p-ink:#08131d;
  --m-f:#e0b84a; --m-f-ink:#1c1500;
  --m-c:#a99be0; --m-c-ink:#120d27;
  --abc-a:#4cc2b4; --abc-b:#2f8f84; --abc-c:#24574f;
  --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);
  padding-block:22px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:26px;line-height:1.15;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0 0 12px;text-wrap:balance}
p{margin:0}
.muted{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}

.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.topr{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.rgsel{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.rgsel select{width:auto;font-weight:600;color:var(--ink);padding:5px 8px;border-color:var(--accent)}
.rgtag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--surface-2);border-radius:999px;padding:3px 10px;margin:0 0 10px}
.rgnote{font-size:13px;color:var(--ink-2);margin:0 0 10px}
.rgnote b{color:var(--ink)}
.rglist{display:grid;gap:8px;margin:10px 0}
.rgrow{display:flex;gap:10px;align-items:center;max-width:420px}
.rgrow input{flex:1 1 auto}
.sub{margin-top:6px;color:var(--ink-2);max-width:62ch}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:999px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:none}
.status[data-s="ok"]::before{background:var(--good)}
.status[data-s="saving"]::before{background:var(--warn)}
.status[data-s="error"]::before{background:var(--bad)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 18px;overflow-x:auto}
.tab{font:inherit;font-weight:500;color:var(--ink-2);background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
input.num{font-family:var(--font-num);text-align:right;font-size:14px}
input.invalid{border-color:var(--bad);background:var(--bad-soft)}
select{padding-right:4px;text-overflow:ellipsis}
textarea{resize:vertical;font-family:var(--font-num);font-size:13px;line-height:1.5}
input:disabled,select:disabled{opacity:.7}
.lbl{display:block;font-size:12px;color:var(--ink-2);margin-bottom:4px;letter-spacing:.02em}
.field{display:block;min-width:0}

.btn{font:inherit;font-weight:500;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.mini{font-size:12px;padding:4px 9px}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.x{font:inherit;font-size:18px;line-height:1;color:var(--ink-2);background:none;border:1px solid transparent;border-radius:6px;width:30px;height:30px;cursor:pointer}
.x:hover{color:var(--bad);border-color:var(--line)}
.x:disabled{opacity:.4;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card + .card{margin-top:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1020px){.cols{grid-template-columns:minmax(0,1fr)}}
.col-side{display:grid;gap:16px;min-width:0}
.col-side .card + .card{margin-top:0}
.col-main{min-width:0}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.bar .grow{flex:1 1 260px}
#secCalc{margin-top:16px}
.head2{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.head2 .grow{flex:1 1 240px}
.head2 .w150{flex:0 0 150px}

.row{display:grid;grid-template-columns:minmax(0,1fr) 66px 66px 46px 46px 46px 50px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.row.rowhead{border-top:0;padding:0 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.row .r{text-align:right}
.row .rnm{font-size:14px;overflow-wrap:anywhere;min-width:0}
.row .rnm.empty{color:var(--ink-2);font-style:italic}
.row .o-n{color:var(--ink)}
.out{font:13px var(--font-num);text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cell{display:block;min-width:0}
.cell::before,.out::before{display:none}
.rows{margin-bottom:12px}
.hint{font-size:13px;color:var(--ink-2);margin-top:12px;max-width:70ch}

.hero{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap}
.kcal{display:flex;align-items:baseline;gap:10px}
.big{font:500 48px/1 var(--font-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.unit{font-size:13px;color:var(--ink-2);line-height:1.2}
.kj{font:14px var(--font-num);color:var(--ink-2)}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 14px}
.macro{display:grid;gap:3px;justify-items:start}
.sw{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;font-size:12px;font-weight:600}
.sw.p{background:var(--m-p);color:var(--m-p-ink)}
.sw.f{background:var(--m-f);color:var(--m-f-ink)}
.sw.c{background:var(--m-c);color:var(--m-c-ink)}
.mv{font:500 22px/1.1 var(--font-num);font-variant-numeric:tabular-nums}
.mv small{font-size:13px;color:var(--ink-2)}
.ml{font-size:12px;color:var(--ink-2)}
.split{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.split i{display:block;min-width:0}
.split .p{background:var(--m-p)} .split .f{background:var(--m-f)} .split .c{background:var(--m-c)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--ink-2)}
.legend .p::before{background:var(--m-p)} .legend .f::before{background:var(--m-f)} .legend .c::before{background:var(--m-c)}
.scroll{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;border-top:1px solid var(--line);text-align:right;font-weight:400;white-space:nowrap}
tbody th{white-space:normal}
thead th{border-top:0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);white-space:normal;vertical-align:bottom}
th:first-child,td:first-child{text-align:left}
tbody th{color:var(--ink);font-weight:500}
td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 0}
.kv dt{font-size:12px;color:var(--ink-2)}
.kv dd{margin:2px 0 0;font:500 15px var(--font-num);font-variant-numeric:tabular-nums}
.warns{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.warns li{padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.4}
.w-warn{background:var(--warn-soft);color:var(--warn)}
.w-bad{background:var(--bad-soft);color:var(--bad)}
.w-good{background:var(--good-soft);color:var(--good)}
.warns b{font-weight:600;margin-right:4px}
.method{font-size:12px;color:var(--ink-2);margin-top:16px;line-height:1.5}
.copybox{margin-top:10px;font-family:var(--font-num);font-size:13px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px}
#refTable table{font-size:12px}
#refTable th,#refTable td{padding:7px 3px}
#refTable .pill{font-size:11px;padding:2px 7px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.refgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.refrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:8px 12px;align-items:end}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tools .grow{flex:1 1 240px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.import{margin-bottom:16px}
.import .inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:10px}
.import .inline .field{flex:0 1 220px}
.irow{display:grid;grid-template-columns:minmax(150px,1.6fr) 68px 68px 68px 60px 170px 150px minmax(130px,1.4fr) 30px;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.irow.ihead{border-top:0;padding:0 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.irow .r{text-align:right}
.irow .icat{min-width:0;width:100%}
.cathead{display:flex;align-items:baseline;gap:8px;padding:16px 0 5px;border-top:1px solid var(--line);font-weight:600;font-size:15px}
.cathead .cc{font-weight:400;font-size:12px;color:var(--ink-2)}
.cathead:first-of-type{border-top:0}
.irow.ihead + .cathead{border-top:0}
.ipick{position:relative;min-width:0}
.ipick .ipi{width:100%}
.ipl{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:40;max-height:min(340px,52vh);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:4px;min-width:min(260px,100%)}
.ipl[hidden]{display:none}
.ipl.up{top:auto;bottom:calc(100% + 3px)}
.ipo{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1.3}
.ipo .ipn{min-width:0;overflow-wrap:anywhere}
.ipo small{flex:0 0 auto;max-width:48%;text-align:right;font-size:11px;color:var(--ink-2)}
.ipo.cur{font-weight:600}
.ipo.act{background:var(--accent);color:var(--accent-ink)}
.ipo.act small{color:inherit;opacity:.85}
.ipo.ipx{color:var(--accent)}
.ipo.ipx.act{color:var(--accent-ink)}
.ipg{padding:9px 9px 3px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.ipe{padding:8px 9px;font-size:13px;color:var(--ink-2)}
.iprice{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:2px 0 3px;font-size:13px}
.iprice .cell{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.iprice .cell::before,.iprice .out::before{display:block;content:attr(data-label);font:12px var(--font-ui);color:var(--ink-2);white-space:nowrap}
.iprice .out{display:flex;align-items:center;gap:6px;text-align:left}
.iprice input.num{width:96px}
.iprice select{width:auto}
.iprice .psrc{flex:1 1 220px;min-width:0;font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.iprice.nop .out{color:var(--warn)}
select[data-kind="estimate"]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
select[data-kind="label"],select[data-kind="table"],select[data-kind="lab"]{background:var(--good-soft);color:var(--good);border-color:transparent}
.warns.notice{margin:0 0 16px}
.ttk{margin-bottom:16px;border-color:var(--accent)}
.trows{margin-top:12px}
.trow{display:grid;grid-template-columns:minmax(0,1.2fr) 64px minmax(0,1.5fr) minmax(0,.8fr);gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.trow.thead{border-top:0;padding:0 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.trow .r{text-align:right}
.trow .tn{font-size:14px;overflow-wrap:anywhere}
.trow .tnet{text-align:right;font-family:var(--font-num);font-size:14px}
.trow .tnet .tgr{display:block;font:11px var(--font-ui);color:var(--ink-2)}
.trow .tst{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.tstat{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tstat.ok{background:var(--good-soft);color:var(--good)}
.tstat.warn{background:var(--warn-soft);color:var(--warn)}
.tstat.bad{background:var(--bad-soft);color:var(--bad)}
.tstat.neutral{background:var(--surface-2);color:var(--ink-2)}
.trem{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-2);cursor:pointer}
.trem input{width:auto;padding:0;margin:0}
.tsub{display:block;font-size:12px;color:var(--warn)}
.tout{margin-top:14px}
.tout .field{max-width:160px}
@media (max-width:760px){
  .trow{grid-template-columns:minmax(0,1fr) auto}
  .trow.thead{display:none}
  .trow .tsel,.trow .tst{grid-column:1 / -1}
  .trow .tst{flex-direction:row;align-items:center;gap:10px}
}
/* вкладка «ТТК» (расчёт + карта) */
h2.secttl{margin:30px 0 6px;font-size:19px}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:-2px 0 14px}
.jump .btn{padding:4px 10px}
.ttkcols{display:grid;gap:16px;max-width:940px}
.ttkcols .card + .card{margin-top:0}
.fgrid{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.fgrid:last-child{margin-bottom:0}
.fgrid > .field,.fgrid > .ta{flex:1 1 220px}
.fgrid > .w120{flex:0 0 120px}
.fgrid > .w150{flex:0 0 150px}
.fgrid > .w180{flex:0 0 180px}
.ta{margin-top:12px}
.ta + .fgrid,.fgrid + .ta,.fgrid + .fgrid{margin-top:12px}
.fgrid > .ta{margin-top:0}
textarea.prose{font-family:var(--font-ui);font-size:14px;line-height:1.5}
.trw{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 84px 84px 28px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.trw.thead{border-top:0;padding:0 0 5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.trw .r{text-align:right}
.trw .n{color:var(--ink-2);font:13px var(--font-num)}
.trw .x{justify-self:center}
.trw .cell::before{display:none}
.trw.cst{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 84px 84px 86px 28px}
.trw .cs{text-align:right;font:13px var(--font-num);color:var(--ink-2);white-space:nowrap}
.trw .cs.has{color:var(--ink)}
.ttkcost{margin:10px 0 0;font-size:14px}
.ttkcost b{font-weight:600}
.trw + .btn{margin-top:10px}
.fgrid.semi{margin-top:14px}
.subs{margin-top:14px}
.tsr{display:grid;grid-template-columns:minmax(0,1fr) 96px 190px auto;gap:8px;align-items:center;margin-top:6px}
@media (max-width:640px){.tsr{grid-template-columns:minmax(0,1fr) 84px}.tsr > select{grid-column:1 / 3}.tsr > button{grid-column:1 / 3;justify-self:start}}

/* запись о цене сырья в регионе: для основного это само сырьё, для остальных — ing.px[регион] */
function regRec(ing,region){
  if(!ing||NOPRICE)return null;
  if(!region||region===MAIN)return ing;
  return(ing.px&&ing.px[region])||null;
}
function pricePerKg(ing,region){
  var q=regRec(ing,region);
  if(!q||q.price===undefined||q.price===null)return null;
  if(q.priceUnit==='pack')return q.packG>0?q.price*1000/q.packG:null;
  return q.price;
}
/* брутто строки: введённое в карте, иначе по % потерь при холодной обработке из базы, иначе равно нетто */
function grossFor(row,ing){
  if(row.gross!==undefined&&row.gross!==null)return row.gross;
  var cold=ing&&ing.loss&&ing.loss.cold;
  return(cold>0&&cold<100)?row.net/(1-cold/100):row.net;
}
function r2(v){return Math.round(v*100+1e-7)/100;}
/* норма в кг: не меньше трёх знаков после запятой (3,850; 2,000; 0,100), четвёртый знак — только если он нужен */
function kgNum(v){
  if(v===null||v===undefined||!isFinite(v))return'';
  var t=(Math.round(v*10000)/10000).toFixed(4);
  if(t.charAt(t.length-1)==='0')t=t.slice(0,-1);
  return t.replace('.',',');
}
function money(v){
  if(v===null||v===undefined||!isFinite(v))return'';
  var s=r2(v).toFixed(2).split('.');
  return s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ')+','+s[1];
}
/* стоимость сырьевого набора: нормы на nPort порций в кг, сумма по строке округляется до копеек */
function costOf(r,ings,nPort,region){
  nPort=nPort||100;
  var out={rows:[],sum:0,portion:0,noPrice:[],missing:0,unassigned:0,complete:true};
  r.rows.forEach(function(row){
    if(!(row.net>0)&&!row.ing)return;
    if(row.skip&&!row.ing)return;
    var ing=row.ing?ings[row.ing]:null,g=grossFor(row,ing),pk=pricePerKg(ing,region);
    if(pk!==null)pk=r2(pk);
    var kg=Math.round(g*nPort/1000*10000)/10000;
    var gsrc=(row.gross!==undefined&&row.gross!==null)?'row':((ing&&ing.loss&&ing.loss.cold>0&&ing.loss.cold<100)?'loss':'net');
    var it={rid:row.rid,ing:row.ing,name:row.tname||(ing?ing.name:''),gross:g,gsrc:gsrc,kg:kg,price:pk,sum:pk===null?null:r2(kg*pk)};
    if(!row.ing){out.unassigned++;out.complete=false;}
    else if(!ing){out.missing++;out.complete=false;}
    else if(pk===null){if(out.noPrice.indexOf(ing.name)<0)out.noPrice.push(ing.name);out.complete=false;}
    if(it.sum!==null){out.sum+=it.sum;out.portion+=g/1000*pk;}
    out.rows.push(it);
  });
  out.sum=r2(out.sum);
  return out;
}

/* соответствие названия из учётной системы блюду из базы: синоним, точное название, название без цифр, похожее */
function matchRecipe(name,recs,fake){

var QTY_COL=/кол-?во|количеств|порц|продан|qty|count|^шт\.?$/i,SALES_HEAD=/наимен|назван|блюд|товар|номенклат|продукт|позици|кол-?во|количеств|порц|продан|qty|count/i;
/* строки таблицы продаж → [{name, qty|null}]: заголовок и «Итого» пропускаются, количество — колонка «Количество» или первое число после названия */
function parseSales(rows){
  var start=0,qc=-1,i,k,out=[];
  if(rows.length){
    var h=rows[0];
    if(!h.some(function(c){return qtyNum(c)!==null;})&&h.some(function(c){return SALES_HEAD.test(c);})){
      start=1;
      for(k=0;k<h.length;k++)if(QTY_COL.test(h[k])){qc=k;break;}
    }
  }
  for(i=start;i<rows.length;i++){
    var row=rows[i],ni=0,q=null,name;
    if(row.length>1&&qtyNum(row[0])!==null&&qtyNum(row[1])===null&&String(row[1]==null?'':row[1]).trim())ni=1;
    name=String(row[ni]==null?'':row[ni]).replace(/\s+/g,' ').trim();
    if(row.length===1){
      var mm=/^(.*?\S)\s+(\d[\d\s.,]*)$/.exec(name);
      if(mm&&qtyNum(mm[2])!==null){name=mm[1];q=qtyNum(mm[2]);}
    }else if(qc>-1&&qc!==ni)q=qtyNum(row[qc]);
    else for(k=ni+1;k<row.length;k++){var v=qtyNum(row[k]);if(v!==null){q=v;break;}}
    if(!name||/^(итого|всего)(\s|:|$)/i.test(name))continue;
    out.push({name:name,qty:q});
  }
  return out;
}
/* классы по накопленной доле, как в типовой формуле Excel: A — накопленная доля вместе с позицией не больше границы A, B — не больше границы B, остальное C.
   Первая (самая крупная) позиция всегда в A. Нулевые и убыточные позиции — класс C, в базу долей не входят. При равных значениях порядок по названию. */
function abcClassify(items,a,b){
  var arr=items.slice().sort(function(x,y){return(y.v-x.v)||String(x.name||'').localeCompare(String(y.name||''),'ru');});
  var total=0,cum=0,cnt={A:0,B:0,C:0},sh={A:0,B:0,C:0};
  arr.forEach(function(x){if(x.v>0)total+=x.v;});
  arr.forEach(function(x,i){
    x.rank=i+1;
    if(!(x.v>0)||!(total>0)){x.share=0;x.cum=total>0?cum/total*100:0;x.cls='C';}
    else{
      var first=cum<=0;
      cum+=x.v;x.share=x.v/total*100;x.cum=cum/total*100;
      x.cls=(first||x.cum<=a+1e-9)?'A':(x.cum<=b+1e-9?'B':'C');
    }
    cnt[x.cls]++;sh[x.cls]+=x.share;
  });
  return{rows:arr,total:total,counts:cnt,shares:sh};
}
/* ABC блюд региона по выручке, валовой прибыли (выручка − сырьё) или числу порций */
function abcDishes(recs,ings,region,metric,a,b){
  var items=[],skipped=[],tot={qty:0,rev:0,profit:0,nAll:0,nQty:0,nRev:0,nProfit:0};
  Object.keys(recs).forEach(function(id){
    var r=recs[id],q=(r.qty&&r.qty[region]>0)?r.qty[region]:0,price=(r.sell&&r.sell[region]>0)?r.sell[region]:null;
    var c=costOf(r,ings,100,region),has=c.rows.length>0,cost=(has&&c.sum>0)?r2(c.sum/100):null,complete=has&&c.complete&&cost!==null;
    var it={id:id,name:String(r.name||'Без названия'),qty:q,price:price,cost:cost,complete:complete,rev:null,profit:null,v:null,reason:''};
    tot.nAll++;
    if(q>0){
      tot.nQty++;tot.qty+=q;
      if(price!==null){it.rev=r2(q*price);tot.rev+=it.rev;tot.nRev++;}
      if(price!==null&&complete){it.profit=r2(q*(price-cost));tot.profit+=it.profit;tot.nProfit++;}
    }
    if(!(q>0))it.reason='noqty';
    else if(metric==='qty')it.v=q;
    else if(price===null)it.reason='noprice';
    else if(metric==='rev')it.v=it.rev;
    else if(!complete)it.reason='nocost';
    else it.v=it.profit;
    (it.reason?skipped:items).push(it);
  });
  skipped.sort(function(x,y){return x.name.localeCompare(y.name,'ru');});
  var cl=abcClassify(items,a,b);
  tot.rev=r2(tot.rev);tot.profit=r2(tot.profit);
  return{mode:'dish',metric:metric,rows:cl.rows,total:cl.total,counts:cl.counts,shares:cl.shares,skipped:skipped,tot:tot};
}
/* ABC сырья региона: расход по брутто (кг) и затраты по продажам и рецептурам блюд */
function abcRaw(recs,ings,region,metric,a,b){
  var agg={},items=[],skipped=[],nDish=0,nAll=0,unlinked=0,totKg=0,totCost=0,noPrice=[];
  Object.keys(recs).forEach(function(rid){
    var r=recs[rid],q=(r.qty&&r.qty[region]>0)?r.qty[region]:0;
    nAll++;if(!(q>0))return;
    nDish++;
    var c=costOf(r,ings,q,region),seen={};
    c.rows.forEach(function(it){
      if(!it.ing||!ings[it.ing]){unlinked++;return;}
      var x=agg[it.ing];
      if(!x)x=agg[it.ing]={id:it.ing,name:String(ings[it.ing].name||'Без названия'),kg:0,dishes:0};
      x.kg+=it.kg;
      if(!seen[it.ing]){seen[it.ing]=1;x.dishes++;}
    });
  });
  Object.keys(agg).forEach(function(id){
    var x=agg[id],ing=ings[id],pk=pricePerKg(ing,region),rec=regRec(ing,region);
    x.kg=Math.round(x.kg*10000)/10000;
    x.price=pk===null?null:r2(pk);
    x.cost=x.price===null?null:r2(x.kg*x.price);
    x.pcs=(rec&&rec.priceUnit==='pack'&&rec.packG>0)?x.kg*1000/rec.packG:null;
    totKg+=x.kg;if(x.cost!==null)totCost+=x.cost;else noPrice.push(x.name);
    x.reason='';x.v=null;
    if(metric==='cost'){if(x.cost===null)x.reason='noprice';else x.v=x.cost;}
    else x.v=x.kg;
    (x.reason?skipped:items).push(x);
  });
  skipped.sort(function(x,y){return x.name.localeCompare(y.name,'ru');});
  var cl=abcClassify(items,a,b);
  return{mode:'raw',metric:metric,rows:cl.rows,total:cl.total,counts:cl.counts,shares:cl.shares,skipped:skipped,
    tot:{kg:totKg,cost:r2(totCost),nDish:nDish,nAll:nAll,items:Object.keys(agg).length,unlinked:unlinked,noPrice:noPrice}};
}

/* ---------- таблица по ссылке: разделитель, адрес, числа ---------- */
/* Google публикует CSV с запятой, Excel и наша выгрузка — с «;». Берём самый частый вне кавычек разделитель; при равенстве табуляция, затем «;», затем запятая */
function sniffDelim(text){
  var cands=['\t',';',','],cnt=[0,0,0],q=false,i,k,ch,best=0,seen=false;
  text=String(text==null?'':text).replace(/^\ufeff/,'');
  for(i=0;i<text.length;i++){
    ch=text.charAt(i);
    if(ch==='"'){q=!q;seen=true;continue;}
    if(q)continue;
    if(ch==='\n'||ch==='\r'){if(seen)break;continue;}
    if(ch!==' ')seen=true;
    k=cands.indexOf(ch);if(k>-1)cnt[k]++;
  }
  if(!cnt[0]&&!cnt[1]&&!cnt[2])return';';
  for(k=1;k<3;k++)if(cnt[k]>cnt[best])best=k;
  return cands[best];
}
function looksHtml(text){return /^\s*<(!doctype|html|head|body|\?xml)/i.test(String(text==null?'':text).replace(/^﻿/,''));}
/* Что именно запрашивать по ссылке пользователя. Таблицы Google читаются через публикацию (pub?output=csv) или через gviz, остальное как есть */
function cloudUrl(u){
  u=String(u==null?'':u).trim();
  if(!u)return{err:'empty'};
  if(!/^https?:\/\//i.test(u)){
    if(/^[a-z0-9][a-z0-9.-]*\.[a-z]{2,}\//i.test(u))u='https://'+u;else return{err:'bad'};
  }
  if(/^https?:\/\/drive\.google\.com\//i.test(u)||/^https?:\/\/docs\.google\.com\/(document|presentation|forms)\//i.test(u))return{err:'drivefile'};
  var m=/^https?:\/\/docs\.google\.com\/spreadsheets\/d\/e\/([\w-]+)\/pub/i.exec(u),gid;
  if(m){
    gid=/[?&#]gid=(\d+)/.exec(u);
    return{url:'https://docs.google.com/spreadsheets/d/e/'+m[1]+'/pub?output=csv'+(gid?'&gid='+gid[1]+'&single=true':''),via:'gpub'};
  }
  m=/^https?:\/\/docs\.google\.com\/spreadsheets\/d\/([\w-]+)/i.exec(u);
  if(m){
    gid=/[?&#]gid=(\d+)/.exec(u);
    /* обычная ссылка на таблицу с доступом «все, у кого есть ссылка»: читаем скриптом (JSONP), он не зависит от CORS */
    return{url:'https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:json%3BresponseHandler:__CB__'+(gid?'&gid='+gid[1]:''),via:'gsheet'};
  }
  if(/^https?:\/\/(disk\.yandex\.[a-z]+|yadi\.sk)\/[di]\/[\w-]+\/?$/i.test(u.split(/[?#]/)[0]))return{url:u.split(/[?#]/)[0],via:'yandex'};
  return{url:u,via:'direct'};
}
/* Ответ gviz (таблица Google) в строки. Шапка, если Google её распознал, идёт первой строкой; проценты берём как в таблице («20%» → 20) */
function gvizRows(d){
  if(!d||d.status==='error'||!d.table)return null;
  var t=d.table,cols=t.cols||[],rows=[],hdr=cols.map(function(c){return String(c&&c.label!=null?c.label:'');});
  function cell(x){
    if(x==null||(x.v==null&&x.f==null))return'';
    if(typeof x.v==='number')return(x.f!=null&&/%/.test(x.f))?String(x.f):String(x.v);
    return String(x.f!=null?x.f:x.v);
  }
  if(hdr.some(function(h){return h.trim()!=='';}))rows.push(hdr);
  (t.rows||[]).forEach(function(r){
    var c=(r&&r.c)||[],row=[],i,n=Math.max(c.length,cols.length);
    for(i=0;i<n;i++)row.push(cell(c[i]));
    if(row.some(function(v){return v!=='';}))rows.push(row);
  });
  return rows;
}
/* число из таблицы пользователя: допускает ₽, % и «руб.» */
function parseNumL(str){return parseNum(String(str==null?'':str).replace(/[₽%]|руб\.?/gi,''));}

/* ---------- ТТК из таблицы: одна строка таблицы = одна строка рецептуры ---------- */
function rtCol(h){
  var k=normKey(h);
  if(!k)return'';
  if(/в ттк/.test(k))return'name';
  if(/^(блюдо|наименование блюда|название блюда)/.test(k))return'dish';
  if(/^(ттк|номер ттк|номер)$/.test(k))return'num';
  if(/^выход/.test(k))return'out';
  if(/цен/.test(k)&&/прод/.test(k))return'sell';
  if(/^(сырье|ингредиент|продукт|наименование сырья|наименование продукта)/.test(k))return'ing';
  if(/нетто/.test(k))return'net';
  if(/брутто/.test(k))return'gross';
  if(/доля|переход/.test(k))return'share';
  return'';
}
/* Шапка ищется в первых строках, порядок колонок любой. Название блюда можно не повторять: пустая ячейка значит то же блюдо. Реквизиты блюда берутся из первой непустой ячейки */
/* строка итога («Итого», «Итого фарша:», «Всего»): не сырьё, но нужна поварам в карте */
function isSubName(s){return/^(итого|всего)(?![а-яёa-z])/i.test(String(s||'').trim());}
function isBareTotal(s){return/^(итого|всего)\s*[:.]?\s*$/i.test(String(s||'').trim());}
function parseRecipeTable(rows){
  var hi=-1,map={},i;
  for(i=0;i<Math.min(rows.length,10)&&hi<0;i++){
    var m={};
    rows[i].forEach(function(h,j){var f=rtCol(h);if(f&&m[f]===undefined)m[f]=j;});
    if(m.dish!==undefined&&m.ing!==undefined&&m.net!==undefined){hi=i;map=m;}
  }
  if(hi<0)return{err:'header',dishes:[],skipped:[]};
  var dishes=[],byKey={},cur=null,skipped=[];
  rows.slice(hi+1).forEach(function(r){
    function cell(f){return map[f]===undefined?'':String(r[map[f]]==null?'':r[map[f]]).trim();}
    var dn=cell('dish'),d,k;
    if(dn){if(/^(итого|всего)(\s|:|$)/i.test(dn))return;cur=dn;}
    if(!cur)return;
    k=normKey(cur);if(!k)return;
    d=byKey[k];
    if(!d){d=byKey[k]={name:cur,num:'',output:null,sell:null,lines:[],subs:[]};dishes.push(d);}
    var nm=cell('num'),o=cell('out'),sv=cell('sell');
    if(!d.num&&nm)d.num=nm;
    if(d.output===null&&o){var po=parseNumL(o);if(po.ok&&!po.empty&&po.v>0)d.output=po.v;}
    if(d.sell===null&&sv){var ps=parseNumL(sv);if(ps.ok&&!ps.empty&&ps.v>0)d.sell=ps.v;}
    var ing=cell('ing');
    if(!ing)return;
    if(isSubName(ing)){     /* строка итога («Итого фарша:», «Итого:»): не сырьё, но остаётся в карте */
      var pv=parseNumL(cell('net'));
      d.subs.push({name:ing.replace(/\s+/g,' ').trim(),mass:(pv.ok&&!pv.empty&&pv.v>0)?pv.v:null,at:d.lines.length});
      return;
    }
    var pn=parseNumL(cell('net'));
    if(!pn.ok||pn.empty){skipped.push({dish:d.name,name:ing,why:cell('net')?'нетто не число':'нет нетто'});return;}
    var gs=cell('gross'),pg=gs?parseNumL(gs):null,sh=cell('share'),psh=sh?parseNumL(sh):null;
    d.lines.push({name:ing,net:pn.v,gross:(pg&&pg.ok&&!pg.empty)?pg.v:null,share:(psh&&psh.ok&&!psh.empty)?psh.v:null,tname:cell('name')});
  });
  dishes.forEach(function(d){
    var sum=d.lines.reduce(function(a,l){return a+l.net;},0);
    d.outGuess=Math.round(sum*1000)/1000;
    d.outputGiven=d.output!==null;
    if(d.output===null)d.output=d.outGuess;
  });
  return{dishes:dishes,skipped:skipped};
}

/* ---------- общая база: обмен данными через таблицу ----------
   Каждая позиция общей базы (сырьё «ing», рецепт «rec») имеет общий идентификатор sid. У каждого браузера свои локальные ид,
   поэтому соответствие хранится отдельно: ctx.map[вид][локальный ид] = {sid, rev, h}
   rev — версия позиции в общей базе на момент последней сверки (0: ещё не опубликована), h — хэш содержимого на тот момент.
   Позиция «изменена у вас», если её текущий хэш не равен h. ctx = {ings, recipes, map}. */
function syHash(s){
  var h1=0xdeadbeef,h2=0x41c6ce57,i,ch;
  for(i=0;i<s.length;i++){ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return(4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function syH(o){return syHash(canon(o));}
function syMap(ctx,kind){if(!ctx.map)ctx.map={};return ctx.map[kind]||(ctx.map[kind]={});}
function sySid(ctx,kind,id,create){
  var m=syMap(ctx,kind),e=m[id];
  if(e&&e.sid)return e.sid;
  if(!id)return'';
  if(!create)return'~'+id;
  e=m[id]={sid:(kind==='ing'?'i':'r')+uid(),rev:0,h:''};
  return e.sid;
}
/* вид позиции для обмена: рецептура ссылается на сырьё по sid (и названию на случай, если sid не найдётся); продажи и протокол ОП-1 остаются у себя */
function syIngClean(j){var o=normIng(j);if(NOPRICE)stripIngPrice(o);return o;}
function syRecClean(j){
  j=j||{};
  var b=normRecipe({name:j.name,output:j.output,rows:[],ref:j.ref,ttk:j.ttk,sell:j.sell,aliases:j.aliases,reg:j.reg});
  var o={name:b.name,output:b.output,
    rows:(Array.isArray(j.rows)?j.rows:[]).slice(0,300).map(function(x){
      x=x||{};
      var q={ing:String(x.ing||''),'in':String(x['in']||'').slice(0,200),net:num(x.net),share:(x.share===undefined||x.share===null)?100:num(x.share)};
      if(nn(x.gross)!==null)q.gross=num(x.gross);
      if(x.tname)q.tname=String(x.tname).slice(0,200);
      if(x.skip===true&&!q.ing)q.skip=true;
      return q;
    }),ref:b.ref,ttk:b.ttk};
  if(b.sell)o.sell=b.sell;   // цена продажи уходит в предложение как есть: принимает или отклоняет её технолог
  if(b.aliases)o.aliases=b.aliases;
  if(b.reg)o.reg=b.reg;
  return o;       // папка меню и «в архиве» — личное дело каждого, в общую базу не уходят (там остаются все ТТК, а меню у каждой столовой своё)
}
function syRecShared(ctx,id){
  var n=normRecipe(ctx.recipes[id]);
  return syRecClean({name:n.name,output:n.output,ref:n.ref,ttk:n.ttk,sell:n.sell,aliases:n.aliases,reg:n.reg,
    rows:n.rows.map(function(x){
      var g=x.ing?ctx.ings[x.ing]:null;
      var q={ing:g?sySid(ctx,'ing',x.ing,false):'','in':g?g.name:'',net:x.net,share:x.share,gross:x.gross,tname:x.tname};
      if(x.skip&&!x.ing)q.skip=true;
      return q;
    })});
}
function syCur(ctx,kind,id){
  var o=kind==='ing'?syIngClean(ctx.ings[id]):syRecShared(ctx,id);
  return{shared:o,h:syH(o),name:o.name};
}
/* что отличается у вас от общей базы: новое (в общей базе нет) и изменённое */
function syDirty(ctx){
  var out=[];
  ['ing','rec'].forEach(function(kind){
    var src=kind==='ing'?ctx.ings:ctx.recipes,m=syMap(ctx,kind);
    Object.keys(src).forEach(function(id){
      var e=m[id],cur=syCur(ctx,kind,id);
      if(!e||!e.rev)out.push({kind:kind,id:id,name:cur.name||'Без названия',state:'new'});
      else if(e.h!==cur.h)out.push({kind:kind,id:id,name:cur.name||'Без названия',state:'changed'});
    });
  });
  Object.keys(ctx.del||{}).forEach(function(k){
    var x=ctx.del[k];
    if(x&&x.sid)out.push({kind:x.kind,id:'~del~'+x.sid,sid:x.sid,name:x.name||'Без названия',state:'deleted',sent:!!x.sent});
  });
  out.sort(function(a,b){return(a.kind===b.kind?0:(a.kind==='rec'?-1:1))||String(a.name).localeCompare(String(b.name),'ru');});
  return out;
}
/* пакет для отправки: выбранные позиции; к рецептам добавляется сырьё, которого ещё нет в общей базе (без него рецептуру не принять) */
function syBatch(ctx,sel){
  var items=[],seen=Object.create(null),auto=[],dels={};
  sel.forEach(function(s){if(s.state==='deleted')dels[s.kind+'|'+s.sid]=1;});
  function add(kind,id,isAuto){
    var key=kind+'|'+id;
    if(seen[key])return;
    seen[key]=1;
    sySid(ctx,kind,id,true);
    var cur=syCur(ctx,kind,id),e=syMap(ctx,kind)[id];
    items.push({kind:kind,sid:e.sid,name:cur.name,baseRev:e.rev||0,json:cur.shared,localId:id,auto:!!isAuto});
    if(isAuto)auto.push(cur.name);
  }
  sel=sel.filter(function(s){return s.state!=='deleted';}).concat([]);
  sel.filter(function(s){return s.kind==='ing';}).forEach(function(s){add('ing',s.id,false);});
  sel.filter(function(s){return s.kind==='rec';}).forEach(function(s){
    var r=ctx.recipes[s.id];
    r.rows.forEach(function(x){
      if(!x.ing||!ctx.ings[x.ing])return;
      var e=syMap(ctx,'ing')[x.ing];
      if(!e||!e.rev)add('ing',x.ing,true);
    });
  });
  sel.filter(function(s){return s.kind==='rec';}).forEach(function(s){add('rec',s.id,false);});
  Object.keys(ctx.del||{}).forEach(function(k){
    var x=ctx.del[k];
    if(x&&x.sid&&dels[k])items.push({kind:x.kind,sid:x.sid,name:x.name||'Без названия',baseRev:x.rev||0,json:{_del:1},localId:'',del:true});
  });
  return{items:items,auto:auto};
}
/* рецепт из общего вида в локальный: сырьё ищется по sid, затем по названию */
function syRecToLocal(ctx,j){
  var sidIdx=Object.create(null),nameIdx=Object.create(null),m=syMap(ctx,'ing');
  Object.keys(m).forEach(function(id){if(m[id].sid&&ctx.ings[id])sidIdx[m[id].sid]=id;});
  Object.keys(ctx.ings).forEach(function(id){var k=normKey(ctx.ings[id].name);if(k&&!nameIdx[k])nameIdx[k]=id;});
  var nr=normRecipe({name:j.name,output:j.output,ref:j.ref,ttk:j.ttk,sell:j.sell,aliases:j.aliases,reg:j.reg,
    rows:j.rows.map(function(x){
      var r={rid:uid(),ing:sidIdx[x.ing]||nameIdx[normKey(x['in'])]||'',net:x.net,share:x.share};
      if(x.gross!==undefined)r.gross=x.gross;
      if(x.tname)r.tname=x.tname;
      if(x.skip&&!r.ing)r.skip=true;
      return r;
    })});
  return nr;
}
/* синонимы сырья (как оно называется в ТТК и прайсах) только дополняют друг друга, поэтому сами по себе конфликта не дают:
   если позиции различаются лишь синонимами, они считаются совпавшими, а список синонимов у вас дополняется общим */
function syNoAl(j){var o=syIngClean(j);delete o.aliases;return o;}
function syAlOnly(a,b){return canon(syNoAl(a))===canon(syNoAl(b));}
function syAlUnion(mine,theirs){
  var out=(mine||[]).slice(),i;
  (theirs||[]).forEach(function(a){if(out.indexOf(a)<0)out.push(a);});
  return out.slice(0,40);
}
/* что делать с конфликтом без вашего выбора: если позиция у вас и в общей базе сошлась только по названию (раньше вы с общей базой не
   сверялись), ваша версия не новее общей, поэтому редактору по умолчанию берётся общее; настоящий конфликт (менялось и у вас, и там) оставляет ваше */
function syPick(e,choose,adoptRemote){
  var c=choose&&choose[e.kind+'|'+e.sid];
  return c==='remote'||c==='local'?c:((adoptRemote&&e.adopt)?'remote':'local');
}
/* items: позиции из общей базы {kind,sid,name,rev,by,at,json}. Возвращает план: что новое, что обновится, что совпало, где конфликт */
function syPlanPull(ctx,items){
  var vmap=JSON.parse(JSON.stringify(ctx.map||{})),vctx={ings:ctx.ings,recipes:ctx.recipes,map:vmap},plan=[];
  /* ТТК, которые вы удалили у себя, при получении общего не возвращаются (вернуть их можно кнопкой в «Получить общее») */
  items=items.filter(function(x){return(x.json&&x.json._del)||!(ctx.gone&&ctx.gone[x.kind+'|'+x.sid]);});
  ['ing','rec'].forEach(function(kind){
    var src=kind==='ing'?ctx.ings:ctx.recipes,m=vmap[kind]||(vmap[kind]={}),sidIdx=Object.create(null),byName=Object.create(null),claimed=Object.create(null);
    Object.keys(src).forEach(function(id){
      var e=m[id];
      if(e&&e.sid)sidIdx[e.sid]=id;
      if(!e||!e.rev){var k=normKey(src[id].name);(byName[k]=byName[k]||[]).push(id);}
    });
    items.filter(function(x){return x.kind===kind;}).forEach(function(R){
      if(R.json&&R.json._del){
        /* позицию удалили в общей базе: у вас без правок она удалится, с правками остаётся ваша (конфликт); нет у вас — ничего делать не надо */
        var lid=sidIdx[R.sid]||'',te={kind:kind,sid:R.sid,name:R.name,rev:R.rev,by:R.by,at:R.at,json:{_del:1},h:'',localId:lid,adopt:false,state:'same',del:true};
        if(lid){
          var le=m[lid],lc=syCur(vctx,kind,lid);
          te.curName=lc.name;
          te.state=(le&&le.rev>0&&(le.h===lc.h||(le.sent&&le.sent===lc.h)))?'delete':'conflict';
          claimed[lid]=1;
        }
        plan.push(te);return;
      }
      var j=kind==='ing'?syIngClean(R.json):syRecClean(R.json),rh=syH(j),id=sidIdx[R.sid]||'',adopt=false;
      if(!id){
        var cand=(byName[normKey(R.name)]||[]).filter(function(c){return!claimed[c]&&(kind!=='rec'||(src[c].reg||'')===(j.reg||''));})[0];   // одноимённые карты разных регионов — разные ТТК
        if(cand){id=cand;adopt=true;}
      }
      var ent={kind:kind,sid:R.sid,name:R.name,rev:R.rev,by:R.by,at:R.at,json:j,h:rh,localId:id,adopt:adopt,state:'new'};
      if(id){
        claimed[id]=1;
        var e=m[id];
        m[id]={sid:R.sid,rev:(e&&e.rev)||0,h:(e&&e.h)||''};
        var cur=syCur(vctx,kind,id);
        ent.curName=cur.name;
        if(cur.h===rh)ent.state='same';
        else if(kind==='ing'&&syAlOnly(cur.shared,j)){ent.state='same';ent.merge=true;}
        else if(e&&((e.rev>0&&e.h===cur.h)||(e.sent&&e.sent===cur.h)))ent.state='update';
        else ent.state='conflict';
      }
      plan.push(ent);
    });
  });
  return plan;
}
/* прежний общий вид включал папку меню и архив; чтобы у блюд, уже сверенных в том виде, не появились «изменения», хэш пересчитывается один раз */
function syMigrateHash(ctx){
  var m=syMap(ctx,'rec'),n=0,cl=ctx.cats||[];
  Object.keys(m).forEach(function(id){
    var e=m[id];
    if(!e||!e.rev||!e.h||!ctx.recipes[id])return;
    var cur=syCur(ctx,'rec',id);
    if(cur.h===e.h)return;
    var r=normRecipe(ctx.recipes[id]),o=JSON.parse(JSON.stringify(cur.shared)),i;
    for(i=0;i<cl.length;i++)if(cl[i].id===r.cat){var cn=String(cl[i].name||'').replace(/\s+/g,' ').trim().slice(0,60);if(cn)o.cat=cn;}
    if(r.arch===true)o.arch=true;
    if(syH(o)===e.h){e.h=cur.h;n++;}
  });
  return n;
}
/* права на цены изменились: общий вид позиции (а с ним и хэш) теперь считается иначе. Хэши сверенных позиций пересчитываются,
   чтобы они не стали вдруг «изменёнными». toNp: true — цены стали скрытыми, false — открылись. Возвращает число пересчитанных */
function syRehash(ctx,toNp){
  var was=NOPRICE,n=0;
  ['ing','rec'].forEach(function(kind){
    var m=syMap(ctx,kind),src=kind==='ing'?ctx.ings:ctx.recipes;
    Object.keys(m).forEach(function(id){
      var e=m[id];
      if(!e||!e.rev||!e.h||!src[id])return;
      NOPRICE=!toNp;var old=syCur(ctx,kind,id).h;
      NOPRICE=!!toNp;var nw=syCur(ctx,kind,id).h;
      if(old===e.h){e.h=nw;n++;}
    });
  });
  NOPRICE=was;
  return n;
}
/* применение плана; choose['вид|sid']==='remote' в конфликте берёт общее, иначе остаётся ваше. Возвращает счётчики и затронутые ид */
function syApplyPlan(ctx,plan,choose,adoptRemote){
  choose=choose||{};
  var res={added:0,updated:0,kept:0,mapped:0,merged:0,removed:0,ings:[],recs:[]};
  var dels=plan.filter(function(e){return e.del;});
  plan=plan.filter(function(e){return!e.del;});
  var order=plan.filter(function(e){return e.kind==='ing';}).concat(plan.filter(function(e){return e.kind==='rec';}));
  order.forEach(function(e){
    var m=syMap(ctx,e.kind),id=e.localId,old=id?m[id]:null;
    if(e.state==='same'){
      m[id]={sid:e.sid,rev:e.rev,h:e.h};res.mapped++;
      if(e.merge&&ctx.ings[id]){
        var al=syAlUnion(ctx.ings[id].aliases,e.json.aliases);
        if(al.length&&canon(al)!==canon(ctx.ings[id].aliases||[])){ctx.ings[id].aliases=al;res.merged++;res.ings.push(id);}
        m[id].h=syCur(ctx,e.kind,id).h;   // свои лишние синонимы отдельной правкой не считаются: уйдут вместе со следующей настоящей
      }
      return;
    }
    if(e.state==='conflict'&&syPick(e,choose,adoptRemote)!=='remote'){
      m[id]={sid:e.sid,rev:e.rev,h:(old&&old.rev>0)?old.h:''};
      res.kept++;return;
    }
    if(e.state==='new')id=uid();
    if(e.kind==='ing'){
      var oi=ctx.ings[id];
      ctx.ings[id]=normIng(e.json);
      if(NOPRICE&&oi)PRICE_ING.forEach(function(k){if(oi[k]!==undefined)ctx.ings[id][k]=oi[k];});   // свои цены остаются у вас, их просто не видно
      res.ings.push(id);
    }
    else{
      var nr=syRecToLocal(ctx,e.json),o=ctx.recipes[id];
      if(o){if(o.qty)nr.qty=o.qty;if(o.op)nr.op=o.op;if(o.cat)nr.cat=o.cat;if(o.arch)nr.arch=true;}   // личное остаётся: протокол ОП-1, папка меню, архив
      ctx.recipes[id]=nr;res.recs.push(id);
    }
    m[id]={sid:e.sid,rev:e.rev,h:e.h};
    m[id].h=syCur(ctx,e.kind,id).h;
    if(e.state==='new')res.added++;else res.updated++;
  });
  /* удаления из общей базы: сначала ТТК, потом сырьё; сырьё, которое ещё нужно вашим ТТК, остаётся у вас */
  dels.filter(function(e){return e.kind==='rec';}).concat(dels.filter(function(e){return e.kind==='ing';})).forEach(function(e){
    var m=syMap(ctx,e.kind),id=e.localId,src=e.kind==='ing'?ctx.ings:ctx.recipes;
    if(ctx.del)delete ctx.del[e.kind+'|'+e.sid];            /* ваше удаление уже в общей базе */
    if(!id||!src[id])return;
    if(e.state==='conflict'&&syPick(e,choose,adoptRemote)!=='remote'){delete m[id];res.kept++;return;}
    if(e.kind==='ing'&&Object.keys(ctx.recipes).some(function(rid){return ctx.recipes[rid].rows.some(function(x){return x.ing===id;});})){delete m[id];res.kept++;return;}
    delete src[id];delete m[id];res.removed++;
  });
  return res;
}
function syNum(v){return v===null||v===undefined||!isFinite(v)?'—':String(Math.round(v*100)/100).replace('.',',');}
/* краткое описание отличий для технолога; oldJ — что сейчас в общей базе (или null), newJ — что предлагают */
function syDescribe(kind,oldJ,newJ,regName){
  regName=regName||function(id){return id;};
  var out=[],i,k;
  if(newJ&&newJ._del)return['удаление из общей базы'];
  function priceStr(p){
    if(!p||p.price===undefined||p.price===null)return'нет';
    return syNum(p.price)+(p.priceUnit==='pack'?' ₽/уп.'+(p.packG?' ('+syNum(p.packG)+' г)':''):' ₽/кг');
  }
  if(kind==='ing'){
    var n=syIngClean(newJ);
    if(!oldJ){
      out.push('новое сырьё: Б/Ж/У '+syNum(n.p)+'/'+syNum(n.f)+'/'+syNum(n.c)+(n.price!==undefined?', цена '+priceStr(n):''));
      return out;
    }
    var o=syIngClean(oldJ);
    if(o.p!==n.p||o.f!==n.f||o.c!==n.c)out.push('Б/Ж/У '+syNum(o.p)+'/'+syNum(o.f)+'/'+syNum(o.c)+' → '+syNum(n.p)+'/'+syNum(n.f)+'/'+syNum(n.c));
    if(priceStr(o)!==priceStr(n))out.push('цена '+priceStr(o)+' → '+priceStr(n));
    var regs={};
    Object.keys(o.px||{}).concat(Object.keys(n.px||{})).forEach(function(r){regs[r]=1;});
    Object.keys(regs).forEach(function(r){
      var a=priceStr((o.px||{})[r]),b=priceStr((n.px||{})[r]);
      if(a!==b)out.push('цена ('+regName(r)+') '+a+' → '+b);
    });
    if(o.kind!==n.kind)out.push('тип данных: '+(KINDS[o.kind]||o.kind)+' → '+(KINDS[n.kind]||n.kind));
    if(o.name!==n.name)out.push('название «'+o.name+'» → «'+n.name+'»');
    if(canon(o.aliases||[])!==canon(n.aliases||[]))out.push('синонимы изменены');
    if((o.cat||'')!==(n.cat||''))out.push('раздел: «'+(o.cat||'по названию')+'» → «'+(n.cat||'по названию')+'»');
    if(canon(o.loss||null)!==canon(n.loss||null)||o.source!==n.source)out.push('источник или потери изменены');
    return out.length?out:['без видимых изменений'];
  }
  var r2=syRecClean(newJ);
  function sellStr(s){var a=Object.keys(s||{}).sort().map(function(g){return regName(g)+' '+syNum(s[g])+' ₽';});return a.length?a.join(', '):'нет';}
  if(!oldJ){
    out.push('новая ТТК'+(r2.reg?' для региона «'+regName(r2.reg)+'»':'')+': строк рецептуры '+r2.rows.length+', выход '+syNum(r2.output)+' г'+(r2.sell?', цена продажи: '+sellStr(r2.sell):''));
    return out;
  }
  var r1=syRecClean(oldJ);
  if(r1.name!==r2.name)out.push('название «'+r1.name+'» → «'+r2.name+'»');
  if(r1.output!==r2.output)out.push('выход '+syNum(r1.output)+' → '+syNum(r2.output)+' г');
  if((r1.reg||'')!==(r2.reg||''))out.push('регион ТТК: '+(r1.reg?regName(r1.reg):'все')+' → '+(r2.reg?regName(r2.reg):'все'));
  var gs={};
  Object.keys(r1.sell||{}).concat(Object.keys(r2.sell||{})).forEach(function(g){gs[g]=1;});
  Object.keys(gs).sort().forEach(function(g){
    var a=(r1.sell||{})[g],b=(r2.sell||{})[g];
    if(a!==b)out.push('цена продажи ('+regName(g)+') '+(a===undefined?'нет':syNum(a)+' ₽')+' → '+(b===undefined?'нет':syNum(b)+' ₽'));
  });
  var key=function(x){return x.ing||('n:'+normKey(x['in']));};
  var A={},B={},added=[],removed=[],changed=[];
  r1.rows.forEach(function(x){A[key(x)]=x;});
  r2.rows.forEach(function(x){B[key(x)]=x;});
  Object.keys(B).forEach(function(q){
    if(!A[q])added.push(B[q]['in']||B[q].tname||'?');
    else if(A[q].net!==B[q].net||A[q].share!==B[q].share||(A[q].gross||null)!==(B[q].gross||null))changed.push(B[q]['in']||B[q].tname||'?');
  });
  Object.keys(A).forEach(function(q){if(!B[q])removed.push(A[q]['in']||A[q].tname||'?');});
  if(added.length||removed.length||changed.length){
    var p=[];
    if(added.length)p.push('добавлено: '+added.slice(0,3).join(', ')+(added.length>3?'…':''));
    if(removed.length)p.push('убрано: '+removed.slice(0,3).join(', ')+(removed.length>3?'…':''));
    if(changed.length)p.push('изменено количество: '+changed.slice(0,3).join(', ')+(changed.length>3?'…':''));
    out.push('состав: '+p.join('; '));
  }else if(canon(r1.rows.map(key))!==canon(r2.rows.map(key)))out.push('порядок строк состава изменён');
  var tk={};
  Object.keys(r1.ttk||{}).concat(Object.keys(r2.ttk||{})).forEach(function(q){tk[q]=1;});
  var nt=Object.keys(tk).filter(function(q){return(r1.ttk||{})[q]!==(r2.ttk||{})[q];}).length;
  if(nt)out.push('реквизиты и тексты ТТК: изменено полей '+nt);
  if(canon(r1.ref)!==canon(r2.ref))out.push('эталон КБЖУ изменён');
  if(canon(r1.aliases||[])!==canon(r2.aliases||[]))out.push('синонимы названия изменены');
  return out.length?out:['без видимых изменений'];
}

/* строки нового состава относительно старого: st[i] = '' | 'add' | 'chg'; del — убранные строки; chg — пары [было, стало] */
function syRowCmp(oldRows,newRows){
  var ka=syRowKeys(oldRows),kb=syRowKeys(newRows),A={},B={},st=[],del=[],chg=[];

      var at=cm[1],inner=cm[2]||'',ref=/\br="([A-Z]+\d+)"/.exec(at),t=/\bt="(\w+)"/.exec(at),s=/\bs="(\d+)"/.exec(at),ci=ref?xlCol(ref[1]):row.length,val='';

      else if(t&&t[1]==='str'){val=vm?xlUnesc(vm[1]):'';}

/* записать цену в запись региона по цене за кг: режим «за упаковку» сохраняется, если он уже был; штучная позиция без цены получает упаковку */

/* сравнение двух периодов по сырью, которое есть в обоих; индекс — на корзине нового периода (те же объёмы, старые и новые цены) */

/* поставщики за период: оборот, доли, разброс цен по сырью с несколькими поставщиками и возможная экономия */

/* что изменилось с прошлого обновления: prev — ответ скрипта (a=pprev) с содержимым прежних таблиц */
function pfDiff(d,prev,at){
  var out={sell:[],prv:[]};
  if(!prev||!prev.has||prev.same||!prev.pub||!prev.prv)return out;
  var when=pfDate(at),pi={},pn={},pd={},pdn={},ps={},psn={};
  prev.prv.ing.forEach(function(a){var k=normKey(a[0]);pi[k]=a[1];pn[k]=a[0];});
  prev.prv.dish.forEach(function(a){var k=normKey(a[0]);pd[k]={cost:a[1],sell:a[2]};pdn[k]=a[0];});
  prev.pub.sell.forEach(function(a){var k=normKey(a[0]);ps[k]=a[1];psn[k]=a[0];});
  function pct(o,n){return(o>0&&n!==null&&n!==undefined&&n!=='')?pfRound((n/o-1)*100,1):'';}
  function chg(rows,what,name,label,o,n,eps){
    var oo=(o===null||o===undefined)?null:o,nn_=(n===null||n===undefined)?null:n;
    if(oo===null&&nn_===null)return;
    if(oo!==null&&nn_!==null&&Math.abs(nn_-oo)<eps)return;
    rows.push([when,what,name,label,oo===null?'':oo,nn_===null?'':nn_,pct(oo,nn_)]);
  }
  var seenI={},seenD={},seenS={};
  d.ings.forEach(function(x){var k=normKey(x.name);seenI[k]=1;chg(out.prv,'Сырьё',x.name,'Цена, ₽/кг',pi[k],x.pk,0.005);});
  Object.keys(pi).forEach(function(k){if(!seenI[k])chg(out.prv,'Сырьё',pn[k],'Убрано из файла (нет цены)',pi[k],null,0);});
  d.dishes.forEach(function(x){
    var k=normKey(x.name),o=pd[k];seenD[k]=1;
    chg(out.prv,'Блюдо',x.name,'Себестоимость порции, ₽',o?o.cost:null,x.cost,0.01);
    chg(out.prv,'Блюдо',x.name,'Цена продажи, ₽',o?o.sell:null,x.sell,0.005);
    if(x.sell>0){
      seenS[k]=1;var os=ps[k];
      if(os===undefined)out.sell.push([when,x.name,'',x.sell,'']);
      else if(Math.abs(x.sell-os)>=0.005)out.sell.push([when,x.name,os,x.sell,pct(os,x.sell)]);
    }
  });
  Object.keys(pd).forEach(function(k){if(!seenD[k])out.prv.push([when,'Блюдо',pdn[k],'Убрано из меню','','','']);});
  Object.keys(ps).forEach(function(k){if(!seenS[k])out.sell.push([when,psn[k],ps[k],'','']);});
  return out;
}

function bkCheck(raw){

   dirty (после этого были правки), dev (номер этого браузера), cloud (копия на Диске: {rev,dev} или null)}
   none — копии нет и браузер ни с чем не сверен; free — копия есть, а этот браузер с ней ещё не сверялся;
   ok — всё совпадает; push — у вас есть правки, которых нет на Диске; behind — на Диске новее, у вас правок нет;

/* что видно в регионе g: общие ТТК и привязанные к нему; общая ТТК скрыта, если у региона есть своя карта этого блюда */
function visIds(g){
  g=g||curRegion();
  var ids=Object.keys(S.recipes),own={};
  if(syLimited())ids=ids.filter(function(id){return calcReady(S.recipes[id]);});      /* тер. управляющий и шеф-повар не видят нерассчитанные ТТК */
  ids.forEach(function(id){var r=S.recipes[id];if(r.reg&&r.reg===g&&regKnown(g))own[recKey(r)]=1;});
  return ids.filter(function(id){var r=S.recipes[id];if(r.reg&&regKnown(r.reg))return r.reg===g;return!own[recKey(r)];}).sort(byName(S.recipes));
}
function visMap(g){var m={};visIds(g).forEach(function(id){m[id]=S.recipes[id];});return m;}
function recLabel(r){
  var n=r.name||'Без названия';
  if(r.reg&&regKnown(r.reg)&&regionList().length>1&&n.indexOf(regionName(r.reg))<0)n+=' · '+regionName(r.reg);
  if(r.arch)n+=' · архив';
  return n;
}
/* ---------- папки меню и архив ---------- */
function normMenu(d){
  var cats=[],seen={};
  (d&&Array.isArray(d.cats)?d.cats:[]).forEach(function(c){
    if(!c)return;
    var id=String(c.id||'').slice(0,40),nm=String(c.name||'').replace(/\s+/g,' ').trim().slice(0,60);
    if(!id||!nm||seen[id])return;
    seen[id]=1;cats.push({id:id,name:nm});
  });
  return{cats:cats.slice(0,60)};
}
function menuCats(){var m=S.cfg.menu;return(m&&Array.isArray(m.cats))?m.cats:[];}
function ensureMenu(){if(!S.cfg.menu||!Array.isArray(S.cfg.menu.cats))S.cfg.menu={cats:[]};return S.cfg.menu.cats;}
function saveMenu(){queueSave('settings','menu');layTouch();}
/* ---------- общие папки меню ----------
   Папки и раскладку блюд по ним ведёт технолог: они уходят в общую базу отдельно от ТТК (скрипт версии 10) и у остальных кодов подставляются в меню сами.
   У технолога главные его локальные папки; у остальных вместо личных появляются общие, и менять их там нельзя, пока технолог их ведёт.
   Состояние: S.sy.cfg.laySh (1 — у этого кода общие папки), S.sy.cfg.layLs (подпись раскладки, с которой локальные папки сверены в последний раз). */
function layOn(){return S.mode==='local'&&!syAdmin()&&syLinked()&&S.sy.cfg.laySh===1;}
function laySig(cats){return syHash(JSON.stringify((cats||[]).map(function(c){return[c.n,(c.r||[]).slice().sort()];})));}
/* раскладка из локальных папок технолога: в ней только блюда, уже попавшие в общую базу (у остальных других нет) */
function layBuild(){
  var m=syMap(syCtx(),'rec'),idx={},byName={},known={},out=[];
  menuCats().forEach(function(c){var o={n:c.name,r:[]};idx[c.id]=o;byName[normKey(c.name)]=o;out.push(o);});
  Object.keys(m).forEach(function(id){if(m[id]&&m[id].sid)known[m[id].sid]=1;});
  Object.keys(S.recipes).forEach(function(id){
    var r=S.recipes[id],e=m[id],o=r.cat&&idx[r.cat];
    if(o&&e&&e.sid&&e.rev>0)o.r.push(e.sid);
  });
  /* блюда, которых этот компьютер ещё не получил, остаются в общей раскладке как были: пустой или неполный браузер её не затирает */
  (S.sy.lay||[]).forEach(function(rc){
    var o=byName[normKey(rc.n)];if(!o)return;
    (rc.r||[]).forEach(function(sid){if(!known[sid]&&!S.sy.gone['rec|'+sid])o.r.push(sid);});
  });
  out.forEach(function(o){o.r.sort();});
  return out;
}
/* технолог: блюдам без папки подставляется папка из общей раскладки (блюдо могло прийти позже папок) */
function layFill(remote){
  var m=syMap(syCtx(),'rec'),byKey={},sidCat={},ch=false;
  menuCats().forEach(function(c){byKey[normKey(c.name)]=c.id;});
  remote.forEach(function(x){var id=byKey[normKey(x.n)];if(id)(x.r||[]).forEach(function(sid){sidCat[sid]=id;});});
  Object.keys(S.recipes).forEach(function(id){
    var r=S.recipes[id],e=m[id],d=e&&e.sid&&sidCat[e.sid];
    if(r.cat&&catById(r.cat))return;
    if(d){r.cat=d;queueSave('recipes',id);ch=true;}
  });
  return ch;
}
/* общие папки -> локальные: strict (у не-технолога) убирает папку и у блюд, которых в раскладке нет */
function layMirror(remote,strict){
  var cl=ensureMenu(),byKey={},ch=false,sidCat={},m=syMap(syCtx(),'rec');
  cl.forEach(function(c){byKey[normKey(c.name)]=c;});
  var want=remote.map(function(x){var c=byKey[normKey(x.n)];return{id:c?c.id:newId(),name:x.n};});
  var same=want.length===cl.length&&want.every(function(w,i){return cl[i].id===w.id&&cl[i].name===w.name;});
  if(!same){S.cfg.menu.cats=want;ch=true;}
  remote.forEach(function(x,i){(x.r||[]).forEach(function(sid){sidCat[sid]=want[i].id;});});
  Object.keys(S.recipes).forEach(function(id){
    var r=S.recipes[id],e=m[id],d=(e&&e.sid&&sidCat[e.sid])||'',cur=r.cat||'';
    if(d){if(cur!==d){r.cat=d;ch=true;queueSave('recipes',id);}}
    else if(cur&&(strict||!catById(cur))){delete r.cat;ch=true;queueSave('recipes',id);}
  });
  if(ch)queueSave('settings','menu');
  return ch;
}
var layTimer=null;
/* технолог правит папки: через секунду раскладка уйдёт в общую базу */
function layTouch(){
  if(S.mode!=='local'||!syAdmin()||!syLinked())return;
  S.sy.layForce=true;
  clearTimeout(layTimer);layTimer=setTimeout(function(){layTimer=null;layApply();},1200);
}
function syLayLoad(){
  return syGet({a:'lay'}).then(function(d){
    S.sy.lay=Array.isArray(d.cats)?d.cats:[];S.sy.layRev=d.rev||0;S.sy.layKnown=true;S.sy.layOld=false;
  },function(e){if(e&&e.err==='a')S.sy.layOld=true;});
}
/* прочитать общие папки и сверить с локальными; если меню изменилось, перерисовать */
function layRefresh(){return syLayLoad().then(function(){if(layApply())scheduleRender();});}
function layPush(cats,now){
  var c=S.sy.cfg;
  S.sy.layForce=false;S.sy.busy.lay=true;
  syPost('layPut',{cats:cats},c.code).then(function(r){
    S.sy.busy.lay=false;c.layLs=now;S.sy.lay=cats;S.sy.layRev=r.rev||S.sy.layRev;S.sy.layErr='';syPersist();
  },function(e){
    S.sy.busy.lay=false;
    if(e&&e.err==='op'){S.sy.layOld=true;return;}
    S.sy.layForce=true;S.sy.layErr=syErrText(e);scheduleRender();
  });
}
/* сверка локальных и общих папок; вызывается после чтения общей базы, после обновления и после правки папок технологом */
function layApply(){
  if(S.mode!=='local'||!syLinked()||!S.sy.layKnown||S.sy.layOld||S.sy.busy.lay)return false;
  var c=S.sy.cfg,remote=S.sy.lay||[],rs=laySig(remote);
  if(syAdmin()){
    if(S.sy.layForce){                              /* технолог правил папки: его раскладка главная */
      var cats=layBuild(),now=laySig(cats);
      if(now===rs){S.sy.layForce=false;if(c.layLs!==rs){c.layLs=rs;syPersist();}return false;}
      layPush(cats,now);return false;
    }
    var ch=layFill(remote),cats2=layBuild(),now2=laySig(cats2);
    if(now2===rs){if(c.layLs!==rs){c.layLs=rs;syPersist();}return ch;}
    if(rs!==c.layLs&&!(c.layLs===undefined&&!remote.length)){   /* общие папки изменены с другого компьютера (или это первое подключение): берём их */
      ch=layMirror(remote,false)||ch;c.layLs=rs;syPersist();return ch;
    }
    layPush(cats2,now2);                            /* общие папки не менялись, а у технолога появилось новое (например, опубликованные блюда) */
    return ch;
  }
  var on=remote.length>0?1:0,ch2=false;
  if(on)ch2=layMirror(remote,true);
  if(c.laySh!==on||c.layLs!==rs){c.laySh=on;c.layLs=rs;syPersist();ch2=true;}
  return ch2;
}

function curRegion(){var l=regionList(),i;for(i=0;i<l.length;i++)if(l[i].id===S.region)return S.region;return MAIN;}

/* запись о цене в регионе для правки: у основного региона это само сырьё */
function recFor(ing,region,create){
  if(region===MAIN)return ing;
  if(!ing.px){if(!create)return null;ing.px={};}
  if(!ing.px[region]){if(!create)return null;ing.px[region]={};}
  return ing.px[region];

}

/* ---------- persistence ---------- */
function setSave(state,msg){S.save=state;S.saveMsg=msg||'';renderStatus();}
function renderStatus(){
  var el=$('#status'),s='',t='';
  if(S.mode==='init'){t='Подключаюсь…';}
  else if(S.readOnly){t='Только просмотр';}
  else if(S.save==='error'){s='error';t=S.saveMsg||'Не удалось сохранить';}
  else if(S.mode==='local'){t=bkStatusLine()||'Сохраняется только в этом браузере';}
  else if(S.save==='saving'){s='saving';t='Сохраняю…';}
  else{s='ok';t='Данные сохранены';}
  el.setAttribute('data-s',s);el.textContent=t;el.hidden=guestOn();
  bkBarUpdate();rvBarUpdate();upBarUpdate();
}
function mapOf(kind){return kind==='ingredients'?S.ings:(kind==='settings'?S.cfg:S.recipes);}
function queueSave(kind,id){
  var key=kind+'/'+id;
  if(S.readOnly)return;
  if(S.mode==='local'){
    clearTimeout(localTimer);
    localTimer=setTimeout(function(){
      var ok=lsSet('kbzhu:v1',JSON.stringify({ings:S.ings,recipes:S.recipes,cfg:S.cfg}));
      setSave(ok?'ok':'error',ok?'':'Браузер не даёт сохранить данные');
      syStripUpdate();
    },400);
    pfSchedule(60000);     // файлы цен на Диске обновятся через минуту после последней правки
    bkTouch();             // и копия данных на Диске тоже
    return;
  }
  dirty[key]=1;
  clearTimeout(timers[key]);
  setSave('saving');
  timers[key]=setTimeout(function(){pending[key]=1;pump();},500);
}
function pump(){
  while(running<MAXC){
    var key=Object.keys(pending).filter(function(k){return!inflight[k];})[0];
    if(!key)break;
    delete pending[key];inflight[key]=1;running++;
    doWrite(key).then(function(k){return function(){
      delete inflight[k];running--;
      if(!Object.keys(pending).length&&!Object.keys(inflight).length&&!Object.keys(dirty).length&&S.save==='saving')setSave('ok');
      pump();
    };}(key));
  }
}
function doWrite(key){
  var kind=key.split('/')[0],id=key.split('/')[1],map=mapOf(kind);
  delete dirty[key];
  var ref=S.db.doc(key);
  var p=map[id]?ref.set(JSON.parse(JSON.stringify(map[id]))):ref['delete']();
  return p.then(function(){delete retries[key];},function(e){
    var code=e&&e.code;
    if((code==='resource_exhausted'||code==='unavailable')&&(retries[key]||0)<3){
      retries[key]=(retries[key]||0)+1;dirty[key]=1;
      setTimeout(function(){pending[key]=1;pump();},1500*retries[key]);
    }else if(code==='quota_exceeded'){setSave('error','Хранилище заполнено, запись не удалась');}
    else if(code==='invalid_argument'){S.readOnly=true;renderStatus();renderAll();flash('Нет права на запись: данные открыты только для просмотра');}
    else{setSave('error','Не удалось сохранить, проверьте соединение');}
  });
}
function removeDoc(kind,id){delete mapOf(kind)[id];queueSave(kind,id);}
function loadLocal(){
  try{
    var d=null;
    try{d=JSON.parse(lsGet('kbzhu:v1')||'null');}catch(e0){d=null;}
    var has=d&&((d.ings&&Object.keys(d.ings).length)||(d.recipes&&Object.keys(d.recipes).length));
    /* В автономной копии база встроена в файл (window.KBZHU_SEED) и подставляется, пока в браузере нет своих данных */
    if(!has&&window.KBZHU_SEED)d=window.KBZHU_SEED;
    if(d){
      Object.keys(d.ings||{}).forEach(function(id){S.ings[id]=normIng(d.ings[id]);});
      /* копия со встроенной базой: подтягиваем цены и названия из прайса для сырья, у которого их ещё нет */
      var sdSig=(window.KBZHU_SEED&&window.KBZHU_SEED.ings)?syHash(JSON.stringify(window.KBZHU_SEED.ings)):'';
      if(sdSig&&!has)S.seedMark=sdSig;   // чистый браузер: всё взято из встроенной базы, подставлять нечего
      else if(sdSig&&lsGet('kbzhu:seedfill')!==sdSig){
        /* один раз на версию встроенной базы: иначе цена, убранная у сырья (или пришедшая без цены из общей базы), возвращалась бы при каждом открытии и снова считалась правкой */
        var sd=window.KBZHU_SEED.ings;S.seedMark=sdSig;S.seedFill=true;
        Object.keys(sd).forEach(function(id){
          var loc=S.ings[id],se=sd[id];
          if(!loc||se.price===undefined||se.price===null||(loc.price!==undefined&&loc.price!==null))return;
          var n=normIng(se);
          loc.price=n.price;if(n.priceUnit)loc.priceUnit=n.priceUnit;if(n.packG)loc.packG=n.packG;if(n.priceSrc)loc.priceSrc=n.priceSrc;
          if(n.aliases)loc.aliases=(loc.aliases||[]).concat(n.aliases.filter(function(a){return(loc.aliases||[]).indexOf(a)<0;}));
        });
      }
      Object.keys(d.recipes||{}).forEach(function(id){S.recipes[id]=normRecipe(d.recipes[id]);});
      if(d.cfg&&d.cfg.regions)S.cfg.regions={list:normRegions(d.cfg.regions)};
      if(d.cfg&&d.cfg.finance)S.cfg.finance=normFinance(d.cfg.finance);
      if(d.cfg&&d.cfg.abc)S.cfg.abc=normAbc(d.cfg.abc);
      if(d.cfg&&d.cfg.menu)S.cfg.menu=normMenu(d.cfg.menu);
      if(d.cfg)Object.keys(d.cfg).forEach(function(k){if(isPhId(k))S.cfg[k]=normPh(d.cfg[k]);});
    }
  }catch(e){}
}
function applySnap(kind,snap){
  var map=mapOf(kind),changed=false;
  snap.docChanges().forEach(function(ch){
    var id=ch.doc.id,key=kind+'/'+id;
    if(ch.type==='removed'){if(map[id]&&!dirty[key]&&!inflight[key]){delete map[id];changed=true;}return;}
    if(dirty[key]||inflight[key])return;
    var d=ch.doc.data();if(!d)return;
    if(kind==='settings'&&id!=='regions'&&id!=='finance'&&id!=='abc'&&id!=='menu'&&!isPhId(id))return;
    var n=kind==='ingredients'?normIng(d):(kind==='settings'?(id==='finance'?normFinance(d):(id==='abc'?normAbc(d):(id==='menu'?normMenu(d):(isPhId(id)?normPh(d):{list:normRegions(d)})))):normRecipe(d));
    if(canon(map[id])!==canon(n)){map[id]=n;changed=true;}
  });
  if(!snap.metadata.fromCache&&!S.loaded[kind]){S.loaded[kind]=true;changed=true;}
  if(changed)scheduleRender();
}
function subscribe(){
  var fail=function(kind){return function(){S.loaded[kind]=true;setSave('error','Нет связи с хранилищем');renderAll();};};
  S.db.collection('ingredients').onSnapshot(function(s){applySnap('ingredients',s);},fail('ingredients'));
  S.db.collection('recipes').onSnapshot(function(s){applySnap('recipes',s);},fail('recipes'));
  S.db.collection('settings').onSnapshot(function(s){applySnap('settings',s);},function(){});
  setTimeout(function(){if(!S.loaded.ingredients||!S.loaded.recipes){S.loaded.ingredients=S.loaded.recipes=true;renderAll();}},4000);
}
function isTyping(){var a=document.activeElement;return!!(a&&$('#view').contains(a)&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'));}

var TT_TEXT_KEYS=['scope','r21','r22','r23','t41','t42','s51','s52','s53','s54','p62a','p62b','p62c','m63'];
function dishParts(r){
  var base=String(r.name||'').replace(/\s*\(ТТК[^)]*\)\s*$/i,'').trim();
  var m=/^(.*?)\s+(\d+(?:\/\d+)*)\s*г[р.]*$/i.exec(base);
  return m?{dish:m[1].trim(),portion:m[2]+'гр.'}:{dish:base,portion:'1/'+dnum(r.output,2)+'гр.'};
}
function ttkDefault(r,k){
  var m;
  switch(k){
    case'num':m=/ттк\s*№\s*(\d+)/i.exec(r.name||'');return m?m[1]:'';
    case'dish':return dishParts(r).dish;
    case'portion':return dishParts(r).portion;
    case'tol':return dnum(Math.round(r.output*5)/100,2);
    case'main':return dnum(r.output,2);
    case'viiSrc':return'calc';
    case'viiBasis':return'por';
    default:return TT_DEF[k]!==undefined?TT_DEF[k]:'';
  }
}
function ttkVal(r,k){var t=r.ttk;if(t&&Object.prototype.hasOwnProperty.call(t,k))return t[k];return ttkDefault(r,k);}
function setTtk(r,k,v){if(!r.ttk)r.ttk={};r.ttk[k]=v;queueSave('recipes',S.active);}
function ttkRowList(r){return r.rows.filter(function(x){return x.net>0||x.ing||x.skip;});}
/* итоговые строки карты («Итого фарша:», «Итого:», «Масса полуфабриката»): список в r.ttk.subs, место задаётся строкой, после которой стоит итог. В расчёт КБЖУ и себестоимости они не входят */
function ttkSubs(r){
  var raw=r.ttk&&Object.prototype.hasOwnProperty.call(r.ttk,'subs')?r.ttk.subs:null,out=[];
  if(raw!==null){
    try{var a=JSON.parse(raw);if(Array.isArray(a))a.slice(0,30).forEach(function(x){if(x&&typeof x==='object')out.push({n:String(x.n||'').slice(0,120),m:String(x.m==null?'':x.m).slice(0,20),a:String(x.a||'').slice(0,40)});});}catch(e){}
    return out;
  }
  /* карты, сохранённые до появления списка: одна строка «Масса полуфабриката» */
  var sm=ttkPn(ttkVal(r,'semiMass'));
  if(sm>0){
    var list=ttkRowList(r),k=Math.max(0,Math.min(list.length,ttkPn(ttkVal(r,'semiAfter'))));
    out.push({n:String(ttkVal(r,'semiName')||'').trim()||'Масса полуфабриката',m:String(ttkVal(r,'semiMass')),a:k>0?list[k-1].rid:''});
  }
  return out;
}
function setSubs(r,arr){if(!r.ttk)r.ttk={};r.ttk.subs=JSON.stringify(arr);queueSave('recipes',S.active);}
/* итоги с местом в списке строк (at: 0 — перед первой строкой) и массой; пустая масса — сумма нетто строк выше (для «Итого» без уточнения — всех строк выше) */
function ttkSubRows(r){
  var list=ttkRowList(r),idx={},out=[],prev=0;
  list.forEach(function(x,i){idx[x.rid]=i+1;});
  ttkSubs(r).forEach(function(s,k){
    out.push({name:s.n.trim()||'Итого:',m:s.m,at:s.a===''?0:(idx[s.a]!==undefined?idx[s.a]:list.length),k:k,mass:0,auto:false});
  });
  out.sort(function(a,b){return a.at-b.at||a.k-b.k;});
  out.forEach(function(s){
    var p=parseNum(s.m),from=isBareTotal(s.name)?0:prev,sum=0,i;
    for(i=from;i<s.at;i++)sum+=list[i].net;
    s.sum=Math.round(sum*1000)/1000;
    if(p.ok&&!p.empty&&p.v>0)s.mass=p.v;
    else{s.mass=s.sum;s.auto=true;}
    prev=s.at;
  });
  return out;
}
function grossDefault(row){return grossFor({net:row.net},S.ings[row.ing]);}
/* в строке рецептуры введено брутто, а нетто пусто: нетто считается по потерям при холодной обработке из базы сырья (S.na — строки с таким «авто»-нетто:
   пока его не вписали руками, оно следует за брутто и за выбранным сырьём) */
function netFromGross(row){
  var na=S.na||(S.na={});
  if(!(row.gross>0))return;
  if(row.net>0&&!na[row.rid])return;
  var ing=S.ings[row.ing],cold=ing&&ing.loss&&ing.loss.cold;
  row.net=Math.round((cold>0&&cold<100?row.gross*(1-cold/100):row.gross)*1000)/1000;
  na[row.rid]=1;
}

function ttkIssues(r,c){
  var w=[],list=ttkRowList(r);

  if(!['look','color','texture','taste'].every(function(k){return String(ttkVal(r,k)||'').trim();}))w.push(['warn','Не заполнены органолептические показатели (п. 6.1).']);
  if(!String(ttkVal(r,'headName')||'').trim())w.push(['warn','Не указан ФИО утверждающего: в шапке останется пустая строка.']);

/* ---- предпросмотр карты: тот самый документ, который скачивается, показанный на листе ---- */
var PV_W='http://schemas.openxmlformats.org/wordprocessingml/2006/main',pvState=null;
function pvKids(el,name){var o=[];if(!el)return o;Array.prototype.forEach.call(el.childNodes,function(c){if(c.nodeType===1&&c.localName===name)o.push(c);});return o;}
function pvAt(el,a){return el?el.getAttributeNS(PV_W,a):null;}
function pvPx(tw){return Math.round(Number(tw)/15*100)/100;}
function pvPara(p){
  var pr=pvKids(p,'pPr')[0],st='',tab=0,h='';
  if(pr){
    var jc=pvKids(pr,'jc')[0],ind=pvKids(pr,'ind')[0],sp=pvKids(pr,'spacing')[0],tb=pvKids(pr,'tabs')[0],t0=tb?pvKids(tb,'tab')[0]:null,v=jc?pvAt(jc,'val'):'';
    if(v)st+='text-align:'+(v==='both'?'justify':(v==='center'?'center':(v==='right'?'right':'left')))+';';
    if(ind&&Number(pvAt(ind,'left')))st+='margin-left:'+pvPx(pvAt(ind,'left'))+'px;';
    if(sp)st+='margin-top:'+pvPx(pvAt(sp,'before')||0)+'px;margin-bottom:'+pvPx(pvAt(sp,'after')||0)+'px;';
    if(t0)tab=Number(pvAt(t0,'pos'))||0;
  }
  pvKids(p,'r').forEach(function(r){
    if(pvKids(r,'tab').length){if(tab){h='<span class="pvtab" style="min-width:'+pvPx(tab)+'px">'+h+'</span>';tab=0;}return;}
    var rp=pvKids(r,'rPr')[0],t=pvKids(r,'t')[0],x=esc(t?t.textContent:'');
    if(!x)return;
    if(rp){
      var sz=pvKids(rp,'sz')[0];
      if(sz&&Number(pvAt(sz,'val')))x='<span style="font-size:'+(Number(pvAt(sz,'val'))/2)+'pt">'+x+'</span>';
      if(pvKids(rp,'u').length)x='<u>'+x+'</u>';
      if(pvKids(rp,'i').length)x='<i>'+x+'</i>';
      if(pvKids(rp,'b').length)x='<b>'+x+'</b>';
    }
    h+=x;
  });
  return'<p'+(st?' style="'+st+'"':'')+'>'+h+'</p>';
}
function pvTable(tbl){
  var grid=pvKids(pvKids(tbl,'tblGrid')[0],'gridCol').map(function(c){return Number(pvAt(c,'w'))||0;});
  var open={},rows=pvKids(tbl,'tr').map(function(tr){
    var col=0,list=[];
    pvKids(tr,'tc').forEach(function(tc){
      var pr=pvKids(tc,'tcPr')[0],gs=pr?pvKids(pr,'gridSpan')[0]:null,vmEl=pr?pvKids(pr,'vMerge')[0]:null,span=gs?(Number(pvAt(gs,'val'))||1):1;
      var vm=vmEl?(pvAt(vmEl,'val')==='restart'?'restart':'cont'):'',o={col:col,span:span,tc:tc,rs:1,skip:false};
      if(vm==='cont'&&open[col]){open[col].rs++;o.skip=true;}
      else if(vm==='restart')open[col]=o;
      else delete open[col];
      list.push(o);col+=span;
    });
    return list;
  });
  var tw=grid.reduce(function(a,b){return a+b;},0);
  var h='<table style="width:'+pvPx(tw)+'px"><colgroup>'+grid.map(function(w){return'<col style="width:'+pvPx(w)+'px">';}).join('')+'</colgroup><tbody>';
  rows.forEach(function(list){
    h+='<tr>';
    list.forEach(function(o){
      if(o.skip)return;
      h+='<td'+(o.span>1?' colspan="'+o.span+'"':'')+(o.rs>1?' rowspan="'+o.rs+'"':'')+'>'+pvBlocks(o.tc)+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function pvBlocks(el){
  var h='';
  Array.prototype.forEach.call(el.childNodes,function(c){
    if(c.nodeType!==1)return;
    if(c.localName==='p')h+=pvPara(c);else if(c.localName==='tbl')h+=pvTable(c);
  });
  return h;
}
/* масштаб листа под ширину окна: лист A4 (794 px) на телефоне уменьшается целиком */
function pvFit(){
  var ov=$('#pvOv');if(!ov)return;
  var sc=ov.querySelector('.pvscroll'),fit=ov.querySelector('.pvfit');
  if(!sc||!fit)return;
  var k=Math.min(1,(sc.clientWidth-24)/794);
  fit.style.zoom=k>0?String(Math.round(k*1000)/1000):'1';
}
function pvClose(){
  var ov=$('#pvOv');
  if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);
  var w=$('.wrap');if(w){try{w.inert=false;}catch(e){}w.removeAttribute('aria-hidden');}
  document.documentElement.classList.remove('pvlock');
  var f=pvState&&pvState.focus;pvState=null;
  if(f&&f.isConnected&&f.focus)try{f.focus();}catch(e){}
}
function pvOpen(r){
  var xml,doc,body;
  try{
    xml=ttkDocXml(ttkModel(r));
    doc=new DOMParser().parseFromString(xml,'application/xml');
    if(doc.getElementsByTagName('parsererror').length)throw new Error('xml');
    body=doc.getElementsByTagNameNS(PV_W,'body')[0];
  }catch(e){flash('Не удалось собрать предпросмотр');return;}
  var ov=$('#pvOv');
  if(!ov){ov=document.createElement('div');ov.id='pvOv';ov.className='pvov';ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Предпросмотр ТТК');document.body.appendChild(ov);}
  var m=ttkModel(r),bad=ttkIssues(r,compute(r,S.ings)).filter(function(x){return x[0]==='bad';}).length;
  ov.innerHTML='<div class="pvbar"><span class="pvh"><b>Предпросмотр ТТК №'+esc(m.num)+'</b><span class="pvn"> Так карта выглядит в документе; переносы страниц в Word могут отличаться.'+(bad?' Есть то, что нужно исправить перед скачиванием.':'')+'</span></span>'
    +'<span class="pvbtn">'+(canDl()?'<button class="btn primary" type="button" data-pv="dl">Скачать (.docx)</button>':'')+'<button class="btn" type="button" data-pv="close" id="pvClose">Закрыть</button></span></div>'
    +'<div class="pvscroll"><div class="pvfit"><div class="pvpage" id="pvPage">'+pvBlocks(body)+'</div></div></div>';
  pvState={focus:document.activeElement,rid:S.active};
  var w=$('.wrap');if(w){try{w.inert=true;}catch(e){}w.setAttribute('aria-hidden','true');}
  document.documentElement.classList.add('pvlock');
  pvFit();
  var cb=$('#pvClose');if(cb)cb.focus();
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('#pvOv [data-pv]');if(!b)return;
  if(b.getAttribute('data-pv')==='close')pvClose();
  else if(b.getAttribute('data-pv')==='dl'){var r=pvState&&S.recipes[pvState.rid];if(r)doDownloadTtk(r);}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#pvOv')){e.preventDefault();pvClose();}});
window.addEventListener('resize',pvFit);

/* похожие ТТК из своей базы: по словам в названии и общему сырью; из них берутся образцы формулировок */
function aiSimilar(r,keys){
  function words(s){return String(s||'').toLowerCase().replace(/[^а-яёa-z0-9\s]/g,' ').split(/\s+/).filter(function(w){return w.length>3;});}
  var my=words(aiDishName(r)),mine={},list=[];
  ttkRowList(r).forEach(function(x){if(x.ing)mine[x.ing]=1;});
  Object.keys(S.recipes).forEach(function(id){
    var o=S.recipes[id];
    if(o===r||!o||!o.ttk)return;
    if(!keys.some(function(k){return String(o.ttk[k]||'').trim().length>15;}))return;
    var sc=0,w=words(aiDishName(o));
    my.forEach(function(a){if(w.indexOf(a)>-1)sc+=3;});
    (o.rows||[]).forEach(function(x){if(x&&x.ing&&mine[x.ing])sc+=1;});
    list.push({o:o,sc:sc});
  });
  list.sort(function(a,b){return b.sc-a.sc;});
  return list.slice(0,3).map(function(x){return x.o;});
}
/* plain: запрос для обычного чата (ответ читает человек), иначе для вставки в карту (организолептика — JSON) */

  if(k==='tech'){
    ex=aiSimilar(r,['t42']);
    if(ex.length)u+='\nОбразцы технологии из похожих карт этой организации (только для стиля и порядка операций, состав не копируй):\n'+ex.map(function(o,i){return'['+(i+1)+'] '+aiDishName(o)+'\n'+String(o.ttk.t42).trim().slice(0,900);}).join('\n\n')+'\n';
    var cur=String(ttkVal(r,'t42')||'').trim();
    if(cur)u+='\nУже написано (учти и улучши, ничего важного не теряй):\n'+cur.slice(0,1500)+'\n';
    u+='\nНапиши раздел «4.2. Технология приготовления»: от 4 до 9 пунктов по порядку операций, каждый пункт с новой строки, без номеров.';
  }else{
    ex=aiSimilar(r,['look','color','texture','taste']);
    if(ex.length)u+='\nОбразцы органолептики из похожих карт этой организации (для стиля):\n'+ex.map(function(o,i){return'['+(i+1)+'] '+aiDishName(o)+'\n'+AI_ORG.map(function(f){return f[1]+': '+String(o.ttk[f[0]]||'').trim().slice(0,200);}).join('\n');}).join('\n\n')+'\n';

      ?'Ответь четырьмя строками: «Внешний вид: …», «Цвет: …», «Консистенция: …», «Вкус и запах: …».'
      :'Верни только JSON-объект без пояснений и без markdown с ключами look (внешний вид), color (цвет), texture (консистенция), taste (вкус и запах). Каждое значение — короткая фраза в стиле образцов.');
  }
  return{system:AI_SYS,user:u};
}
function aiCleanSteps(t){
  return String(t||'').replace(/```[a-z]*/gi,'').replace(/\*\*/g,'').split(/\r?\n/).map(function(l){
    return l.replace(/^\s*(?:[-–—•*]|\d+(?:\.\d+)*[.)])\s+/,'').trim();
  }).filter(function(l){return l&&!/^(?:4\.2\.?\s*)?технология приготовления:?$/i.test(l);}).join('\n').slice(0,3000);
}
function aiParseOrgano(t){
  t=String(t||'');
  var a=t.indexOf('{'),b=t.lastIndexOf('}'),o,out={},ok=false;
  if(a<0||b<a)return null;
  try{o=JSON.parse(t.slice(a,b+1));}catch(e){return null;}
  if(!o||typeof o!=='object')return null;
  AI_ORG.forEach(function(f){
    var v=o[f[0]];
    if(Array.isArray(v))v=v.join(', ');
    v=String(v==null?'':v).replace(/\s+/g,' ').trim().slice(0,300);
    out[f[0]]=v;if(v)ok=true;
  });
  return ok?out:null;
}
