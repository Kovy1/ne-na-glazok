function todayRu(){var d=new Date();function z(n){return(n<10?'0':'')+n;}return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+d.getFullYear();}
function priceNum(s){
  var t=String(s==null?'':s).replace(/[\s ₽]/g,'').replace(/руб\.?$/i,'').replace(',','.');
  if(!/^\d+(\.\d+)?$/.test(t))return null;
  return Number(t);
}
function cleanPriceName(s){return String(s==null?'':s).replace(/^[\s\-–•]+/,'').replace(/\s+/g,' ').trim();}
var ODT_T='urn:oasis:names:tc:opendocument:xmlns:table:1.0',ODT_X='urn:oasis:names:tc:opendocument:xmlns:text:1.0';
function odtRows(xml){
  var doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('xml');
  var rows=[];
  Array.prototype.forEach.call(doc.getElementsByTagNameNS(ODT_T,'table-row'),function(tr){
    var cells=[];
    Array.prototype.forEach.call(tr.childNodes,function(c){
      if(c.nodeType!==1||c.namespaceURI!==ODT_T||(c.localName!=='table-cell'&&c.localName!=='covered-table-cell'))return;
      var t=[];
      Array.prototype.forEach.call(c.getElementsByTagNameNS(ODT_X,'p'),function(p){var s=p.textContent.replace(/\s+/g,' ').trim();if(s)t.push(s);});
      var rep=Math.min(Number(c.getAttributeNS(ODT_T,'number-columns-repeated'))||1,4);
      for(var k=0;k<rep;k++)cells.push(t.join(' '));
    });
    if(cells.some(Boolean))rows.push(cells);
  });
  return rows;
}
function startPrice(rows,fileName){
  var items=[];
  rows.forEach(function(cells){
    var name=cleanPriceName(cells[0]);
    if(!name)return;
    var price=null,k;
    for(k=1;k<cells.length;k++){var v=priceNum(cells[k]);if(v!==null){price=v;break;}}
    if(price===null&&/^(наименование|название|продукт|товар)/i.test(name))return;
    var mt=matchIng(name,S.ings),pick=mt.id;
    if(mt.how==='fuzzy'&&mt.score<0.6)pick='';
    items.push({name:name,price:price,ing:pick,how:pick?mt.how:'none',score:mt.score,guess:mt.id,remember:mt.how==='fuzzy'&&!!pick,add:false});
  });
  S.price={file:fileName,items:items};
  S.tab='base';S.bsub='price';S.pview='tbl';renderAll();
  var c=$('#priceCard');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'});
}
function onPriceFile(file){
  if(!file)return;
  var ext=(/\.([a-z0-9]+)$/i.exec(file.name)||[])[1];ext=(ext||'').toLowerCase();
  if(ext==='odt'){
    if(typeof DecompressionStream==='undefined'){flash('Этот браузер не открывает .odt. Нужен современный Chrome, Edge, Firefox или Safari.');return;}
    var fr=new FileReader();
    fr.onerror=function(){flash('Не удалось прочитать файл');};
    fr.onload=function(){
      unzipEntry(fr.result,'content.xml').then(function(u8){

function doPriceApply(){
  var t=S.price;if(!t)return;
  var n=0,skipped=0,g=curRegion(),made={},nNew=0;
  t.items.forEach(function(x){
    if(x.price===null)return;
    var id=x.ing;
    if(!id&&x.add){
      var k=normKey(x.name);
      if(!made[k]){made[k]=addNewIng(x.name,'Добавлено из прайса: значения КБЖУ не заполнены');nNew++;}
      id=made[k];
    }
    if(!id){skipped++;return;}
    var ing=S.ings[id];if(!ing)return;
    var rec=recFor(ing,g,true);rec.price=x.price;rec.priceSrc=x.name.slice(0,200);
    if(x.ing&&x.remember&&x.how!=='alias'&&x.how!=='exact')addAlias(x.ing,x.name);
    queueSave('ingredients',id);n++;
  });
  S.price=null;S.pnoprice=false;renderAll();
  flash('Цены загружены в «'+regionName(g)+'»: '+n+(nNew?', новое сырьё: '+nNew:'')+(skipped?', пропущено: '+skipped:''));
}

function mAvg(arr){
  var co=[],pr=[],full=[],ic=0,ifu=0;
  arr.forEach(function(it){
    var m=it.m;
    if(m.cost!==null){co.push(m.cost);if(!m.complete)ic++;}
    if(m.price!==null)pr.push(m.price);
    if(m.price!==null&&m.cost!==null){full.push(m);if(!m.complete)ifu++;}
  });
  function av(a){a=a.filter(function(v){return v!==null&&v!==undefined;});return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:null;}
  function avk(k){return av(full.map(function(m){return m[k];}));}
  return{n:arr.length,nc:co.length,np:pr.length,nf:full.length,ic:ic,ifu:ifu,cost:av(co),price:av(pr),markup:avk('markup'),margin:avk('margin'),profit:avk('profit'),fc:avk('fc')};
}

/* папки на Диске («1.Первые блюда», «2.Вторые блюда»…) -> папки меню: номер в начале задаёт порядок и в название не входит */
function syDirTitle(name){var n=String(name||'').replace(/\s+/g,' ').trim(),t=n.replace(/^\d+\s*[.)\]:\-–—]*\s*/,'').trim();return(t||n).slice(0,60);}
function syDirOrd(name){var m=/^\s*(\d+)/.exec(String(name||''));return m?parseInt(m[1],10):null;}
function syDriveTitles(){
  var by={};
  syDirs().forEach(function(d){
    var t=syDirTitle(d.name),k=normKey(t),o=syDirOrd(d.name);
    if(!k)return;
    if(!by[k])by[k]={name:t,ord:o};
    else if(o!==null&&(by[k].ord===null||o<by[k].ord))by[k].ord=o;
  });
  return Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){
    var x=a.ord===null?1e9:a.ord,y=b.ord===null?1e9:b.ord;
    return x-y||String(a.name).localeCompare(String(b.name),'ru');
  });
}
/* название блюда или файла для сопоставления: без «ТТК», номеров, веса и единиц */
var SY_MSTOP={'ттк':1,'г':1,'гр':1,'мл':1,'кг':1,'л':1,'шт':1,'порц':1,'порция':1,'выход':1,'docx':1};
function syMatchKey(s){
  return normKey(String(s||'').replace(/\.docx$/i,'').replace(/[0-9]+(?:[.,][0-9]+)?/g,' ')).split(' ').filter(function(w){return w&&!SY_MSTOP[w];}).join(' ');
}
/* тот же файл ТТК в облаке: то же блюдо и тот же номер (если номера нет у одного из двух, совпасть должна и порция); правило такое же, как в скрипте */
function syTtkNum(n){var m=/№\s*(\d+)/.exec(String(n||''));return m?m[1]:'';}
function syTtkSize(n){return(String(n||'').replace(/\.docx$/i,'').replace(/№\s*\d+/g,' ').match(/\d+(?:[.,]\d+)?/g)||[]).join('/').replace(/,/g,'.');}
function syTtkSame(a,b){
  var ka=syMatchKey(a),kb=syMatchKey(b),na=syTtkNum(a),nb=syTtkNum(b),sa,sb;
  if(!ka||ka!==kb)return false;
  if(na&&nb)return na===nb;
  sa=syTtkSize(a);sb=syTtkSize(b);
  return!sa||!sb||sa===sb;
}
/* принятый файл библиотеки с тем же блюдом: сначала в регионе reg, потом (если он один во всей библиотеке) в любом */
function syOldFileFor(name,reg){
  var all=syFiles().filter(function(x){return x.kind==='main'&&syTtkSame(x.name,name);});
  var here=all.filter(function(x){return(x.reg||'')===(reg||'');});
  if(here.length===1)return here[0];
  if(here.length>1){var ex=here.filter(function(x){return x.name===name;});return ex.length===1?ex[0]:null;}
  return all.length===1?all[0]:null;
}
/* файл ТТК для библиотеки. Если файл этого блюда там уже есть, новый встаёт на его место и под его названием, а прежний уходит в «Архив» */
function syTtkJob(r){
  var m=ttkModel(r),nm=safeName('ТТК №'+m.num+' '+m.dish)+'.docx',tg=syTargetForRec(r),old=syOldFileFor(nm,tg.reg),rep='';
  if(old){nm=old.name;tg={reg:old.reg||'',dir:old.dir||''};rep=old.id;}
  return{name:nm,buf:buildTtkDocx(m),tg:tg,rep:rep};
}
/* блюда без папки: если файл с похожим названием лежит ровно в одной папке Диска, блюдо кладётся в папку меню с этим названием */
function syDriveAssign(){
  var cands=[],n=0,amb=0;
  syFiles().forEach(function(x){
    if(x.kind!=='main'||!x.dir)return;
    var di=syDirInfo(x.dir),k=syMatchKey(x.name);
    if(di&&k)cands.push({k:k,t:normKey(syDirTitle(di.name)),reg:x.reg||''});
  });
  Object.keys(S.recipes).forEach(function(id){
    var r=S.recipes[id];
    if(r.cat&&catById(r.cat))return;
    var rk=syMatchKey(r.name),hit={},cnt=0;
    if(rk.length<3)return;
    cands.forEach(function(f){
      if(r.reg&&regKnown(r.reg)&&f.reg&&f.reg!==r.reg)return;
      if(f.k===rk||(rk.length>=5&&f.k.indexOf(rk)>-1)||(f.k.length>=5&&rk.indexOf(f.k)>-1)){if(!hit[f.t]){hit[f.t]=1;cnt++;}}
    });
    if(cnt>1){amb++;return;}
    if(cnt!==1)return;
    var title=Object.keys(hit)[0],c=menuCats().filter(function(x){return normKey(x.name)===title;})[0];
    if(c){r.cat=c.id;queueSave('recipes',id);n++;}
  });
  return{n:n,amb:amb};
}

/* ---- ТТК по раскладке облака: блюдо ↔ файл в «ТТК в облаке» (то же блюдо и номер); от файла берутся папка и регион ---- */
function syFileById(id){return syFiles().filter(function(x){return x.id===id;})[0]||null;}
function lyFileTitle(f){var d=f&&f.dir?syDirInfo(f.dir):null;return d?syDirTitle(d.name):'';}
function lyCatFor(title,make){
  var k=normKey(title),c=menuCats().filter(function(x){return normKey(x.name)===k;})[0];
  if(c)return c.id;
  if(!make||menuCats().length>=60||!String(title||'').trim())return'';
  c={id:newId(),name:String(title).slice(0,60)};ensureMenu().push(c);
  return c.id;
}
function lyMatch(r,f){
  var rk=syMatchKey(r.name),fk=syMatchKey(f.name),rn=(r.ttk&&r.ttk.num)?String(r.ttk.num).replace(/\D/g,''):syTtkNum(r.name),fn=syTtkNum(f.name);
  if(!rk||!fk)return false;
  if(rn&&fn&&rn!==fn)return false;
  if(fk===rk)return rk.length>=3||!!(rn&&fn);      /* короткое название («Щи») — только при одинаковом номере ТТК */
  return(rk.length>=5&&fk.indexOf(rk)>-1)||(fk.length>=5&&rk.indexOf(fk)>-1);
}
/* что изменится: у каких блюд другая папка и у каких не задан регион (без изменений данных) */
function lyPlan(){
  var files=syFiles().filter(function(x){return x.kind==='main'&&(x.dir||x.reg);}),multi=regionList().length>1,out={items:[],cat:0,reg:0,amb:0,none:0};
  Object.keys(S.recipes).forEach(function(id){
    var r=S.recipes[id],rr=(r.reg&&regKnown(r.reg))?r.reg:'',cand=files.filter(function(f){return(!rr||!f.reg||f.reg===rr)&&lyMatch(r,f);}),titles={},regs={},nt=0,nr=0,it={id:id},cur;
    if(!cand.length){out.none++;return;}
    cand.forEach(function(f){
      var t=lyFileTitle(f),k=normKey(t);
      if(t&&!titles[k]){titles[k]=t;nt++;}
      if(f.reg&&regKnown(f.reg)&&!regs[f.reg]){regs[f.reg]=1;nr++;}
    });
    if(nt===1){
      var title=titles[Object.keys(titles)[0]];cur=r.cat&&catById(r.cat);
      if(!cur||normKey(cur.name)!==normKey(title)){it.title=title;out.cat++;}
    }else if(nt>1)out.amb++;
    if(!rr&&multi&&nr===1){it.reg=Object.keys(regs)[0];out.reg++;}
    if(it.title||it.reg)out.items.push(it);
  });
  return out;
}
function lyApply(p){
  var nc=0,nr=0,touched=false;
  p.items.forEach(function(it){
    var r=S.recipes[it.id],cid;
    if(!r)return;
    if(it.title){cid=lyCatFor(it.title,true);if(cid){r.cat=cid;nc++;touched=true;}}
    if(it.reg){r.reg=it.reg;nr++;}
    queueSave('recipes',it.id);
  });
  if(touched)saveMenu();
  return{cat:nc,reg:nr};
}

function abChartLeave(){var tip=$('#abTip'),hi=$('#abHi');if(tip)tip.hidden=true;if(hi)hi.style.display='none';}
function abChartMove(e){
  var box=$('#abChart'),svg=box&&box.querySelector('svg'),pts=S.abPts,tip=$('#abTip');
  if(!svg||!tip||!pts||!pts.length)return;
  var rc=svg.getBoundingClientRect(),W=Number(svg.getAttribute('width'))||rc.width,k=rc.width?W/rc.width:1;
  var mL=Number(svg.getAttribute('data-ml')),pw=Number(svg.getAttribute('data-pw')),n=pts.length,slot=pw/n;
  var x=(e.clientX-rc.left)*k,i=Math.floor((x-mL)/slot);
  if(x<mL-4||x>mL+pw+4){abChartLeave();return;}
  if(i<0)i=0;if(i>=n)i=n-1;
  var hi=svg.querySelector('#abHi');
  if(hi){hi.setAttribute('x',mL+slot*i);hi.setAttribute('width',slot);hi.style.display='';}
  var x0=pts[i];
  tip.textContent='';
  var hd=document.createElement('div');hd.className='tn1';hd.textContent='№'+x0.rank+' · '+x0.name+' · класс '+x0.cls;tip.appendChild(hd);
  function line(v,l){var dv=document.createElement('div'),st=document.createElement('strong'),sp=document.createElement('span');st.textContent=v;sp.textContent=' '+l;dv.appendChild(st);dv.appendChild(sp);tip.appendChild(dv);}
  line(abValStr(x0),abMetricName().toLowerCase());
  line(fmt(x0.share,1)+' %','доля');
  line(fmt(x0.cum,1)+' %','накопленная доля');
  tip.hidden=false;
  var px=(mL+slot*i+slot/2)/k,tw=tip.offsetWidth,left=px+14;
  if(left+tw>rc.width)left=px-14-tw;
  if(left<0)left=0;
  tip.style.left=left+'px';
}

/* ---- загрузка продаж из таблицы ---- */
function startSales(rows,fileName){
  var items=[],fake={},vm=visMap();
  Object.keys(vm).forEach(function(id){fake[id]={name:dishKey(vm[id].name)};});
  parseSales(rows).forEach(function(x){
    var mt=x.qty===null?{id:'',how:'none',score:0}:matchRecipe(x.name,vm,fake);
    var pick=mt.id;if(mt.how==='fuzzy'&&mt.score<0.6)pick='';
    items.push({name:x.name,qty:x.qty,rec:pick,how:pick?mt.how:'none',score:mt.score,guess:mt.id,remember:mt.how==='fuzzy'&&!!pick&&!mt.multi});
  });
  if(!items.length){flash('В таблице нет строк с названием блюда');return;}
  S.sales={file:fileName,items:items,clear:true};
  S.tab='abc';renderAll();
  var c=$('#salesCard');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'});
}
function onSalesFile(file){
  var ext=(/\.([a-z0-9]+)$/i.exec(file.name)||[])[1];ext=(ext||'').toLowerCase();
  if(ext==='csv'||ext==='tsv'||ext==='txt'){
    readTextFile(file,function(err,text){
      if(err){flash('Не удалось прочитать файл');return;}
      var rows=parseRecords(text);
      if(!rows.length){flash('В файле нет строк');return;}
      startSales(rows,file.name);
    });
  }else flash('Нужен файл .csv, .tsv или .txt. Из Excel: «Сохранить как → CSV» или скопируйте таблицу и вставьте в поле.');
}
function salesStatus(x){
  if(x.qty===null)return['neutral','Нет количества'];
  if(!x.rec)return['bad','Не найдено'];
  if(x.how==='alias')return['ok','Запомнено'];
  if(x.how==='exact')return['ok','Совпало'];
  if(x.how==='fuzzy')return['warn','Проверьте'];
  return['neutral','Выбрано вами'];
}
function salesRowHtml(x,i,opts){

function salesCardHtml(){

    if(x.qty===null)none.push(i);

  });
  function block(list,title,open){
    if(!list.length)return'';
    var head='<div class="trow thead"><span>В таблице</span><span class="r">Порций</span><span>Блюдо в базе</span><span>Статус</span></div>';
    return'<details class="pgroup"'+(open?' open':'')+'><summary>'+title+' · '+list.length+'</summary><div class="trows">'+head+list.map(function(i){return salesRowHtml(t.items[i],i,opts);}).join('')+'</div></details>';
  }
  var per={},rows=0,lost=0,tq=0,clr=0;
  t.items.forEach(function(x){if(x.qty===null)return;if(x.rec&&S.recipes[x.rec]){per[x.rec]=(per[x.rec]||0)+x.qty;rows++;}else lost+=x.qty;});
  var nD=Object.keys(per).length,merged=rows-nD;
  Object.keys(per).forEach(function(id){tq+=per[id];});
  if(t.clear)visIds().forEach(function(id){var q=S.recipes[id].qty;if(q&&q[g]>0&&!per[id])clr++;});
  var h='<section class="card ttk" id="salesCard"><h2>Загружены продажи</h2>'
    +'<p class="rgtag">Продажи запишутся в регион «'+esc(regionName(g))+'»</p>'
    +'<p class="hint" style="margin-top:2px">Источник: '+esc(t.file)+', строк: '+t.items.length+'. Проверьте, что название из таблицы сопоставлено нужному блюду. Выберите блюдо из списка или оставьте «пропустить».</p>'
    +block(need,'Нужно выбрать блюдо',true)+block(check,'Проверьте соответствие',true)+block(ok,'Совпали по названию',false)+block(none,'Без количества (пропущены)',false);
  var notes=[];
  if(need.length)notes.push(['warn','Блюдо не выбрано в '+need.length+' '+plural(need.length,['строке','строках','строках'])+', порций в них: '+fmt(lost,0)+'. Они не загрузятся.']);
  if(merged>0)notes.push(['warn','Несколько строк таблицы относятся к одному блюду ('+merged+'): количества сложатся.']);
  if(t.clear&&clr)notes.push(['warn','У '+clr+' '+plural(clr,['блюда','блюд','блюд'])+' региона продажи были, а в таблице их нет: они будут очищены.']);
  notes.push([nD?'good':'warn','К загрузке готово: '+nD+' '+plural(nD,['блюдо','блюда','блюд'])+', порций: '+fmt(tq,0)+'.']);
  h+='<ul class="warns">'+notes.map(function(n){return'<li class="w-'+n[0]+'">'+n[1]+'</li>';}).join('')+'</ul>';
  h+='<label class="trem" style="margin-top:12px"><input type="checkbox" data-act="salesClear" data-edit data-fk="sales:clear"'+(t.clear?' checked':'')+'>Сначала очистить продажи региона «'+esc(regionName(g))+'»: новый период заменяет прежний</label>';
  h+='<div class="btns" style="margin-top:12px"><button class="btn primary" data-act="aApply" data-edit'+(nD?'':' disabled')+'>Загрузить продажи: '+nD+' '+plural(nD,['блюдо','блюда','блюд'])+'</button><button class="btn" data-act="aCancel">Отмена</button></div></section>';
  return h;
}
function addRecipeAlias(id,name){
  var r=S.recipes[id];if(!r)return;
  var k=normKey(name);if(!k||k===normKey(r.name))return;
  if(!r.aliases)r.aliases=[];
  if(r.aliases.indexOf(k)<0&&r.aliases.length<20)r.aliases.push(k);
}
function doSalesApply(){
  var t=S.sales;if(!t)return;
  var g=curRegion(),per={},changed={},n=0;
  t.items.forEach(function(x){if(x.qty===null||!x.rec||!S.recipes[x.rec])return;per[x.rec]=(per[x.rec]||0)+x.qty;});
  if(t.clear)visIds().forEach(function(id){
    var r=S.recipes[id];
    if(r.qty&&r.qty[g]&&!per[id]){delete r.qty[g];if(!Object.keys(r.qty).length)delete r.qty;changed[id]=1;}
  });
  Object.keys(per).forEach(function(id){
    var r=S.recipes[id];if(!r.qty)r.qty={};
    r.qty[g]=Math.round(per[id]*1000)/1000;changed[id]=1;n++;
  });
  t.items.forEach(function(x){
    if(x.qty!==null&&x.rec&&S.recipes[x.rec]&&x.remember&&x.how!=='alias'&&x.how!=='exact'){addRecipeAlias(x.rec,x.name);changed[x.rec]=1;}
  });
  Object.keys(changed).forEach(function(id){queueSave('recipes',id);});
  S.sales=null;S.aPaste=undefined;renderAll();
  flash('Продажи загружены в «'+regionName(g)+'»: '+n+' '+plural(n,['блюдо','блюда','блюд']));
}
function doSalesClear(){
  var g=curRegion(),n=0;
  visIds().forEach(function(id){
    var r=S.recipes[id];
    if(r.qty&&r.qty[g]){delete r.qty[g];if(!Object.keys(r.qty).length)delete r.qty;queueSave('recipes',id);n++;}
  });
  S.aPaste=undefined;renderAll();
  flash('Продажи региона «'+regionName(g)+'» очищены: '+n+' '+plural(n,['блюдо','блюда','блюд']));
}

S.cloud={};S.cloudBusy={};
function cloudLinks(){var d=null;try{d=JSON.parse(lsGet('kbzhu:links')||'null');}catch(e){d=null;}return(d&&typeof d==='object')?d:{};}
function cloudGet(kind){var l=cloudLinks()[curRegion()];return(l&&l[kind])||'';}
function cloudSet(kind,val){
  var all=cloudLinks(),g=curRegion();
  if(!all[g]||typeof all[g]!=='object')all[g]={};
  if(!val)delete all[g][kind];else all[g][kind]=(val===true)?true:String(val).slice(0,1000);
  if(!Object.keys(all[g]).length)delete all[g];
  lsSet('kbzhu:links',JSON.stringify(all));
}
function cloudErrText(e){
  if(e&&e.code==='http'){
    if(e.status===404||e.status===400)return'Таблица не найдена ('+e.status+'). Проверьте ссылку.';
    if(e.status===401||e.status===403)return'Нет доступа ('+e.status+'). Опубликуйте таблицу в интернете или откройте доступ «Все, у кого есть ссылка».';
    return'Сервер ответил ошибкой '+e.status+'.';
  }
  if(e&&e.code==='cors'&&e.via==='gpub')return CLOUD_ERR.corsPub;
  return CLOUD_ERR[e&&e.code]||CLOUD_ERR.net;
}
function reach(url){
  if(typeof fetch!=='function')return Promise.resolve(false);
  return fetch(url,{mode:'no-cors',credentials:'omit',cache:'no-store'}).then(function(){return true;},function(){return false;});
}
/* Скрипт с адреса Google: ответ приходит вызовом функции. Если скрипт загрузился, а функция не вызвана, таблица недоступна без входа */
function jsonpGet(url,ms){
  return new Promise(function(resolve,reject){
    var name='__kbzhuGv'+Math.random().toString(36).slice(2,9),sc=document.createElement('script'),done=false,tm;
    function end(){done=true;clearTimeout(tm);try{delete window[name];}catch(e){window[name]=undefined;}if(sc.parentNode)sc.parentNode.removeChild(sc);}
    window[name]=function(d){if(done)return;end();resolve(d);};
    sc.onerror=function(){if(done)return;end();reject({code:'blocked'});};
    sc.onload=function(){setTimeout(function(){if(!done){end();reject({code:'gv'});}},0);};
    tm=setTimeout(function(){if(done)return;end();reject({code:'gv'});},ms||15000);
    sc.async=true;sc.src=url.replace('__CB__',name);
    document.head.appendChild(sc);
  });
}
function cloudFetch(link){
  var u=cloudUrl(link);
  if(u.err)return Promise.reject({code:u.err});
  if(u.via==='gsheet'){
    return jsonpGet(u.url).then(function(d){
      var rows=gvizRows(d);
      if(!rows)throw{code:'gv'};
      return{rows:rows,via:u.via};
    });
  }
  function get(url){
    var ctl=typeof AbortController!=='undefined'?new AbortController():null,tm=ctl?setTimeout(function(){ctl.abort();},20000):null;
    return fetch(url,{credentials:'omit',cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(res){
      clearTimeout(tm);
      if(!res.ok)throw{code:'http',status:res.status};
      return res;
    },function(e){
      clearTimeout(tm);
      if(e&&e.name==='AbortError')throw{code:'timeout'};
      /* сеть не дала прочитать ответ: выясняем, дошёл ли запрос (тогда виноваты права доступа или CORS) или страница вообще не может обратиться по ссылке */
      return reach(url).then(function(ok){throw{code:ok?'cors':'blocked',via:u.via};});
    });
  }
  var step=u.via==='yandex'
    ?get('https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key='+encodeURIComponent(u.url)).then(function(r){return r.json();}).then(function(j){if(!j||!j.href)throw{code:'net'};return get(j.href);})
    :get(u.url);
  return step.then(function(res){return res.arrayBuffer();}).then(function(buf){
    if(buf.byteLength>5*1024*1024)throw{code:'big'};
    var text;
    try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf);}
    catch(e){try{text=new TextDecoder('windows-1251').decode(buf);}catch(e2){throw{code:'enc'};}}
    if(looksHtml(text))throw{code:'html'};
    return{rows:parseRecords(text,true),via:u.via};
  });
}
function rowsToCsvText(rows){return rows.map(function(r){return r.map(function(v){return csvCell(String(v==null?'':v).replace(/[\t\r\n]+/g,' '));}).join(';');}).join('\r\n');}
function cloudStatus(kind,state,msg){
  S.cloud[kind]={state:state,msg:msg};
  var el=$('#cm-'+kind);
  if(el){el.textContent=msg;el.className='hint cmsg '+state;el.hidden=!msg;}
  var b=$('[data-act="cLoad"][data-k="'+kind+'"]');if(b)b.disabled=(state==='busy')||uiRO();
}
function nowHm(){var d=new Date();function z(n){return(n<10?'0':'')+n;}return z(d.getHours())+':'+z(d.getMinutes());}
function doCloudLoad(kind){
  if(S.cloudBusy[kind])return;
  if(NOPRICE&&(kind==='price'||kind==='sales')){cloudStatus(kind,'err','Нет доступа к ценам: загрузка закрыта.');return;}
  var inp=$('#cu-'+kind),link=(inp?inp.value:cloudGet(kind)).trim();
  if(inp)cloudSet(kind,link);
  var g=curRegion();
  S.cloudBusy[kind]=true;cloudStatus(kind,'busy','Загружаю…');
  cloudFetch(link).then(function(r){
    S.cloudBusy[kind]=false;
    if(curRegion()!==g){cloudStatus(kind,'err','Регион сменился во время загрузки. Загрузите ещё раз.');return;}
    var rows=r.rows;
    if(!rows.length){cloudStatus(kind,'err','В таблице по ссылке нет строк.');return;}
    cloudStatus(kind,'ok','Получено строк: '+rows.length+' · '+nowHm());
    if(kind==='base'){
      S.importOpen=true;S.cloudText=rowsToCsvText(rows);
      S.importMsg='Из ссылки получено строк: '+rows.length+'. Проверьте текст ниже и нажмите «Добавить в базу».';
      S.tab='base';renderAll();
      var ta=$('#impText');if(ta){ta.value=S.cloudText;}
      S.cloudText=null;
      var ic=$('.import');if(ic&&ic.scrollIntoView)ic.scrollIntoView({block:'nearest'});
    }else if(kind==='price'){startPrice(rows,'таблица по ссылке');}
    else if(kind==='recipes'){var er=startRecs(rows,'таблица по ссылке');if(er)cloudStatus(kind,'err',er);}
    else{startSales(rows,'таблица по ссылке');}
  },function(e){
    S.cloudBusy[kind]=false;
    cloudStatus(kind,'err',cloudErrText(e));
  });
}
/* ссылки можно передать в адресе страницы: …/файл.html#base=https%3A%2F%2F… Они только подставляются в поля, загрузка идёт по кнопке */
function cloudFromUrl(){
  var q=String(location.hash||'').replace(/^#/,'')+'&'+String(location.search||'').replace(/^\?/,''),got=[];
  ['base','price','sales'].forEach(function(k){
    var m=new RegExp('(?:^|&)'+k+'=([^&]*)').exec(q),v='';
    if(!m)return;
    try{v=decodeURIComponent(m[1].replace(/\+/g,' '));}catch(e){v='';}
    if(/^https?:\/\//i.test(v)&&v.length<=1000){cloudSet(k,v);got.push(k);}
  });
  if(got.length){
    S.cloudOpen=true;S.cloudOpenS=true;S.cloudUrlNote=true;
    S.tab=(got.indexOf('base')>-1||got.indexOf('price')>-1)?'base':'abc';
  }
}
function autoBase(link,g){
  cloudStatus('base','busy','Обновляю базу по ссылке…');
  return cloudFetch(link).then(function(r){
    var rows=r.rows;
    if(!rows.length)throw{code:'none'};
    if(curRegion()!==g)return;
    var res=importRows(rowsToCsvText(rows),'table');
    cloudStatus('base','ok','Обновлено при открытии: добавлено '+res.add+', обновлено '+res.upd+(res.skip.length?', пропущено строк: '+res.skip.length:'')+' · '+nowHm());
    scheduleRender();
    flash('База обновлена по ссылке: добавлено '+res.add+', обновлено '+res.upd);
  }).catch(function(e){
    cloudStatus('base','err',(e&&e.code==='none')?'В таблице по ссылке нет строк.':cloudErrText(e));
    flash('Не удалось обновить базу по ссылке');
  });
}
/* при открытии страницы: сначала база (чтобы сырьё для ТТК уже было), затем ТТК */
function cloudAutoLoad(){
  var l=cloudLinks()[curRegion()],g=curRegion(),p=Promise.resolve();
  if(l&&!uiRO()&&S.mode==='local'){
    if(l.auto===true&&l.base)p=p.then(function(){return autoBase(l.base,g);});
  }
  /* затем общая база (если подключена и включено получение при открытии) */
  p.then(syAutoPull);
}

/* ---------- ТТК и цены продажи из таблицы ---------- */
/* какое из имеющихся блюд обновит строка таблицы: то же название (или синоним), иначе тот же номер ТТК; пусто — создастся новое */
function recipeTarget(d){
  var mt=matchRecipe(d.name,visMap());
  if(mt.id&&(mt.how==='exact'||mt.how==='alias')&&!mt.multi)return mt.id;
  if(d.num&&d.num!=='__'){
    var found='';
    visIds().forEach(function(id){if(!found&&String(ttkVal(S.recipes[id],'num')||'').trim()===d.num)found=id;});
    if(found)return found;
  }
  return'';
}
function recsMatch(dishes){
  var seen={},items=[];
  dishes.forEach(function(d){d.lines.forEach(function(l){
    var k=normKey(l.name);l.key=k;if(!k)return;
    var it=seen[k];
    if(!it){
      var mt=matchIng(l.name,S.ings),pick=mt.id;
      if(mt.how==='fuzzy'&&mt.score<0.6)pick='';
      it=seen[k]={name:l.name,key:k,count:0,ing:pick,how:pick?mt.how:'none',score:mt.score,guess:mt.id,remember:mt.how==='fuzzy'&&!!pick};
      items.push(it);
    }
    it.count++;
  });});
  return items;
}
/* возвращает текст ошибки или пустую строку; при успехе открывает вкладку «Меню и финансы» с карточкой проверки */
function startRecs(rows,fileName){
  var p=parseRecipeTable(rows);
  if(p.err)return CLOUD_ERR.rtable;
  var dishes=p.dishes.filter(function(d){return d.lines.length;});
  if(!dishes.length)return'В таблице нет строк рецептуры.';
  dishes.forEach(function(d){d.target=recipeTarget(d);});
  S.recs={file:fileName,dishes:dishes,items:recsMatch(dishes),skipped:p.skipped,empty:p.dishes.length-dishes.length};
  S.tab='menu';renderAll();
  var c=$('#recsCard');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'});
  return'';
}
function recsStatus(x){
  if(x.ing==='__new__')return['warn','Новое сырьё'];
  if(!x.ing)return['bad','Не выбрано'];
  if(x.how==='alias')return['ok','Запомнено'];
  if(x.how==='exact')return['ok','Совпало'];
  if(x.how==='fuzzy')return['warn','Проверьте'];
  return['neutral','Выбрано вами'];
}

  var nSubs=t.dishes.reduce(function(a,d){return a+(d.subs?d.subs.length:0);},0);

/* запись блюд в базу: возвращает счётчики. dish.skip — блюдо не записывается (используется при автообновлении) */
function applyRecipes(t){
  var g=curRegion(),created={},map={},res={add:0,upd:0,sell:0,skip:0,newIng:0};
  t.items.forEach(function(x){
    var id=x.ing;
    if(id==='__new__'){
      if(!created[x.key]){
        created[x.key]=newId();
        S.ings[created[x.key]]=normIng({name:x.name,p:0,f:0,c:0,kind:'estimate',source:'Добавлено из таблицы ТТК: значения КБЖУ не заполнены'});
        S.ings[created[x.key]].aliases=[x.key];
        queueSave('ingredients',created[x.key]);res.newIng++;
      }
      id=created[x.key];
    }else if(id&&x.remember&&x.how!=='alias'&&x.how!=='exact')addAlias(id,x.name);
    map[x.key]=id||'';
  });
  t.dishes.forEach(function(d){
    if(d.skip){res.skip++;return;}
    var rows=d.lines.map(function(l){
      var id=map[l.key]||'',ing=id?S.ings[id]:null,row={rid:newId(),ing:id,net:l.net,share:l.share===null?100:l.share};
      if(l.gross!==null&&l.gross!==undefined)row.gross=l.gross;
      var tn=l.tname||((ing&&normKey(ing.name)!==l.key)?l.name:'');
      if(tn)row.tname=tn;
      return row;
    });
    var old=d.target&&S.recipes[d.target],sv=d.sell>0?d.sell:null;
    var subsJ=(d.subs||[]).map(function(x){return{n:x.name,m:x.mass>0?dnum(x.mass,3):'',a:(x.at>0&&rows[x.at-1])?rows[x.at-1].rid:''};});
    if(old){
      old.name=d.name;old.rows=rows;
      if(d.outputGiven)old.output=d.output;
      if(d.num){if(!old.ttk)old.ttk={};old.ttk.num=d.num;}
      if(subsJ.length){if(!old.ttk)old.ttk={};old.ttk.subs=JSON.stringify(subsJ);}
      if(sv)setSell(old,g,sv);
      queueSave('recipes',d.target);res.upd++;
    }else{
      var nt=d.num?{num:d.num}:{};if(subsJ.length)nt.subs=JSON.stringify(subsJ);
      var nr=normRecipe({name:d.name,output:d.outputGiven?d.output:d.outGuess,rows:rows,ttk:nt}),nid=newId();
      if(sv)setSell(nr,g,sv);
      S.recipes[nid]=nr;queueSave('recipes',nid);res.add++;
    }
    if(sv)res.sell++;
  });
  return res;
}
function doRecsApply(){
  var t=S.recs;if(!t)return;
  var res=applyRecipes(t);
  S.recs=null;S.tab='menu';
  if(!S.active||!S.recipes[S.active]){var l=visIds();setActive(l[0]||null);}
  renderAll();
  flash('ТТК загружены: создано '+res.add+', обновлено '+res.upd+(res.sell?', цен продажи: '+res.sell:''));
}

/*GAS-START*/var SY_GAS="/**\n * Общая база для «ТехнолоGии».\n *\n * Как поставить (один раз, около 5 минут):\n *  1. Создайте пустую Google Таблицу. В меню: Расширения → Apps Script.\n *  2. Удалите всё, что там есть, и вставьте этот файл целиком.\n *  3. Замените два кода ниже на свои. Код редактора раздайте сотрудникам (он видит цены, но его правки принимает технолог), код технолога оставьте себе.\n *  4. Выберите в списке функций «setup», нажмите «Выполнить» и разрешите доступ (Google покажет предупреждение\n *     «приложение не проверено»: Дополнительно → Перейти на страницу…). Так создадутся три служебных листа\n *     и папка «ТТК калькулятора» на вашем Google Диске для файлов .docx (её адрес появится в журнале выполнения).\n *  5. Развернуть → Новое развёртывание → тип «Веб-приложение».\n *       Выполнять от имени: Я.   У кого есть доступ: Все.\n *     Нажмите «Развернуть» и скопируйте адрес веб-приложения (он оканчивается на /exec).\n *  6. В калькуляторе откройте вкладку «Личный кабинет», вставьте адрес, своё ФИО и один код (права зависят от кода).\n *\n * Роли и цены. Закупочные цены, себестоимость и цену продажи видят все коды. Что можно делать:\n *   код технолога: всё; принимает и публикует правки, ведёт файлы, файлы цен и страницу по ссылке;\n *   код редактора: работает так же, но любая его правка (в том числе цены и цена продажи) уходит технологу на подтверждение;\n *   код тер. управляющего / менеджера (необязательный; пока в нём стоит «ЗАМЕНИТЕ…», роль выключена): меню и финансы, ABC-анализ, калькуляция ОП-1\n *   и цены сырья; ТТК и библиотека «ТТК в облаке» ему закрыты (скрипт не отдаёт ему файлы); нерассчитанные ТТК он не видит; правки уходят технологу;\n *   код шеф-повара (необязательный): видит всё без права правки; из ТТК — только рассчитанные и принятые файлы в облаке (файлы «На проверке» не отдаются),\n *   плюс калькуляция ОП-1; ничего не отправляет.\n * Данные общей базы отдаются только по коду (любой роли).\n *\n * Проверка ТТК. Предложения редакторов технолог открывает в калькуляторе («Личный кабинет» → «На проверке») прямо как ТТК: может поправить её и\n * опубликовать, отклонить или вернуть автору на доработку (комментарий обязателен). Автор получает уведомление, открывает карту, исправляет\n * и отправляет снова. Всё это хранится на листе «Предложения» (столбцы K–N: ответ технолога, когда и кто решил, пакет до доработки).\n *\n * Проверка файлов. Файлы .docx, которые предложил редактор («ТТК в облаке» → «На проверке»), технолог тоже открывает в калькуляторе и правит.\n * Он принимает файл в выбранный регион и папку (если поправил карту, в библиотеку уходит его версия файла), отклоняет или возвращает автору\n * на доработку с комментарием. Возвращённый файл остаётся в «На проверке» с комментарием технолога, автор исправляет и предлагает файл снова\n * (файл с тем же именем заменяет прежний) или снимает его с проверки.\n *\n * Файлы цен по регионам. Технолог в калькуляторе (вкладка «Личный кабинет» → «Файлы цен») обновляет на вашем Диске папку «Цены ТехнолоGии»:\n * в ней по папке на каждый регион (Волгоград, Москва…). В папке региона лежат четыре файла и подпапка «Архив»:\n *   «Цены продажи — регион» (Google Таблица и Excel): блюдо, выход, цена продажи и список изменений цен; доступ «все, у кого есть ссылка»,\n *   только чтение (скрипт задаёт его сам: цены продажи не секрет);\n *   «Себестоимость и закупка — регион» (Google Таблица и Excel): цены сырья, себестоимость блюд, наценка, состав себестоимости и журнал\n *   изменений; файлы закрытые, их видите только вы, а остальным они отдаются калькулятором по любому верному коду;\n *   «Архив»: копия обоих Excel-файлов за каждый месяц (последнее состояние месяца).\n * Файлы обновляются сами, когда технолог публикует или принимает изменения; кнопка «Обновить файлы цен» делает это сразу.\n * Новых разрешений для этого не нужно (доступ к Таблицам и Диску у скрипта уже есть): достаточно вставить новый файл поверх старого и создать новую версию развёртывания.\n *\n * Страница по ссылке. Технолог в калькуляторе (вкладка «Личный кабинет» → «Страница по ссылке») один раз загружает готовый файл калькулятора;\n * скрипт кладёт его на Диск и открывает всем по своему адресу /exec: ссылку можно отправить сотрудникам, ничего устанавливать не нужно.\n * Для этого развёртывание должно быть с доступом «Все». Страница обновляется той же кнопкой. Новых разрешений не нужно.\n *\n * Копия данных пользователя. Калькулятор хранит рабочие данные в браузере; чтобы в разных браузерах и на разных компьютерах были одни и те же\n * данные, он по кнопке (и сам, после правок) сохраняет полную копию на ваш Диск, в папку «Копии данных ТехнолоGии», и умеет забрать её обратно.\n * Копия своя у каждой пары «роль + ФИО», хранится текущая и предыдущая. Новых разрешений не нужно.\n *\n * Файл с адресом. Скрипт сам создаёт на вашем Google Диске маленькую таблицу «ТехнолоGия — адрес подключения» (доступ «все, у кого есть\n * ссылка», только чтение) и записывает в неё адрес веб-приложения, когда технолог подключается в калькуляторе. Сотрудникам достаточно\n * ссылки на эту таблицу (или готового файла калькулятора, куда она вшита): адрес /exec вводить не нужно, а если вы разверните скрипт\n * заново и подключитесь с новым адресом, у всех он обновится сам. Таблица содержит только адрес, без кодов и данных.\n *\n * Если потом измените этот файл (например, коды), нужно заново развернуть:\n * Развернуть → Управление развёртываниями → карандаш → Версия: «Новая версия» → Развернуть.\n *\n * Файлы .docx лежат в папке «ТТК калькулятора» на Диске владельца скрипта, предложенные редакторами файлы — в\n * подпапке «На проверке». Технолог может класть файлы в папку и обычным перетаскиванием.\n * Папки регионов. Внутри «ТТК калькулятора» скрипт ведёт по папке на каждый регион калькулятора (по умолчанию «Волгоград» и «Москва»; список и названия\n * берутся из калькулятора и подгоняются при открытии «ТТК в облаке» технологом). Файл ТТК лежит в папке своего региона или в её подпапке; прежние файлы\n * и папки, лежавшие прямо в «ТТК калькулятора», показываются как «Без региона» и переносятся технологом в нужный регион.\n * Если скрипт обновлён с более старой версии (без Диска), выполните «setup» ещё раз: Google запросит доступ к Диску.\n * Папки библиотеки (первые блюда, салаты и т. д.) — это подпапки в папке региона; технолог создаёт их в калькуляторе\n * (вкладка «ТТК в облаке»). Обновление со старой версии: вставьте этот файл поверх старого с теми же кодами и создайте новую версию\n * развёртывания (setup повторять не нужно, если Диск уже был подключён).\n *\n * Папки меню. Папки меню (первые блюда, салаты и т. д.) и раскладку блюд по ним ведёт технолог; скрипт хранит их в своих свойствах и отдаёт любому коду,\n * так что у остальных сотрудников меню разложено так же. Названия и порядок технолог может взять из папок региона на Диске (папки «1.Первые блюда», «2.Вторые блюда»…).\n *\n * Удаления. Когда технолог удаляет сырьё или ТТК и публикует («Опубликовать сразу»), либо принимает такое предложение редактора, в строке общей\n * базы остаётся метка «удалено» с новой версией: все остальные получат её кнопкой «Получить обновления» (или при открытии страницы), и позиция исчезнет\n * и у них. Сырьё, которое ещё используется в ТТК общей базы, удалить нельзя. Удаление можно отменить в «Журнале изменений» («Вернуть прежнее»).\n * Чтобы это заработало, вставьте скрипт версии 11 и разверните его новой версией.\n *\n * Листы «Общая база», «Предложения» и «Журнал» служебные. Правьте данные через калькулятор, не вручную:\n * калькулятор следит за номерами версий, а ручная правка их не меняет, и изменение не дойдёт до остальных.\n */\n\nvar EDITOR_CODE = 'ЗАМЕНИТЕ-код-редактора';\nvar ADMIN_CODE = 'ЗАМЕНИТЕ-код-технолога';\nvar FINANCE_CODE = 'ЗАМЕНИТЕ-код-управляющего';   // необязательный, тер. управляющий (менеджер): меню и финансы, ABC, ОП-1 и цены; ТТК и облако закрыты; правки на проверку технологу\nvar VIEW_CODE = 'ЗАМЕНИТЕ-код-шеф-повара';        // необязательный, шеф-повар: видит всё, ничего не меняет и не отправляет; ТТК только из облака (принятые файлы) и ОП-1\n\n/* ---------------------------------------------------------------------------------------------- */\n\nvar VERSION = 18;\nvar PTR_NAME = 'ТехнолоGия — адрес подключения';\nvar PRICE_KEYS = { ing: ['price', 'priceUnit', 'packG', 'priceSrc', 'px'], rec: [] };   // вырезаются у кода без права на цены (сейчас права на цены есть у всех кодов)\nvar LOCK_KEYS = { ing: [], rec: ['sell'] };                                              // цена продажи: у кода без права на цены её тоже нельзя менять\nvar EXEC_RE = /^https:\\/\\/script\\.google\\.com\\/(macros\\/s|a\\/macros\\/[\\w.-]+\\/s)\\/[\\w-]+\\/exec$/;\nvar SHEETS = {\n  pub: { name: 'Общая база', n: 7, head: ['Ид', 'Вид', 'Название', 'Версия', 'Изменено', 'Кем', 'Данные'], dates: [5] },\n  pend: { name: 'Предложения', n: 14, head: ['Пакет', 'Вид', 'Ид', 'Название', 'Была версия', 'Кем', 'Когда', 'Статус', 'Комментарий', 'Данные', 'Ответ технолога', 'Решение', 'Кто решил', 'После доработки пакета'], dates: [7, 12] },\n  log: { name: 'Журнал', n: 9, head: ['Когда', 'Кем', 'Действие', 'Вид', 'Название', 'Комментарий', 'Версия', 'Было', 'Ид'], dates: [1] }\n};\nvar WAIT = 'ждёт', OK = 'принято', NO = 'отклонено', REW = 'на доработке', REP = 'доработано', WD = 'снято';\nvar FOLDER_NAME = 'ТТК калькулятора', PEND_NAME = 'На проверке';\nvar MAX_DOCX = 3 * 1024 * 1024;\nvar DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';\n\nfunction setup() {\n  sheet_('pub'); sheet_('pend'); sheet_('log');\n  var f = folders_(true);\n  try { rsetup_({ regs: TREG_DEFAULT, by: 'setup' }); } catch (e) { Logger.log('Папки регионов создастся калькулятор при первом открытии «ТТК в облаке» технологом.'); }\n  Logger.log('Листы созданы. Папка для файлов ТТК: ' + f.root.getUrl());\n  try { Logger.log('Файл с адресом подключения: ' + ptr_(true).getUrl()); } catch (e) { Logger.log('Файл с адресом создастся при первом подключении технолога.'); }\n  Logger.log('Теперь разверните скрипт как веб-приложение (см. комментарий в начале файла).');\n}\n\n/* ---------- чтение (адрес с ?callback=… отвечает как скрипт, так страница получает данные без CORS) ---------- */\nfunction doGet(e) {\n  var p = (e && e.parameter) || {}, out, role = '';\n  if (!p.a && !p.callback) return servePage_();          // открыли адрес в браузере: отдаём страницу калькулятора (если технолог её загрузил)\n  try {\n    /* данные общей базы отдаются только по коду любой роли; открыты лишь проверка связи и итог своей записи */\n    if (p.a === 'pull' || p.a === 'pending' || p.a === 'log' || p.a === 'files' || p.a === 'file' || p.a === 'prices' || p.a === 'pprev' || p.a === 'parch' || p.a === 'pfile' || p.a === 'bkinfo' || p.a === 'bkget' || p.a === 'pageinfo' || p.a === 'inbox' || p.a === 'lay' || p.a === 'phlist' || p.a === 'phget' || p.a === 'aiinfo' || p.a === 'aimodels') {\n      role = ready_() ? role_(p.code) : '';\n      if (!role) return reply_(fail_('code', 'Код не подходит'), String(p.callback || ''));\n    }\n    switch (p.a) {\n      case 'ping': out = ping_(); break;\n      case 'aiinfo': out = aiInfo_(role); break;\n      case 'aimodels': out = role === 'admin' ? aiModels_() : fail_('admin', 'Это действие доступно по коду технолога'); break;\n      case 'pull': out = pull_(Number(p.since) || 0, role); break;\n      case 'pending': out = pending_(role); break;\n      case 'inbox': out = inbox_(role, String(p.by || '')); break;\n      case 'log': out = log_(Number(p.n) || 40); break;\n      case 'result': out = result_(String(p.rid || '')); break;\n      case 'files': out = files_(String(p.fresh) === '1', role); break;\n      case 'file': out = file_(p.id, role); break;\n      case 'prices': out = prices_(role); break;\n      case 'pprev': out = pprev_(String(p.reg || ''), String(p.h || ''), role); break;\n      case 'parch': out = parch_(String(p.reg || ''), role); break;\n      case 'pfile': out = pfile_(p.id, role); break;\n      case 'pageinfo': out = pageInfo_(); break;\n      case 'bkinfo': out = bkInfo_(role, String(p.by || '')); break;\n      case 'bkget': out = bkGet_(role, String(p.by || ''), String(p.which || '')); break;\n      case 'lay': out = lay_(); break;\n      case 'phlist': out = phList_(); break;\n      case 'phget': out = phGet_(String(p.id || '')); break;\n      case 'menu': out = menu_(); break;                    // открыто без кода: только название, выход и цена продажи (для экрана до входа)\n      default: out = { ok: false, err: 'a', msg: 'Неизвестное действие' };\n    }\n  } catch (err) {\n    out = { ok: false, err: err.code || 'server', msg: String(err && err.message || err) };\n  }\n  return reply_(out, String(p.callback || ''));\n}\n\n/* ---------- запись: тело запроса — JSON в text/plain, результат ищется страницей по rid ---------- */\nfunction doPost(e) {\n  var req, res, cache = CacheService.getScriptCache();\n  try { req = JSON.parse(e.postData.contents); } catch (x) { return reply_({ ok: false, err: 'json' }, ''); }\n  var rid = String(req && req.rid || '');\n  if (!/^[\\w-]{6,60}$/.test(rid)) return reply_({ ok: false, err: 'rid' }, '');\n  var done = cache.get('r:' + rid);\n  if (done) return reply_(JSON.parse(done), '');          // тот же запрос пришёл второй раз: повторно не выполняем\n  if (req && req.op === 'ai') {                           // ответ ИИ ждут секунды: таблицу на это время не блокируем, чужие сохранения не стоят\n    try { res = ready_() ? aiRun_(req, role_(req.code)) : fail_('setup', 'В скрипте не заданы коды (EDITOR_CODE и ADMIN_CODE) или два кода одинаковые.'); }\n    catch (err) { res = { ok: false, err: err.code || 'server', msg: String(err && err.message || err) }; }\n    cache.put('r:' + rid, JSON.stringify(res), 21600);\n    return reply_(res, '');\n  }\n  var lock = LockService.getScriptLock();\n  try {\n    lock.waitLock(25000);\n  } catch (x) {\n    res = { ok: false, err: 'busy', msg: 'Таблица занята другим сохранением, повторите через минуту' };\n    cache.put('r:' + rid, JSON.stringify(res), 21600);\n    return reply_(res, '');\n  }\n  try {\n    done = cache.get('r:' + rid);\n    res = done ? JSON.parse(done) : handle_(req);\n  } catch (err) {\n    res = { ok: false, err: err.code || 'server', msg: String(err && err.message || err) };\n  } finally {\n    lock.releaseLock();\n  }\n  cache.put('r:' + rid, JSON.stringify(res), 21600);\n  return reply_(res, '');\n}\n\nfunction reply_(obj, cb) {\n  var s = JSON.stringify(obj);\n  if (/^[\\w$.]{1,60}$/.test(cb)) {\n    return ContentService.createTextOutput(cb + '(' + s + ');').setMimeType(ContentService.MimeType.JAVASCRIPT);\n  }\n  return ContentService.createTextOutput(s).setMimeType(ContentService.MimeType.JSON);\n}\nfunction fail_(code, msg) { return { ok: false, err: code, msg: msg }; }\nfunction err_(code, msg) { var e = new Error(msg); e.code = code; return e; }\n\n/* ---------- права ---------- */\nfunction set_(c) { c = String(c == null ? '' : c); return c.indexOf('ЗАМЕНИТЕ') \u003c 0 && c.length >= 4; }\nfunction ready_() {\n  var codes = [EDITOR_CODE, ADMIN_CODE], i, j;\n  if (!set_(EDITOR_CODE) || !set_(ADMIN_CODE)) return false;\n  if (set_(FINANCE_CODE)) codes.push(FINANCE_CODE);\n  if (set_(VIEW_CODE)) codes.push(VIEW_CODE);\n  for (i = 0; i \u003c codes.length; i++) for (j = i + 1; j \u003c codes.length; j++) if (String(codes[i]) === String(codes[j])) return false;\n  return true;\n}\n/* admin — технолог; editor и finance (тер. управляющий) — видят цены, правки идут технологу на подтверждение; viewer (шеф-повар) — видит цены, ничего не меняет */\nfunction role_(code) {\n  code = String(code == null ? '' : code);\n  if (!code) return '';\n  if (code === String(ADMIN_CODE)) return 'admin';\n  if (code === String(EDITOR_CODE)) return 'editor';\n  if (set_(FINANCE_CODE) && code === String(FINANCE_CODE)) return 'finance';\n  if (set_(VIEW_CODE) && code === String(VIEW_CODE)) return 'viewer';\n  return '';\n}\nfunction priceRole_(role) { return role === 'admin' || role === 'editor' || role === 'finance' || role === 'viewer'; }\n/* закупочные цены сырья живут в отдельных полях позиции: без права на цены их вырезают. lock: вырезать ещё и цену продажи\n   (в предложении кода без права на цены её быть не должно) */\nfunction strip_(kind, json, lock) {\n  if (!json || typeof json !== 'object') return json;\n  var o = JSON.parse(JSON.stringify(json));\n  (PRICE_KEYS[kind] || []).forEach(function (k) { delete o[k]; });\n  if (lock) (LOCK_KEYS[kind] || []).forEach(function (k) { delete o[k]; });\n  return o;\n}\n/* позиция без цен (так предлагал редактор в версиях до 8) дополняется действующими ценами из общей базы */\nfunction fill_(kind, json, cur) {\n  var o = JSON.parse(JSON.stringify(json));\n  if (cur && typeof cur === 'object') (PRICE_KEYS[kind] || []).concat(LOCK_KEYS[kind] || []).forEach(function (k) { if (cur[k] !== undefined) o[k] = cur[k]; });\n  return o;\n}\nfunction by_(req) { return String(req.by || 'без имени').replace(/[\\r\\n]+/g, ' ').trim().slice(0, 60) || 'без имени'; }\nfunction note_(req) { return String(req.note || '').replace(/[\\r\\n]+/g, ' ').trim().slice(0, 300); }\n\nfunction handle_(req) {\n  if (!ready_()) return fail_('setup', 'В скрипте не заданы коды (EDITOR_CODE и ADMIN_CODE) или два кода одинаковые: откройте скрипт, задайте их и разверните заново');\n  var role = role_(req.code);\n  if (!role) return fail_('code', 'Код не подходит');\n  switch (req.op) {\n    case 'auth': return { ok: true, role: role, price: priceRole_(role) };\n    case 'propose':\n      if (role === 'viewer') return fail_('viewer', 'Это код шеф-повара: он только читает, предлагать правки по нему нельзя');\n      return propose_(req, role);\n    case 'phput':\n      if (role === 'viewer') return fail_('viewer', 'Это код шеф-повара: он только читает');\n      return phPut_(req);\n    case 'bkput': return bkPut_(req, role);          // копия данных своего пользователя: доступна по любому коду\n    case 'upload':\n      if (role === 'viewer') return fail_('viewer', 'Это код шеф-повара: он только читает, загружать файлы по нему нельзя');\n      return upload_(req, role);\n    case 'fwithdraw':\n      if (role === 'viewer' || role === 'finance') return fail_('viewer', 'По этому коду файлы в облаке недоступны');\n      return fwithdraw_(req);\n    case 'rwclose':\n      if (role === 'viewer') return fail_('viewer', 'Это код шеф-повара: он только читает');\n      return rwClose_(req);\n    case 'publish': case 'pricesPublish': case 'pagePut': case 'addr': case 'approve': case 'reject': case 'rework': case 'revert': case 'fapprove': case 'frework': case 'freject': case 'fdelete': case 'fmove': case 'frestore': case 'phdel': case 'dcreate': case 'drename': case 'ddelete': case 'rsetup': case 'layPut': case 'aikey':\n      if (role !== 'admin') return fail_('admin', 'Это действие доступно по коду технолога');\n      if (req.op === 'publish') return publish_(req);\n      if (req.op === 'pricesPublish') return pricesPublish_(req);\n      if (req.op === 'pagePut') return pagePut_(req);\n      if (req.op === 'addr') return addr_(req);\n      if (req.op === 'approve') return approve_(req);\n      if (req.op === 'reject') return reject_(req);\n      if (req.op === 'rework') return rework_(req);\n      if (req.op === 'fapprove') return fapprove_(req);\n      if (req.op === 'freject') return freject_(req);\n      if (req.op === 'frework') return frework_(req);\n      if (req.op === 'fdelete') return fdelete_(req);\n      if (req.op === 'fmove') return fmove_(req);\n      if (req.op === 'frestore') return frestore_(req);\n      if (req.op === 'phdel') return phDel_(req);\n      if (req.op === 'dcreate') return dcreate_(req);\n      if (req.op === 'drename') return drename_(req);\n      if (req.op === 'ddelete') return ddelete_(req);\n      if (req.op === 'rsetup') return rsetup_(req);\n      if (req.op === 'layPut') return layPut_(req);\n      if (req.op === 'aikey') return aiKey_(req);\n      return revert_(req);\n  }\n  return fail_('op', 'Неизвестная операция');\n}\n\n/* ---------- папки меню: общие для всех кодов ----------\n   Технолог присылает список папок и сиды блюд в каждой; хранится кусками в свойствах скрипта (одно свойство — до 9 КБ, кусок 4000 знаков). Читать может любой код. */\nvar LAY_CHUNK = 4000, LAY_CHUNKS = 30, LAY_CATS = 60, LAY_SID = /^[\\w.~-]{1,64}$/;\nfunction layRead_() {\n  var pr = PropertiesService.getScriptProperties(), n = Number(pr.getProperty('layN') || 0), s = '', i;\n  for (i = 0; i \u003c n; i++) s += String(pr.getProperty('lay' + i) || '');\n  var v = n ? parse_(s) : null;\n  return Array.isArray(v) ? v : [];\n}\nfunction layClean_(list) {\n  var out = [], seen = {};\n  (Array.isArray(list) ? list : []).slice(0, LAY_CATS).forEach(function (c) {\n    if (!c) return;\n    var n = String(c.n == null ? '' : c.n).replace(/\\s+/g, ' ').trim().slice(0, 60), k = nk_(n);\n    if (!n || !k || seen[k]) return;\n    seen[k] = 1;\n    var r = [], dup = {};\n    (Array.isArray(c.r) ? c.r : []).forEach(function (x) { x = String(x == null ? '' : x); if (LAY_SID.test(x) && !dup[x]) { dup[x] = 1; r.push(x); } });\n    r.sort();\n    out.push({ n: n, r: r });\n  });\n  return out;\n}\n/* Меню для тех, кто ещё не вошёл по коду: только название блюда, выход порции, номер ТТК и цена продажи по регионам, папки меню и список регионов.\n   Состава, сырья, закупочных цен и себестоимости здесь нет. */\nfunction menu_() {\n  var pr = PropertiesService.getScriptProperties(), rev = Number(pr.getProperty('rev') || 0), lay = Number(pr.getProperty('layRev') || 0),\n    cache = CacheService.getScriptCache(), key = 'menu:' + rev + ':' + lay, hit = null, items = [], regs = [], out;\n  try { hit = cache.get(key); } catch (e0) { hit = null; }\n  if (hit) { var c = parse_(hit); if (c) { c.pgb = pgBld_(); return c; } }\n  readAll_('pub').forEach(function (r) {\n    if (r[1] !== 'rec' || isDel_(r[6])) return;\n    var j = parse_(r[6]), p = {}, any = false;\n    if (!j || typeof j !== 'object') return;\n    Object.keys(j.sell && typeof j.sell === 'object' ? j.sell : {}).forEach(function (g) {\n      var v = Number(j.sell[g]);\n      if (REG_RE.test(g) && isFinite(v) && v > 0) { p[g] = Math.round(v * 100) / 100; any = true; }\n    });\n    if (!any) return;\n    items.push({ s: String(r[0]), n: String(r[2]).slice(0, 140), o: Number(j.output) > 0 ? Number(j.output) : 0, t: String(j.ttk && j.ttk.num || '').slice(0, 20), g: REG_RE.test(String(j.reg || '')) ? String(j.reg) : '', p: p });\n  });\n  try { regsOf_(folders_(false)).forEach(function (g) { regs.push({ id: g.id, name: g.name }); }); } catch (e1) { regs = []; }\n  if (!regs.length) regs = TREG_DEFAULT.map(function (g) { return { id: g.id, name: g.name }; });\n  out = { ok: true, rev: rev, regs: regs, cats: layRead_(), items: items };\n  try { var txt = JSON.stringify(out); if (txt.length \u003c 90000) cache.put(key, txt, 300); } catch (e2) {}\n  out.pgb = pgBld_();                                    // не кладётся в кэш: номер сборки меняется при загрузке страницы, а не данных\n  return out;\n}\n\nfunction lay_() {\n  var pr = PropertiesService.getScriptProperties();\n  return { ok: true, rev: Number(pr.getProperty('layRev') || 0), by: String(pr.getProperty('layBy') || ''), at: Number(pr.getProperty('layAt') || 0), cats: layRead_() };\n}\nfunction layPut_(req) {\n  var cats = layClean_(req.cats), s = JSON.stringify(cats), pr = PropertiesService.getScriptProperties(), rev = Number(pr.getProperty('layRev') || 0);\n  if (s.length > LAY_CHUNK * LAY_CHUNKS) throw err_('many', 'Слишком много блюд в папках меню для одного хранилища');\n  if (stable_(layRead_()) === stable_(cats)) return { ok: true, rev: rev, same: true, cats: cats.length };\n  var old = Number(pr.getProperty('layN') || 0), n = Math.ceil(s.length / LAY_CHUNK), i;\n  for (i = 0; i \u003c n; i++) pr.setProperty('lay' + i, s.slice(i * LAY_CHUNK, (i + 1) * LAY_CHUNK));\n  for (i = n; i \u003c old; i++) pr.deleteProperty('lay' + i);\n  rev++;\n  pr.setProperty('layN', String(n)); pr.setProperty('layRev', String(rev)); pr.setProperty('layBy', by_(req)); pr.setProperty('layAt', String(Date.now()));\n  return { ok: true, rev: rev, cats: cats.length };\n}\n\n/* ---------- файл с адресом подключения: маленькая таблица на Диске, которую читает калькулятор ---------- */\nfunction ptr_(create) {\n  var props = PropertiesService.getScriptProperties(), id = props.getProperty('ptrId'), book = null;\n  if (id) { try { book = SpreadsheetApp.openById(id); } catch (e) { book = null; } }\n  if (!book && create) {\n    book = SpreadsheetApp.create(PTR_NAME);\n    props.setProperty('ptrId', book.getId());\n    props.setProperty('ptrUrl', book.getUrl());\n  }\n  return book;\n}\nfunction addr_(req) {\n  var url = String(req.url || '').trim();\n  if (!EXEC_RE.test(url)) throw err_('url', 'Это не адрес веб-приложения: он должен начинаться с https://script.google.com/ и оканчиваться на /exec');\n  var props = PropertiesService.getScriptProperties(), fresh = !props.getProperty('ptrId'), book;\n  try { book = ptr_(true); } catch (e) { throw driveErr_(e); }\n  var sh = book.getSheets()[0], cur = String(sh.getRange(1, 1, 1, 1).getValues()[0][0] || ''), shared = true;\n  if (cur !== url) {\n    sh.getRange(1, 1, 3, 1).setValues([[url], ['Это адрес общей базы ТехнолоGии. Его обновляет скрипт, вручную не правьте. Доступ к таблице: все, у кого есть ссылка, только чтение.'], ['Обновлено: ' + new Date().toISOString()]]);\n  }\n  if (fresh || String(props.getProperty('ptrShared')) !== '1') {\n    try {\n      DriveApp.getFileById(book.getId()).setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);\n      props.setProperty('ptrShared', '1');\n    } catch (e) { shared = false; }\n  }\n  return { ok: true, ptr: book.getUrl(), changed: cur !== url, shared: shared };\n}\n\n/* ---------- листы
