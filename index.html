/* библиотека ТТК в облаке: регионы (папки на Диске) → папки региона → файлы; «Без региона» — прежние файлы; «На проверке» — заявки редакторов */
function syNorm(s){return String(s||'').toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();}
function syFReady(){var d=S.sy.files;return!!(d&&d.ready);}
function syFiles(){var d=S.sy.files;return d&&d.ready?d.files:[];}
function syDirs(){var d=S.sy.files;return(d&&d.dirs)||[];}
function syRegs(){var d=S.sy.files;return(d&&Array.isArray(d.regs))?d.regs:[];}
function syRegScript(){var d=S.sy.files;return!!(d&&d.ready&&Array.isArray(d.regs));}     /* скрипт версии 9: на Диске есть папки регионов */
function syOldScript(){var d=S.sy.files;return!!(d&&d.ready&&!d.dirs);}
function syDirInfo(id){var a=syDirs(),i;for(i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function syDirName(id){var x=syDirInfo(id);return x?x.name:null;}
function syFRegName(id){
  var a=syRegs(),i;
  for(i=0;i<a.length;i++)if(a[i].id===id)return a[i].name;
  return id?regionName(id):'Без региона';
}
function syPendFiles(){return syFiles().filter(function(x){return x.kind==='pend';}).length;}
/* архив прежних версий: только технолог, и только если там что-то есть */
function syArchFiles(){return syAdmin()?syFiles().filter(function(x){return x.kind==='arch';}).length:0;}
function syMainFiles(){return syFiles().filter(function(x){return x.kind==='main';}).length;}
function syRegDirs(reg){return syDirs().filter(function(d){return(d.reg||'')===reg;});}
/* есть ли прежние файлы и папки вне регионов (или скрипт старый, и регионов нет вовсе) */
function syLegacy(){
  if(!syRegScript())return true;
  return syFiles().some(function(x){return x.kind==='main'&&!x.reg;})||syDirs().some(function(x){return!x.reg;});
}
/* регион по умолчанию: тот, что выбран вверху страницы, если для него есть папка, иначе первый */
function syDefReg(){
  var rs=syRegs(),g=curRegion(),i;
  if(!rs.length)return'';
  for(i=0;i<rs.length;i++)if(rs[i].id===g)return g;
  return rs[0].id;
}
/* выбранный раздел: id региона, '' — «Без региона» (и скрипты прежних версий), 'pend' — «На проверке» */
function syFReg(){
  var c=S.sy.creg;
  if(c==='pend')return syPendFiles()?'pend':syDefReg();
  if(c==='arch')return syArchFiles()?'arch':syDefReg();
  if(c===''&&syLegacy())return'';
  if(c&&syRegs().some(function(r){return r.id===c;}))return c;
  return syDefReg();
}
/* выбранная папка внутри региона: 'all', 'root' (прямо в папке региона) или id папки; удалённая папка -> 'all' */
function syFCur(){
  var reg=syFReg(),c=S.sy.cdir;
  if(reg==='pend'||reg==='arch'||!c||c==='all')return'all';
  var ds=syRegDirs(reg);
  if(c==='root')return ds.length?'root':'all';
  return ds.some(function(d){return d.id===c;})?c:'all';
}
function syRealDir(){var c=syFCur();return(c!=='all'&&c!=='root')?c:null;}
/* куда класть новые файлы: регион и папка ('' — прямо в папку региона) */
function syUpTarget(){
  var reg=syFReg();
  if(reg==='pend'||reg==='arch')reg=syDefReg();
  var c=syFCur();
  return{reg:reg,dir:(c==='all'||c==='root')?'':c};
}
/* параметры места для запроса: у скрипта с регионами — регион (и его название, чтобы недостающую папку создали) и папка */
function syPlaceReq(reg,dir){
  var x={dir:dir||''};
  if(syRegScript()){x.reg=reg||'';if(reg)x.regName=syFRegName(reg);}
  return x;
}
function syPlaceText(reg,dir){
  var p=[];
  if(syRegScript()&&reg)p.push(syFRegName(reg));
  if(dir&&syDirName(dir))p.push(syDirName(dir));
  return p.join(' › ');
}
function syTargetParse(v){v=String(v==null?'':v);var i=v.indexOf('|');return{reg:i<0?v:v.slice(0,i),dir:i<0?'':v.slice(i+1)};}
/* меню «куда»: регион и его папки одним списком */
function syTargetOptsHtml(sel){
  var h='',dirs=syDirs(),rs=syRegs();
  function opt(v,t){return'<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(t)+'</option>';}
  if(!syRegScript())return opt('|','Без папки')+dirs.map(function(d){return opt('|'+d.id,d.name);}).join('');
  rs.forEach(function(r){
    h+='<optgroup label="'+esc(r.name)+'">'+opt(r.id+'|',r.name+' — без папки')+syRegDirs(r.id).map(function(d){return opt(r.id+'|'+d.id,r.name+' › '+d.name);}).join('')+'</optgroup>';
  });
  if(syLegacy())h+='<optgroup label="Без региона">'+opt('|','Без региона и папки')+syRegDirs('').map(function(d){return opt('|'+d.id,'Без региона › '+d.name);}).join('')+'</optgroup>';
  return h;
}
function syWantDefault(x){
  if(S.sy.fwant[x.id]!==undefined)return S.sy.fwant[x.id];
  var di=x.want?syDirInfo(x.want):null;
  if(di)return(di.reg||'')+'|'+di.id;
  var r=x.wantReg&&syRegs().some(function(g){return g.id===x.wantReg;})?x.wantReg:(syRegScript()?syDefReg():'');

function syRegsDiffer(){
  var d=S.sy.files;if(!d||!d.ready||!Array.isArray(d.regs))return false;
  function clean(s){return String(s==null?'':s).replace(/[\\\/:*?"<>|\r\n]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60);}
  return regionList().some(function(g){
    var f=d.regs.filter(function(r){return r.id===g.id;})[0];
    return!f||f.name!==clean(g.name);
  });
}
function syRegSync(){

  S.sy.rsig=sig;syBusy('rsetup',true);
  syPost('rsetup',{regs:regionList().map(function(g){return{id:g.id,name:g.name};})},syCode()).then(function(){

function syUploadBuf(name,buf,t,rep){

  if(len>3*1024*1024)return Promise.reject({code:'gas',msg:'Файл «'+name+'» больше 3 МБ.'});

  var bad=files.filter(function(f){return!/\.docx$/i.test(f.name);});
  if(bad.length){syMsg('files','err','Нужны файлы Word с расширением .docx. Не подходит: '+bad.map(function(f){return f.name;}).join(', ')+'.');scheduleRender();return;}
  syBusy('fup',true);
  var ok=0,fail=[],admin=syAdmin(),tg=syUpTarget(),arc=0;
  function next(i){
    if(i>=files.length)return Promise.resolve();
    syMsg('files','busy','Загружаю '+(i+1)+' из '+files.length+': «'+files[i].name+'»…');
    return readBuf(files[i]).then(function(buf){return syUploadBuf(files[i].name,buf,tg);}).then(function(r){ok++;arc+=(r&&r.archived)||0;},function(e){fail.push('«'+files[i].name+'»: '+syErrText(e));}).then(function(){return next(i+1);});
  }
  next(0).then(function(){
    syBusy('fup',false);
    if(!admin&&ok){S.sy.creg='pend';S.sy.cdir='all';S.sy.fshow=SY_PAGE;}       /* редактор сразу видит свои файлы в «На проверке» */
    if(!fail.length)syMsg('files','ok','Загружено файлов: '+ok+'.'+(admin?(arc?' Прежних версий ушло в «Архив»: '+arc+'.':''):' Они ждут проверки технолога.')+' '+nowHm());
    else syMsg('files',ok?'warn':'err',(ok?'Загружено: '+ok+'. ':'')+'Не загружено: '+fail.join(' '));
    return syUpDone();
  });
}

function syLogHtml(){

    var note=g.note?'<div class="sysub">'+esc(g.note)+'</div>':'';
    if(g.items.length===1){
      var x=g.items[0],back=syAdmin()&&x.hasPrev&&x.kind&&x.rev>0;
      return'<div class="syrow"><div class="syn">'+head+(x.name?' · '+esc(x.name):'')+(x.rev?' <span class="sysub">версия '+x.rev+'</span>':'')+note+'</div>'
        +'<div class="syst">'+(back?'<button class="btn mini" data-act="syRevert" data-rev="'+x.rev+'"'+(S.sy.busy.review?' disabled':'')+'>Вернуть прежнее</button>':'')+'</div></div>';

/*BKUI-START*/
/* ---------- мои данные на Диске: копия рабочих данных, чтобы во всех браузерах было одно и то же ---------- */
var bkFrozen=false,bkTimer=null,bkSig='',bkBarLast='';
function bkS(){return S.sy.bk||(S.sy.bk={info:null,busy:false,loading:false,gen:0,confirm:'',old:false,hide:false,at:0,schedAt:0,err:''});}
function bkRaw(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}
function bkDev(){var c=S.sy.cfg;if(!c.bkDev){c.bkDev='d'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);syPersist();}return c.bkDev;}
function bkWhoNow(){return bkWho(S.sy.cfg.role,S.sy.cfg.name);}
/* у шеф-повара своих данных нет (он смотрит карты в облаке): копию на Диск не предлагаем */
function bkCan(){return S.mode==='local'&&!S.readOnly&&syLinked()&&!syChef()&&S.loaded.ingredients&&S.loaded.recipes&&!bkFrozen;}
function bkLinked(){var c=S.sy.cfg;return(c.bkRev||0)>0&&c.bkWho===bkWhoNow();}
function bkCloud(){var i=bkS().info;return(i&&i.has&&i.cur)?i.cur:null;}
function bkCtx(){var c=S.sy.cfg;return{linked:bkLinked(),rev:c.bkRev||0,dirty:!!c.bkDirty,dev:c.bkDev||'',cloud:bkCloud()};}
function bkSt(){var bk=bkS();if(bk.old)return'old';if(!bk.info)return'';return bkState(bkCtx());}
function bkWait(){return(window.KBZHU_BK_WAIT>0)?window.KBZHU_BK_WAIT:45000;}
function bkLabel(){try{return bkLabelOf(navigator.userAgent);}catch(e){return'Браузер';}}
function bkCopyTxt(m){return m?syWhen(m.at)+(m.label?' · '+m.label:'')+(m.n?' · сырья '+m.n.ings+', ТТК '+m.n.recipes:''):'';}
function bkUndoAt(){var v=Number(lsGet('kbzhu:undoAt'))||0;return(v&&lsGet('kbzhu:undo'))?v:0;}

/* правка данных: если браузер сверен с копией на Диске, отмечаем «есть что записать» и ставим автозапись */
function bkTouch(){
  if(!syLinked()||!bkLinked())return;
  var bk=bkS();bk.gen++;
  if(!S.sy.cfg.bkDirty){S.sy.cfg.bkDirty=true;syPersist();bkPaint();}
  bkSchedule();
}
function bkSchedule(ms){
  var bk=bkS();
  if(!bkCan()||S.sy.cfg.bkAuto===false||!bkLinked())return;
  var now=Date.now();
  if(bkTimer&&bk.schedAt&&now-bk.schedAt>240000)return;      // правят без остановки: запись не откладывается дольше пяти минут
  if(!bkTimer)bk.schedAt=now;
  clearTimeout(bkTimer);
  bkTimer=setTimeout(function(){bkTimer=null;bk.schedAt=0;bkAutoRun();},ms||bkWait());
}
function bkAutoRun(){
  if(!bkCan()||S.sy.cfg.bkAuto===false)return Promise.resolve();
  if(bkS().busy){bkSchedule(5000);return Promise.resolve();}
  return bkRefresh().then(function(){if(bkSt()==='push')return bkSave({auto:true});});
}

/* что лежит на Диске */
function bkRefresh(){
  var bk=bkS();
  if(!bkCan()||bk.busy||bk.loading)return Promise.resolve();
  bk.loading=true;
  return syGet({a:'bkinfo',by:S.sy.cfg.name.trim()},30000).then(function(d){
    var c=S.sy.cfg,cl=d.cur;
    bk.info=d;bk.old=false;bk.err='';bk.at=Date.now();
    /* эту же копию записал этот браузер, а ответ не дошёл: считаем браузер сверенным */
    if(cl&&bkLinked()&&cl.dev&&cl.dev===c.bkDev&&cl.rev!==c.bkRev&&!c.bkDirty){c.bkRev=cl.rev;c.bkAt=cl.at;syPersist();}
  },function(e){
    if(e&&e.code==='gas'&&e.err==='a')bk.old=true;else bk.err=syErrText(e);
  }).then(function(){bk.loading=false;bkPaint();if(bkSt()==='push')bkSchedule(2000);});
}

/* снимок рабочих данных браузера */
function bkTake(){
  var ls={};
  BK_LS.forEach(function(k){var v=lsGet(k);if(v!==null)ls[k]=v;});
  return bkSnap({at:Date.now(),dev:bkDev(),ings:S.ings,recipes:S.recipes,cfg:S.cfg,map:S.sy.map,gone:S.sy.gone,del:S.sy.del,rev:S.sy.cfg.rev,hm:S.sy.cfg.hm,ls:ls});
}
function bkPack(str){
  var bytes=new TextEncoder().encode(str);
  if(typeof CompressionStream==='undefined')return Promise.resolve({enc:'',b64:bufToB64(bytes)});
  var cs=new CompressionStream('gzip'),w=cs.writable.getWriter();
  w.write(bytes);w.close();
  return new Response(cs.readable).arrayBuffer().then(function(b){return{enc:'gz',b64:bufToB64(b)};});
}
function bkUnpack(enc,b64){
  var buf=b64ToBuf(b64);
  if(enc!=='gz')return Promise.resolve(new TextDecoder().decode(buf));
  if(typeof DecompressionStream==='undefined')return Promise.reject({code:'bk',msg:'Этот браузер не умеет распаковывать копию. Откройте калькулятор в современном Chrome, Edge, Firefox или Safari.'});
  var ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
  w.write(new Uint8Array(buf));w.close();
  return new Response(ds.readable).text();
}

/* запись на Диск. force: сознательно заменить копию, которая новее */
function bkSave(o){
  o=o||{};
  var bk=bkS(),c=S.sy.cfg;
  if(!bkCan()||bk.busy)return Promise.resolve();
  bk.busy=true;bk.confirm='';
  if(!o.auto)syMsg('bk','busy','Сохраняю копию на Диск…');
  bkPaint();
  var gen=bk.gen,snap=bkTake(),cl=bkCloud();
  return bkPack(JSON.stringify(snap)).then(function(p){
    if(p.b64.length>7.8e6)throw{code:'bk',msg:'Копия получилась больше 8 МБ: на Диск она не помещается.'};
    return syPost('bkput',{dev:snap.dev,label:bkLabel(),base:o.force?(cl?cl.rev:0):bkBase({cloud:cl,dev:c.bkDev||'',rev:c.bkRev||0}),force:!!o.force,enc:p.enc,data:p.b64,n:bkCounts(snap)},undefined,60);
  }).then(function(r){
    c.bkRev=r.rev;c.bkWho=bkWhoNow();c.bkAt=r.at||Date.now();
    if(bk.gen===gen)c.bkDirty=false;
    syPersist();bk.busy=false;
    syMsg('bk','ok','Копия сохранена на Диск · '+nowHm()+'.');
    return bkRefresh();
  }).catch(function(e){
    bk.busy=false;
    if(e&&e.err==='newer'){
      syMsg('bk','warn','На Диске уже есть более свежая копия из другого браузера: ничего не записано. Выберите ниже, чьи данные оставить.');
      return bkRefresh();
    }
    syMsg('bk',o.auto?'warn':'err','Копия не сохранилась: '+syErrText(e));
  }).then(function(){bk.busy=false;bkPaint();});
}

/* замена данных в браузере: сначала текущие уходят в запасную копию, потом страница перезагружается */
function bkWriteAll(plan){
  var prev={at:Date.now(),v1:lsGet('kbzhu:v1'),sync:lsGet(SY_KEY),ls:{}},oldUndo=lsGet('kbzhu:undo'),oldAt=lsGet('kbzhu:undoAt'),ok;
  BK_LS.forEach(function(k){var v=lsGet(k);if(v!==null)prev.ls[k]=v;});
  if(!(bkRaw('kbzhu:undo',JSON.stringify(prev))&&bkRaw('kbzhu:undoAt',String(prev.at)))){
    if(oldUndo!==null)bkRaw('kbzhu:undo',oldUndo);
    return'В браузере не хватило места для запасной копии ваших текущих данных, поэтому замена отменена.';
  }
  bkFrozen=true;clearTimeout(localTimer);clearTimeout(bkTimer);clearTimeout(pfTimer);
  ok=bkRaw('kbzhu:v1',plan.v1)&&bkRaw(SY_KEY,plan.sync);
  if(!ok){
    if(prev.v1!==null)bkRaw('kbzhu:v1',prev.v1);
    if(prev.sync!==null)bkRaw(SY_KEY,prev.sync);
    try{if(oldUndo!==null){localStorage.setItem('kbzhu:undo',oldUndo);localStorage.setItem('kbzhu:undoAt',oldAt||'0');}else{localStorage.removeItem('kbzhu:undo');localStorage.removeItem('kbzhu:undoAt');}}catch(e0){}
    bkFrozen=false;
    return'Браузер не дал записать данные (не хватает места). Замена отменена, ваши данные остались прежними.';
  }
  BK_LS.forEach(function(k){
    var v=plan.ls[k];
    if(typeof v==='string')bkRaw(k,v);else{try{localStorage.removeItem(k);}catch(e1){}}
  });
  return'';
}
function bkRestore(which){
  var bk=bkS(),c=S.sy.cfg;
  if(!bkCan()||bk.busy)return Promise.resolve();
  bk.busy=true;bk.confirm='';
  syMsg('bk','busy','Забираю копию с Диска…');bkPaint();
  return syGet({a:'bkget',by:c.name.trim(),which:which==='prev'?'prev':''},90000).then(function(d){
    return bkUnpack(d.enc,d.data).then(function(txt){
      var r=bkCheck(txt);
      if(!r.ok)throw{code:'bk',msg:r.msg};
      var cur=bkCloud(),plan=bkApply(r.snap,{cfg:c,map:S.sy.map,gone:S.sy.gone},{rev:(which==='prev'&&cur)?cur.rev:d.rev,who:bkWhoNow(),at:d.at,dirty:which==='prev'});
      plan.sync=JSON.stringify(plan.sync);
      var bad=bkWriteAll(plan);
      if(bad)throw{code:'bk',msg:bad};
      location.reload();
    });
  }).catch(function(e){
    bk.busy=false;
    syMsg('bk','err',(e&&e.code==='bk')?e.msg:'Копия не получена: '+syErrText(e));
    bkPaint();
  });
}
/* вернуть данные браузера, какими они были до последней замены (и обратно: кнопка работает как переключатель) */
function bkUndo(){
  var raw=lsGet('kbzhu:undo'),u;
  try{u=JSON.parse(raw||'null');}catch(e){u=null;}
  if(!u||typeof u.v1!=='string'||typeof u.sync!=='string'){syMsg('bk','err','Запасной копии в этом браузере нет.');bkPaint();return;}
  var bad=bkWriteAll({v1:u.v1,sync:u.sync,ls:u.ls||{}});
  if(bad){syMsg('bk','err',bad);bkPaint();return;}
  location.reload();
}

/* вопросы и кнопки */
function bkAsk(kind){
  var bk=bkS();
  if(bk.busy||!bkCan())return;
  bkRefresh().then(function(){
    var st=bkSt(),cl=bkCloud();
    if(st==='old'){bkPaint();return;}
    if(st===''){syMsg('bk','err','Не удалось связаться с Диском: '+(bk.err||'нет ответа')+'.');bkPaint();return;}
    if(kind==='push'){
      if(st==='none'||st==='push'||st==='ok'){bkSave({force:false});return;}
      bk.confirm='push';bkPaint();return;
    }
    if(kind==='prev'){
      if(!(bk.info&&bk.info.prev)){syMsg('bk','warn','Предыдущей копии на Диске нет.');bkPaint();return;}
      bk.confirm='prev';bkPaint();return;
    }
    if(!cl){syMsg('bk','warn','Копии на Диске пока нет: сначала сохраните данные в том браузере, где они есть.');bkPaint();return;}
    if(st==='ok'){syMsg('bk','ok','Данные в этом браузере уже совпадают с Диском · '+nowHm()+'.');bkPaint();return;}
    if(st==='behind'){bkRestore('cur');return;}
    bk.confirm='pull';bkPaint();
  });
}
function bkYes(){
  var bk=bkS(),k=bk.confirm;
  bk.confirm='';
  if(k==='push')bkSave({force:true});
  else if(k==='prev')bkRestore('prev');
  else if(k==='pull')bkRestore('cur');
  else bkPaint();
}
function bkClick(act,b){
  switch(act){
    case'bkPull':bkAsk('pull');return true;
    case'bkPullPrev':bkAsk('prev');return true;
    case'bkSaveNow':bkAsk('push');return true;
    case'bkYes':bkYes();return true;
    case'bkNo':bkS().confirm='';bkPaint();return true;
    case'bkUndo':bkUndo();return true;
    case'bkHide':bkS().hide=true;bkPaint();return true;
    case'bkCheck':syMsg('bk','busy','Проверяю копию на Диске…');bkRefresh().then(function(){var s=bkSt();if(s==='ok')syMsg('bk','ok','Данные совпадают с Диском · '+nowHm()+'.');else syMsg('bk','','');bkPaint();});return true;
  }
  return false;
}
function bkChange(act,t){
  if(act!=='bkAuto')return false;
  S.sy.cfg.bkAuto=!!t.checked;syPersist();
  if(t.checked)bkSchedule(3000);else clearTimeout(bkTimer);
  bkPaint();
  return true;
}

/* вид */
function bkStatusText(){
  var st=bkSt(),cl=bkCloud(),auto=S.sy.cfg.bkAuto!==false,bk=bkS();
  switch(st){
    case'old':return'В таблице стоит прежняя версия скрипта: копии данных она не ведёт. Вставьте новый скрипт («Настройка скрипта») и создайте новую версию развёртывания: Развернуть → Управление развёртываниями → Новая версия.';
    case'none':return'Копии на Диске ещё нет.';
    case'free':return'На Диске есть копия ваших данных ('+bkCopyTxt(cl)+'), а этот браузер с ней ещё не сверялся. «Обновить с Диска» заменит данные здесь копией, «Сохранить на Диск» заменит копию данными из этого браузера.';
    case'ok':return'Данные в этом браузере и на Диске совпадают. Копия: '+bkCopyTxt(cl)+'.';
    case'push':return'В этом браузере есть правки, которых нет на Диске.'+(auto?' Они запишутся сами примерно через минуту.':' Нажмите «Сохранить на Диск».');
    case'behind':return'На Диске данные новее ('+bkCopyTxt(cl)+'). Нажмите «Обновить с Диска», чтобы получить их здесь.';
    case'conflict':return'Данные менялись и в этом браузере, и в другом ('+bkCopyTxt(cl)+'). «Обновить с Диска» заменит данные здесь копией, «Сохранить на Диск» заменит копию данными из этого браузера. Заменённое не пропадает: здесь остаётся запасная копия, на Диске предыдущая.';
  }
  return bk.err?'Не удалось связаться с Диском: '+bk.err+'.':'Проверяю копию на Диске…';
}
function bkConfirmHtml(){
  var bk=bkS(),k=bk.confirm,m=k==='prev'?(bk.info&&bk.info.prev):bkCloud(),t,yes;
  if(!k)return'';

/* ---------- проверка ТТК технологом и доработка редактором ----------
   Технолог открывает присланную ТТК прямо из «На проверке»: у него появляется её копия, которую можно править,
   а сверху плашка с решением: опубликовать (уйдёт его версия), вернуть на доработку (комментарий обязателен) или отклонить.
   Редактор получает уведомление о доработке, открывает карту (в любом браузере), исправляет и отправляет на проверку снова. */
var rvBarLast='';
function rvBatchById(id){
  var ls=[S.sy.pend,S.sy.rework,S.sy.inbox,S.sy.inboxR],i,j;
  for(i=0;i<ls.length;i++)if(ls[i])for(j=0;j<ls[i].length;j++)if(ls[i][j].batch===id)return ls[i][j];
  return null;
}
function rvRecIn(b,sid){var r=null;((b&&b.items)||[]).forEach(function(x){if(x.kind==='rec'&&x.sid===sid)r=x;});return r;}
/* локальная позиция, связанная с общей (по sid) */
function rvLocalOf(kind,sid){
  var m=syMap(syCtx(),kind),src=kind==='rec'?S.recipes:S.ings,k,id='';
  for(k in m)if(m[k].sid===sid&&src[k])id=k;
  return id;
}
function rvTmpIds(rv){return Object.keys(rv.recs).map(function(s){return rv.recs[s];}).filter(function(i){return!!S.recipes[i];});}
/* временные копии проверки не считаются «моими изменениями» */
function rvIsTmp(kind,id){
  var rv=S.sy.rv,sid,fr=S.sy.fr;
  if(fr&&((kind==='rec'&&fr.recId===id)||(kind==='ing'&&fr.ings.indexOf(id)>-1)))return true;
  if(!rv)return false;
  if(kind==='rec'){for(sid in rv.recs)if(rv.recs[sid]===id)return true;return false;}
  return rv.ings.indexOf(id)>-1;
}
function rvValidate(){
  var rv=S.sy.rv,fr=S.sy.fr;
  if(rv&&(!syAdmin()||!rvTmpIds(rv).length))S.sy.rv=null;
  if(fr&&(!syAdmin()||!S.recipes[fr.recId]))S.sy.fr=null;
}
/* сырьё из присланной рецептуры, которого у вас нет: берётся из предложения (временно, пока идёт проверка) или из общей базы */
function rvMissingIngs(j,items,made){
  var ctx=syCtx(),m=syMap(ctx,'ing'),sidIdx={},nameIdx={};
  Object.keys(m).forEach(function(id){if(m[id].sid&&S.ings[id])sidIdx[m[id].sid]=id;});
  Object.keys(S.ings).forEach(function(id){var k=normKey(S.ings[id].name);if(k&&!nameIdx[k])nameIdx[k]=id;});
  (j.rows||[]).forEach(function(x){
    var sid=String(x.ing||''),k=normKey(x['in']);
    if(!sid||sidIdx[sid]||(k&&nameIdx[k]))return;
    var src=null,rev=0,i,pb=S.sy.pub['ing|'+sid],id;
    for(i=0;i<(items||[]).length;i++)if(items[i].kind==='ing'&&items[i].sid===sid)src=items[i].json;
    if(!src&&pb){src=pb.json;rev=pb.rev;}
    if(!src)return;
    id=uid();
    S.ings[id]=normIng(syIngClean(src));
    m[id]={sid:sid,rev:rev,h:''};
    if(rev)m[id].h=syCur(ctx,'ing',id).h;
    sidIdx[sid]=id;nameIdx[normKey(S.ings[id].name)]=id;
    if(!rev&&made)made.push(id);
  });
}
function rvShow(id){
  var r=S.recipes[id];
  if(!r)return;
  if(r.reg&&regKnown(r.reg)&&r.reg!==curRegion())setRegion(r.reg);
  S.tab='calc';setActive(id);renderAll();window.scrollTo(0,0);
}

/* ----- технолог ----- */
function rvOpen(batchId,sid){
  if(!syAdmin())return;
  var b=rvBatchById(batchId),it=rvRecIn(b,sid),rv=S.sy.rv,id;
  if(!it)return;
  if(S.sy.fr&&S.recipes[S.sy.fr.recId]){flash('Сначала завершите проверку файла «'+S.sy.fr.name+'» или закройте её');rvShow(S.sy.fr.recId);return;}
  if(rv&&rv.batch!==batchId){
    flash('Сначала завершите проверку ТТК от '+rv.by+' или закройте её');
    id=rvTmpIds(rv)[0];
    if(id)rvShow(id);else{S.sy.rv=null;}
    return;
  }
  if(!rv)rv=S.sy.rv={batch:batchId,by:b.by,at:b.at,recs:{},ings:[]};
  id=rv.recs[sid];
  if(!id||!S.recipes[id]){
    var made=[];
    rvMissingIngs(it.json,b.items,made);
    rv.ings=rv.ings.concat(made);
    id=uid();S.recipes[id]=syRecToLocal(syCtx(),syRecClean(it.json));rv.recs[sid]=id;
    queueSave('recipes',id);if(made.length)queueSave('ingredients','rv');
  }
  S.sy.rvAsk='';S.sy.rvNote='';delete S.sy.msg.review;
  syPersist();rvShow(id);
}
/* что уйдёт при публикации: присланные позиции, где открытые карты заменены их версией у технолога (и новое сырьё для них) */
function rvItems(){
  var rv=S.sy.rv,b=rvBatchById(rv.batch)||{items:[]},ctx=syCtx(),m=syMap(ctx,'rec'),sel=[],saved=[],edited=false,out=[],byKey=Object.create(null),bt;
  Object.keys(rv.recs).forEach(function(sid){
    var id=rv.recs[sid];
    if(!S.recipes[id])return;
    saved.push([id,m[id]]);m[id]={sid:sid,rev:0,h:''};sel.push({kind:'rec',id:id});   // временно связываем копию с её общим ид, чтобы ушла именно она
  });
  bt=syBatch(ctx,sel);
  saved.forEach(function(p){if(p[1])m[p[0]]=p[1];else delete m[p[0]];});
  bt.items.forEach(function(x){byKey[x.kind+'|'+x.sid]=x;});
  b.items.forEach(function(it){
    var k=it.kind+'|'+it.sid,x=byKey[k],o;
    if(x){
      delete byKey[k];
      o=it.kind==='rec'?syRecClean(it.json):syIngClean(it.json);
      if(syH(x.json)!==syH(o))edited=true;
      out.push({kind:x.kind,sid:x.sid,name:x.name,baseRev:it.baseRev||0,json:x.json});
    }else out.push({kind:it.kind,sid:it.sid,name:it.name,baseRev:it.baseRev||0,json:it.json});
  });
  Object.keys(byKey).forEach(function(k){var x=byKey[k];edited=true;out.push({kind:x.kind,sid:x.sid,name:x.name,baseRev:x.baseRev||0,json:x.json});});
  return{items:out,edited:edited};
}
/* закрыть проверку без публикации: копии и временное сырьё убираются */
function rvDrop(){
  var rv=S.sy.rv;
  if(!rv)return;
  var ctx=syCtx(),mi=syMap(ctx,'ing'),used={};
  Object.keys(rv.recs).forEach(function(sid){
    var id=rv.recs[sid];
    if(S.recipes[id])removeDoc('recipes',id);
    delete syMap(ctx,'rec')[id];
  });
  Object.keys(S.recipes).forEach(function(r){S.recipes[r].rows.forEach(function(x){if(x.ing)used[x.ing]=1;});});
  rv.ings.forEach(function(id){
    if(S.ings[id]&&!used[id]&&mi[id]&&!mi[id].rev){removeDoc('ingredients',id);delete mi[id];}
  });
  S.sy.rv=null;S.sy.rvAsk='';S.sy.rvNote='';syPersist();
  fixActive();
}
/* после публикации копия остаётся картой технолога (связанной с общей); если такая у него уже была, остаётся она, а копия убирается */
function rvFinish(){
  var rv=S.sy.rv,ctx=syCtx(),show='';
  Object.keys(rv.recs).forEach(function(sid){
    var id=rv.recs[sid],other;
    if(!S.recipes[id])return;
    other=rvLocalOf('rec',sid);
    if(other&&other!==id){removeDoc('recipes',id);show=show||other;}
    else{syMap(ctx,'rec')[id]={sid:sid,rev:0,h:''};show=show||id;}
  });
  S.sy.rv=null;S.sy.rvAsk='';S.sy.rvNote='';syPersist();
  return show;
}
/* файлы .docx принятых ТТК: после принятия кладутся в «ТТК в облаке» (регион и папка по самой ТТК) */
function rvFileJobs(b,recs){
  var jobs=[],ctx=syCtx();
  if(S.sy.rvFileOff||!syFilesOn()||!syAdmin()||!b)return jobs;
  b.items.forEach(function(it){
    var id=recs&&recs[it.sid],r=id&&S.recipes[id],m;
    if(it.kind!=='rec'||(it.json&&it.json._del))return;
    try{
      if(!r)r=syRecToLocal(ctx,syRecClean(it.json));
      jobs.push(syTtkJob(r));
    }catch(e0){}
  });
  return jobs;
}
function rvFilesPut(jobs){
  var ok=0,fail=[],p=Promise.resolve();
  if(!jobs||!jobs.length)return p;
  var arc=0;
  jobs.forEach(function(j){p=p.then(function(){return syUploadBuf(j.name,j.buf,j.tg,j.rep).then(function(r){ok++;arc+=(r&&r.archived)||0;},function(e){fail.push('«'+j.name+'»: '+syErrText(e));});});});
  return p.then(function(){
    if(fail.length){syMsg('review','warn','Опубликовано, но файл в «ТТК в облаке» положить не удалось: '+fail.join(' '));flash('Опубликовано, но файл в облако не лёг');}
    else if(ok)syMsg('review','ok','Опубликовано'+(ok>1?'; файлов в «ТТК в облаке»: '+ok:'; файл лежит в «ТТК в облаке»')+(arc?'; прежних версий в «Архиве»: '+arc:'')+' · '+nowHm());
    return syFilesLoad(true,true);
  });
}
function rvDecide(op){
  var rv=S.sy.rv,note=String(S.sy.rvNote||'').trim(),extra,bi=null,jobs=[];
  if(!rv||S.sy.busy.review||!syAdmin())return;
  if(op==='rework'&&note.length<3){
    S.sy.rvAsk='rew';syMsg('review','err','Напишите комментарий: что нужно исправить. Без него отправить на доработку нельзя.');
    rvBarUpdate();var t=$('#rvNote');if(t)t.focus();return;
  }
  extra={batch:rv.batch,note:note};

/* ----- редактор: уведомления о доработке ----- */
function syInboxOn(){return S.mode==='local'&&syLinked()&&(S.sy.cfg.role==='editor'||S.sy.cfg.role==='finance');}
function rwNames(b){
  var r=b.items.filter(function(x){return x.kind==='rec';}),l=(r.length?r:b.items).map(function(x){return x.name;});
  return l.slice(0,2).join(', ')+(l.length>2?' и ещё '+(l.length-2):'');
}
function syInbox(force){
  if(!syInboxOn()||S.sy.busy.inbox)return Promise.resolve();
  if(!force&&Date.now()-S.sy.inboxAt<50000)return Promise.resolve();
  S.sy.inboxAt=Date.now();syBusy('inbox',true);
  return syGet({a:'inbox',by:S.sy.cfg.name.trim()}).then(function(d){
    var seen={},old={},fresh,freshF,freshR,ctxR=syCtx(),chR=false;
    syBusy('inbox',false);
    try{old=JSON.parse(lsGet('kbzhu:rwseen')||'{}')||{};}catch(e0){old={};}
    S.sy.inbox=d.batches||[];
    S.sy.inboxF=Array.isArray(d.files)?d.files:[];
    S.sy.inboxR=Array.isArray(d.rejected)?d.rejected:[];
    freshR=S.sy.inboxR.filter(function(b){return!old['r:'+b.batch];});
    fresh=S.sy.inbox.filter(function(b){return!old[b.batch];});
    freshF=S.sy.inboxF.filter(function(x){return!old['f:'+x.id+':'+x.decided];});
    S.sy.inbox.forEach(function(b){seen[b.batch]=1;});
    S.sy.inboxF.forEach(function(x){seen['f:'+x.id+':'+x.decided]=1;});
    S.sy.inboxR.forEach(function(b){seen['r:'+b.batch]=1;});
    /* отклонено: позиция снова числится неотправленной (её можно поправить, отправить снова или вернуть общее) */
    freshR.forEach(function(b){b.items.forEach(function(it){
      var id=rvLocalOf(it.kind,it.sid),e=id&&syMap(ctxR,it.kind)[id];
      if(e&&e.sent&&it.json&&e.sent===syH(it.json)){e.sent='';chR=true;}
    });});
    if(chR)syPersist();
    lsSet('kbzhu:rwseen',JSON.stringify(seen));
    if(fresh.length)flash('Технолог вернул на доработку: '+rwNames(fresh[0])+(fresh.length>1?' (и ещё предложений: '+(fresh.length-1)+')':''));
    else if(freshF.length)flash('Технолог вернул файл на доработку: '+freshF[0].name+(freshF.length>1?' (и ещё файлов: '+(freshF.length-1)+')':''));
    else if(freshR.length)flash('Технолог отклонил: '+rwNames(freshR[0])+(freshR[0].reply?'. Причина: '+freshR[0].reply:''));
    scheduleRender();
  },function(){syBusy('inbox',false);if(!S.sy.inbox)S.sy.inbox=[];});
}
/* открыть возвращённую карту: у автора она уже есть (в том же браузере), иначе создаётся из предложения */
function rwOpen(batchId,sid){
  var b=rvBatchById(batchId),it=rvRecIn(b,sid),ctx=syCtx(),m=syMap(ctx,'rec'),id,cur,nr,o,made=[];
  if(!it)return;
  id=rvLocalOf('rec',sid);
  if(!id){
    rvMissingIngs(it.json,b.items,made);
    id=uid();S.recipes[id]=syRecToLocal(ctx,syRecClean(it.json));
    m[id]={sid:sid,rev:0,h:''};             // не опубликована: числится новой и уйдёт повторно вместе с правками
    queueSave('recipes',id);if(made.length)queueSave('ingredients','rw');
  }else{
    /* в другом браузере карта есть, но без правок автора (чистая копия общей): подставляется то, что он отправлял */
    cur=syCur(ctx,'rec',id);
    if(m[id].rev>0&&m[id].h===cur.h&&cur.h!==syH(syRecClean(it.json))){
      rvMissingIngs(it.json,b.items,made);
      o=S.recipes[id];nr=syRecToLocal(ctx,syRecClean(it.json));
      if(o.qty)nr.qty=o.qty;if(o.op)nr.op=o.op;if(o.cat)nr.cat=o.cat;if(o.arch)nr.arch=true;
      S.recipes[id]=nr;queueSave('recipes',id);if(made.length)queueSave('ingredients','rw');
    }
  }
  S.sy.rwNote='';delete S.sy.msg.review;
  syPersist();rvShow(id);
}
function rwFor(id){
  var l=S.sy.inbox,sid=((syMap(syCtx(),'rec')[id])||{}).sid,r=null;

  l.forEach(function(b){if(!r&&rvRecIn(b,sid))r=b;});

function rwSend(batchId){
  var b=rvBatchById(batchId),ctx=syCtx(),dirty={},sel=[],bt,items,big,note=String(S.sy.rwNote||'').trim();
  if(!b||S.sy.busy.send||!syLinked()||!syCanSend())return;
  syDirty(ctx).forEach(function(d){dirty[d.kind+'|'+d.id]=1;});
  b.items.forEach(function(it){var id=rvLocalOf(it.kind,it.sid);if(id&&dirty[it.kind+'|'+id])sel.push({kind:it.kind,id:id});});

  bt=syBatch(ctx,sel);syPersist();
  items=bt.items.map(function(it){return{kind:it.kind,sid:it.sid,name:it.name,baseRev:it.baseRev,json:it.json};});
  big=items.filter(function(it){return JSON.stringify(it.json).length>40000;}).map(function(it){return it.name;});

  syBusy('send',true);syMsg('review','busy','Отправляю на проверку…');rvBarUpdate();

    bt.items.forEach(function(it){var e=syMap(ctx,it.kind)[it.localId];if(e)e.sent=syH(it.json);});
    syPersist();syBusy('send',false);S.sy.rwNote='';
    syMsg('review','ok','Отправлено на проверку повторно · '+nowHm());flash('Отправлено технологу на проверку');
    return syInbox(true).then(function(){return syRefresh(true);}).then(function(){renderAll();});
  }).catch(function(e){syBusy('send',false);syMsg('review','err',syErrText(e));scheduleRender();rvBarUpdate();});

var GM={d:null,busy:false,at:0,cat:0,err:'',reg:'',q:''};
/* файл привязан к общей базе (адрес вшит или задан), а код ещё не введён или не подошёл */

function upPoll(force){
  if(S.mode!=='local'||!syLinked()||(document.hidden&&!force))return Promise.resolve();
  if(!force&&Date.now()-S.sy.upAt<20000)return Promise.resolve();
  S.sy.upAt=Date.now();
  return syGet({a:'ping'},20000).then(function(i){
    var tasks=[],pn=Number(i.pending)||0;
    S.sy.info=i;
    if(pn!==S.sy.pendN){S.sy.pendN=pn;tasks.push(syGet({a:'pending'}).then(function(d){S.sy.pend=d.batches;S.sy.rework=d.rework||[];}));}

    if(syPhOn()&&typeof i.phv==='number'&&i.phv!==S.sy.phv)tasks.push(syPhSync());
    return Promise.all(tasks).then(function(){upBarUpdate();if(tasks.length)scheduleRender();upAuto();});
  },function(){});

function pfScriptOk(){return!!(S.sy.info&&(S.sy.info.v||0)>=5);}
var pfTimer=null;
/* автоматическое обновление: через паузу после последней правки (и после публикации/приёма), если что-то изменилось по сравнению с файлами на Диске */
function pfSchedule(ms){
  if(!pfCanRun()||S.sy.cfg.pfAuto===false)return;
  clearTimeout(pfTimer);

function pfOne(rg,force,at){
  var g=rg.id,d=pfData(pfCtxFor(g)),T=pfTables(d,rg.name,at);
  /* h: скрипт сам отвечает «то же», если хэш совпал, и таблиц не читает; при принудительном обновлении читаем прежнее состояние, чтобы не потерять журнал */
  return syGet({a:'pprev',reg:g,h:force?'':T.hash},60000).then(function(pv){
    if(pv.same&&!force)return{id:g,name:rg.name,same:true};
    pfWithLogs(T,pfDiff(d,pv,at),pv);
    var body={region:{id:g,name:rg.name},hash:T.hash,pub:T.pub,prv:T.prv,xlsxPub:bufToB64(xlsxPack(T.pub)),xlsxPrv:bufToB64(xlsxPack(T.prv)),
      nDishes:T.n.dishes,nSold:T.n.sold,nIngs:T.n.ings,force:!!force};
    return syPost('pricesPublish',body,undefined,100).then(function(r){return{id:g,name:rg.name,same:!!r.same,changes:T.changes||0,shared:r.shared!==false};});
  });
}
function pfRun(force,auto){
  var pf=S.sy.pf;
  if(!pfCanRun()||pf.busy)return Promise.resolve();
  pf.busy=true;
  if(!auto)syMsg('pf','busy','Обновляю файлы цен на Диске…');
  pfPaint();
  var ready=S.sy.info?Promise.resolve():syGet({a:'ping'}).then(function(i){S.sy.info=i;});
  return ready.then(function(){
    if(!pfScriptOk())throw{code:'old'};
    var at=Date.now(),res=[];
    return regionList().slice().reduce(function(p,rg){return p.then(function(){return pfOne(rg,force,at).then(function(x){res.push(x);});});},Promise.resolve()).then(function(){return res;});
  }).then(function(res){
    pf.busy=false;
    var upd=res.filter(function(x){return!x.same;}),warn=res.some(function(x){return x.shared===false;}),note=null;
    if(upd.length){
      note=[warn?'warn':'ok','Файлы цен обновлены: '+upd.map(function(x){return x.name;}).join(', ')+' · '+nowHm()+'.'+(function(n){return n?' Новых записей в журнале изменений: '+n+'.':'';})(upd.reduce(function(a,x){return a+(x.changes||0);},0))
        +(warn?' Google не дал открыть ссылку на цены продажи: откройте файл на Диске и включите доступ «все, у кого есть ссылка», чтение.':'')];
    }else if(!auto)note=['ok','Файлы цен актуальны: изменений нет · '+nowHm()+'.'];
    /* сообщение — после обновления списка файлов: так блок уже полный, когда человек (или проверка) его видит */
    return syGet({a:'prices'}).then(function(d){pf.list=d.regions;},function(){}).then(function(){if(note)syMsg('pf',note[0],note[1]);});
  }).catch(function(e){
    pf.busy=false;
    if(e&&e.code==='old')syMsg('pf','err','В таблице стоит прежняя версия скрипта, она не ведёт файлы цен. Вставьте новый скрипт (кнопка «Настройка скрипта» выше) и создайте новую версию развёртывания: Развернуть → Управление развёртываниями → Новая версия.');
    else syMsg('pf','err','Файлы цен не обновились: '+syErrText(e));
  }).then(function(){pfPaint();});
}

/* ---------- калькуляция по форме ОП-1 ---------- */
var OP_KEYS=['okpo','okdp','opType','unit','org','head','headName','recNo','docNo','docDate','calcDate','markup','blocks','prodName','authorName'];
function opVal(r,k){
  if(r.op&&Object.prototype.hasOwnProperty.call(r.op,k))return r.op[k];
  switch(k){
    case'org':return ttkVal(r,'org');
    case'head':return ttkVal(r,'head');
    case'headName':return ttkVal(r,'headName');
    case'recNo':return'ТТК №'+(ttkVal(r,'num')||'__');
    case'docNo':return ttkVal(r,'num');
    case'docDate':case'calcDate':return todayRu();
    case'blocks':return'1';
    case'markup':return opMarkupDefault(r);
    default:return'';
  }
}
/* наценка, при которой карточка ОП-1 даёт цену продажи из вкладки «Меню и финансы» */
function opMarkupDefault(r){
  var sp=sellOf(r,curRegion());if(!sp)return'';
  var c=costOf(r,S.ings,100,curRegion());if(!(c.sum>0))return'';
  return toInput(Math.round((sp*100-c.sum)/c.sum*10000)/100);
}
function opMkFromSell(r){return!(r.op&&Object.prototype.hasOwnProperty.call(r.op,'markup'))&&opMarkupDefault(r)!=='';}
function setOp(r,k,v){if(!r.op)r.op={};r.op[k]=v;queueSave('recipes',S.active);}
function opDish(r){var d=String(ttkVal(r,'dish')||'').trim()||'Блюдо',p=String(ttkVal(r,'portion')||'').trim();return'«'+d+'»'+(p?' '+p:'');}
function opModel(r){
  var c=costOf(r,S.ings,100,curRegion()),mk=parseNum(opVal(r,'markup')),pct=mk.ok?mk.v:0;
  var mr=r2(c.sum*pct/100),price=r2((c.sum+mr)/100);
  var B=Math.max(1,Math.min(6,Math.round(Number(opVal(r,'blocks'))||1)));
  return{

/* act: rowIng (строка рецептуры) или ttkIng (строка загруженной ТТК); extra: create — создать сырьё с набранным названием, new — добавить как новое при загрузке */
function pickerHtml(act,fk,id,aria,ph,extra,cls){

/* совпадения: каждое слово запроса должно встретиться в названии, синонимах или названии раздела; сначала начало слова в названии */
function pickMatch(q){
  var toks=catKey(q).split(/[\s,.;:()"«»\/\\\-+%]+/).filter(Boolean),res=[];
  Object.keys(S.ings).forEach(function(id){
    var i=S.ings[id],nm=catKey(i.name),cat=catKey(ingCat(i)),al=(i.aliases||[]).join(' '),sc=0,ok=true,k,t,p;
    for(k=0;k<toks.length&&ok;k++){
      t=toks[k];p=nm.indexOf(t);
      if(p===0||(p>0&&/[^а-яa-z0-9]/.test(nm.charAt(p-1))))sc+=0;
      else if(p>0)sc+=2;
      else if(al.indexOf(t)>-1)sc+=3;
      else if((' '+cat).indexOf(' '+t)>-1)sc+=4;
      else if(t.length>=5&&(' '+nm).indexOf(' '+t.slice(0,t.length>=7?-2:-1))>-1)sc+=1;   /* окончание слова не совпало: «говяд» находит «говяжья», «курицы» — «куриный» */
      else ok=false;
    }
    if(!ok)return;
    if(toks.length&&nm.indexOf(toks.join(' '))===0)sc-=1;
    res.push({id:id,sc:sc,nm:nm});
  });
  res.sort(function(a,b){return a.sc-b.sc||a.nm.length-b.nm.length||(a.nm<b.nm?-1:a.nm>b.nm?1:0);});
  return res;
}

  h+=SKIP_OPT.replace('{c}',cur==='__skip__'?' cur':'');
  if(extra==='create'){
    var exact=Object.keys(S.ings).some(function(id){return catKey(S.ings[id].name).trim()===catKey(qq);});

  }
  return h;
}

  }

/* поля брутто в расчёте и в карте ТТК показывают одно и то же: свою цифру или серую подсказку из потерь; поле, в котором печатают, не трогаем */
function syncGross(row){
  var act=document.activeElement,gd=toInput(Math.round(grossDefault(row)*1000)/1000),ex=(row.gross!==undefined&&row.gross!==null)?toInput(row.gross):'';
  $$('[data-rid="'+row.rid+'"] input[data-act="tGross"]').forEach(function(i){
    i.placeholder=gd;
    if(i!==act)i.value=ex;
  });
}
function updateCalc(){
  var r=curRecipe();if(!r||S.tab!=='calc')return;
  var c=compute(r,S.ings);
  r.rows.forEach(function(row){
    var el=$('.row[data-rid="'+row.rid+'"]');if(!el)return;
    var o=c.rows[row.rid];
    var nmEl=el.querySelector('.rnm');if(nmEl){nmEl.textContent=rowName(row);nmEl.classList.toggle('empty',!S.ings[row.ing]);}
    var nnEl=el.querySelector('[data-out="n"]');if(nnEl)nnEl.textContent=toInput(row.net);
    ['p','f','c','k'].forEach(function(k){
      var n=el.querySelector('[data-out="'+k+'"]');
      if(n)n.textContent=o.has?fmt(o[k],k==='k'?0:1):'—';
    });
    syncGross(row);
  });
  var rb=$('#resBody');if(rb)rb.innerHTML=resultsHtml(r,c);
  var rt=$('#refTable');if(rt)rt.innerHTML=refTableHtml(r,c);
  ttkSync(r);
  var rh=$('#refHint');if(rh)rh.textContent=r.ref.basis==='portion'?'Эталон сравнивается с итогом на порцию рецептуры ('+fmt(c.eff,0)+' г сырья в блюде, выход '+fmt(r.output,0)+' г).':'Эталон сравнивается с расчётом на 100 г готового блюда.';
}
/* расчёт изменился: обновить цифры в части «Карта ТТК» без перерисовки; если поменялся состав строк, перерисовать */
function ttkSync(r){
  var els=$$('.trw[data-rid]'),rows=r.rows,inl={};
  ttkRowList(r).forEach(function(x){inl[x.rid]=1;});
  if(els.length!==rows.length||rows.some(function(x,i){return els[i].getAttribute('data-rid')!==x.rid||els[i].getAttribute('data-inl')!==(inl[x.rid]?'1':'0');})){scheduleRender();return;}
  var act=document.activeElement;
  rows.forEach(function(x,i){
    var ing=S.ings[x.ing],tn=els[i].querySelector('input[data-act="tName"]'),nt=els[i].querySelector('input[data-act="rowNet"]');
    if(tn){tn.placeholder=ing?ing.name:'Название';if(!x.tname&&tn!==act)tn.value=ing?ing.name:'';}
    if(nt&&nt!==act)nt.value=toInput(x.net);
  });
  if(!NOPRICE){
    var kc=ttkCosts(r);
    rows.forEach(function(x,i){
      var cs=els[i].querySelector('[data-out="rc"]'),cx=kc.by[x.rid];
      if(!cs)return;
      cs.textContent=ttkCostCell(cx);cs.title=ttkCostTitle(cx);cs.classList.toggle('has',!!(cx&&cx.sum!==null));
    });
    var tc=$('#ttkCost');if(tc)tc.innerHTML=ttkCostHtml(r);
  }
  var o=$('#ttkOutShow');if(o)o.value=toInput(r.output);
  ttkLive(r);
}
function macroHtml(l,name,v,cls){
  return '<div class="macro"><span class="sw '+cls+'">'+l+'</span><span class="mv">'+fmt(v,1)+'<small> г</small></span><span class="ml">'+name+'</span></div>';
}
function warnHtml(r,c){
  var w=[];
  if(!(r.output>0))w.push(['bad','Ошибка','Укажите выход готового блюда больше нуля.']);
  if(c.unassigned)w.push(['bad','Ошибка','Строк с массой, но без выбранного сырья: '+c.unassigned+'.']);
  if(c.missing)w.push(['bad','Ошибка','Строк, где сырья нет в базе: '+c.missing+'. Выберите другое сырьё или добавьте его в базу.']);
  if(c.nonet)w.push(['warn','Не указано нетто','В строках рецептуры нетто пустое или 0: '+c.nonet+'. КБЖУ считается по нетто, эти строки пока дают нули. Впишите «Нетто, г» в рецептуре карты ТТК; если известно только брутто, впишите его: нетто посчитается по потерям сырья.']);
  if(c.est.length)w.push(['warn','Внимание','Ориентировочные значения у сырья: '+c.est.map(esc).join(', ')+'. Расчёт предварительный. Замените данные в базе на этикетку, справочник или лабораторные значения.']);
  if(!w.length&&r.rows.length)w.push(['good','Готово','Ориентировочных значений в расчёте нет.']);
  return '<ul class="warns">'+w.map(function(x){return '<li class="w-'+x[0]+'"><b>'+x[1]+'.</b>'+x[2]+'</li>';}).join('')+'</ul>';
}
function resultsHtml(r,c){
  var h='<h2>Результат'+(r.name?': '+esc(r.name):'')+'</h2>';
  if(!c.per100){return h+'<p class="muted">Заполните выход готового блюда, чтобы получить расчёт на 100 г.</p>'+warnHtml(r,c);}
  var a=c.per100,y=r.output,kj=a.k*KJ_PER_KCAL;
  var tot=a.k,sp=tot>0?KCAL_P*a.p/tot*100:0,sf=tot>0?KCAL_F*a.f/tot*100:0,sc=tot>0?KCAL_C*a.c/tot*100:0;
  h+='<div class="hero"><div class="kcal"><span class="big">'+fmt(a.k,0)+'</span><span class="unit">ккал<br>на 100 г</span></div><div class="kj">'+fmt(kj,0)+' кДж</div></div>';
  h+='<div class="macros">'+macroHtml('Б','Белки',a.p,'p')+macroHtml('Ж','Жиры',a.f,'f')+macroHtml('У','Углеводы',a.c,'c')+'</div>';
  if(tot>0){
    h+='<div class="split" role="img" aria-label="Вклад в калорийность: белки '+Math.round(sp)+'%, жиры '+Math.round(sf)+'%, углеводы '+Math.round(sc)+'%"><i class="p" style="flex:'+sp+'"></i><i class="f" style="flex:'+sf+'"></i><i class="c" style="flex:'+sc+'"></i></div>';
    h+='<div class="legend"><span class="p">Белки '+Math.round(sp)+'%</span><span class="f">Жиры '+Math.round(sf)+'%</span><span class="c">Углеводы '+Math.round(sc)+'%</span></div>';
  }
  var same=Math.abs(y-100)<1e-9,pt=c.portion;
  function tr(label,v,which){
    return '<tr><th scope="row">'+label+'</th><td class="n">'+fmt(v.p,1)+'</td><td class="n">'+fmt(v.f,1)+'</td><td class="n">'+fmt(v.c,1)+'</td><td class="n">'+fmt(v.k,0)+'</td><td class="n">'+fmt(v.k*KJ_PER_KCAL,0)+'</td><td><button class="btn mini" data-act="copy" data-which="'+which+'">Копировать</button></td></tr>';
  }
  h+='<div class="scroll"><table><thead><tr><th></th><th title="Белки">Б, г</th><th title="Жиры">Ж, г</th><th title="Углеводы">У, г</th><th>Ккал</th><th>кДж</th><th></th></tr></thead><tbody>'
    +(same?tr('100 г (порция)',a,'100'):tr('На 100 г',a,'100')+tr('1 порция ('+fmt(y,0)+' г)',pt,'por'))
    +'</tbody></table></div>';
  h+='<div class="btns" style="margin-top:12px">'+(canDl()?'<button class="btn" data-act="dlRecipe">Скачать расчёт (CSV)</button>':'')+'<button class="btn" data-act="cpRecipe">Копировать для Excel</button></div>';
  if(c.eff>0){
    var d=c.eff-y,lbl=d>=0?'Убыль массы':'Прирост массы';
    h+='<dl class="kv"><div><dt>Масса сырья в блюде</dt><dd>'+fmt(c.eff,1)+' г</dd></div><div><dt>Выход готового</dt><dd>'+fmt(y,1)+' г</dd></div><div><dt>'+lbl+'</dt><dd>'+fmt(Math.abs(d)/c.eff*100,0)+' %</dd></div></dl>';
  }
  h+=costHtml(r);
  h+=warnHtml(r,c);
  h+='<p class="method">Расчёт: сумма (нетто × доля × состав на 100 г ÷ 100), пересчитанная на 100 г выхода. Калорийность = 4·Б + 9·Ж + 4·У, кДж = ккал × 4,184. Потери белков, жиров и углеводов при тепловой обработке не учитываются: вся их масса остаётся в готовом блюде.</p>';
  return h;
}
function refTableHtml(r,c){
  var ref=r.ref,any=[ref.p,ref.f,ref.c,ref.kcal].some(function(v){return v!==null;});
  var perPortion=ref.basis==='portion',src=perPortion?c.portion:c.per100;
  if(!any)return '<p class="hint" style="margin-top:0">Введите значения из протокола или другой карточки, укажите, на что они даны (на 100 г или на порцию), и здесь появится расхождение с расчётом.</p>';
  if(!src)return '<p class="hint" style="margin-top:0">Расчёт недоступен: укажите выход готового блюда.</p>';

/* состояние строки выгрузки: ok — готова, check — проверьте, mass — нужна масса штуки, none — сырьё не выбрано, empty — нет закупок с ценой и количеством */
function c1Row(x){
  var t=S.c1,it=t.parsed.items[x.i],r={it:it,st:'none',pr:null,pack:0,psrc:'',old:null,n:0,cv:null};
  var isNew=!!x.add&&!x.ing;
  if(!isNew&&(!x.ing||!S.ings[x.ing]))return r;
  var pk=0;
  if(it.unit==='pc'){
    if(x.packUser>0){pk=x.packUser;r.psrc='user';}
    else{var d=c1PackDef(x,it);pk=d.g;r.psrc=d.src;}
    r.pack=pk;
    if(!(pk>0)){r.st='mass';return r;}
  }
  var cv=c1Conv(it,pk);
  if(!cv.ok){r.st='empty';return r;}
  r.cv=cv;r.n=cv.lines.length;r.pr=c1Pick(cv.lines,t.rule);
  r.old=isNew?null:pricePerKg(S.ings[x.ing],curRegion());
  r.isNew=isNew;
  r.st=(isNew||x.sure||x.how==='manual')?'ok':'check';
  return r;
}
function c1Start(parsed,fileName){
  if(!parsed.items.length){flash('В файле не нашлось позиций с закупками. Нужен отчёт 1С: название позиции, под ним строки с датой, поставщиком, ценой и количеством.');return;}
  var items=parsed.items.map(function(it,i){
    var mt=c1Match(it.name,S.ings),pick=mt.id,sure=false;
    if(mt.how==='fuzzy'&&mt.score<0.6)pick='';
    if(pick)sure=mt.how==='alias'||mt.how==='exact'||(mt.how==='fuzzy'&&mt.score>=0.8&&!mt.pct);
    return{i:i,ing:pick,how:pick?mt.how:'none',score:mt.score,guess:mt.id,sure:sure,remember:!!pick&&mt.how==='fuzzy',packUser:0,edit:false,add:false};
  });
  var rule=lsGet('kbzhu:c1rule');
  S.c1={file:fileName,parsed:parsed,items:items,rule:PH_RULES[rule]?rule:'avg',open:null};
  var cnt={};S.c1.items.forEach(function(x){var st=c1Row(x).st;cnt[st]=(cnt[st]||0)+1;});
  S.c1.open={mass:true,check:true,none:(cnt.none||0)<=12,'new':true,ok:false,empty:false};
  S.bsub='price';lsSet('kbzhu:bsub','price');S.pview='tbl';lsSet('kbzhu:pview','tbl');S.tab='base';S.c1Paste=false;
  renderAll();
  var c=$('#c1Card');if(c&&c.scrollIntoView)c.scrollIntoView({block:'start'});
}
function c1Sheet(buf){
  var names=['xl/worksheets/sheet1.xml','xl/worksheets/sheet2.xml','xl/worksheets/sheet3.xml'],i=0;
  function next(){
    if(i>=names.length)return Promise.resolve(null);
    return unzipEntry(buf,names[i++]).then(function(u){return u||next();});
  }
  return next();
}
function c1OnFile(file){
  if(!file)return;
  var ext=(/\.([a-z0-9]+)$/i.exec(file.name)||[])[1];ext=(ext||'').toLowerCase();
  function bad(){flash('Не удалось разобрать файл. Сохраните отчёт из 1С как «Лист Excel 2007 (.xlsx)» или вставьте строки таблицы в поле ниже.');}
  function done(rows){
    if(!rows||!rows.length){bad();return;}
    c1Start(c1Parse(rows),file.name);
  }
  if(ext==='xlsx'||ext==='xlsm'){
    if(typeof DecompressionStream==='undefined'){flash('Этот браузер не открывает .xlsx. Нужен современный Chrome, Edge, Firefox или Safari. Можно вставить строки таблицы в поле ниже.');return;}
    var fr=new FileReader();
    fr.onerror=bad;
    fr.onload=function(){
      var buf=fr.result;
      Promise.all([unzipEntry(buf,'xl/sharedStrings.xml'),unzipEntry(buf,'xl/styles.xml'),c1Sheet(buf)]).then(function(r){
        var dec=new TextDecoder('utf-8');
        if(!r[2])throw new Error('nosheet');
        done(xlRows(dec.decode(r[2]),xlShared(r[0]?dec.decode(r[0]):''),xlDateStyles(r[1]?dec.decode(r[1]):'')));
      })['catch'](bad);
    };
    fr.readAsArrayBuffer(file);
  }else if(ext==='ods'){
    if(typeof DecompressionStream==='undefined'){flash('Этот браузер не открывает .ods. Нужен современный Chrome, Edge, Firefox или Safari.');return;}
    var fr2=new FileReader();
    fr2.onerror=bad;
    fr2.onload=function(){
      unzipEntry(fr2.result,'content.xml').then(function(u8){
        if(!u8)throw new Error('nodoc');
        done(odtRows(new TextDecoder('utf-8').decode(u8)));
      })['catch'](bad);
    };
    fr2.readAsArrayBuffer(file);
  }else if(ext==='csv'||ext==='tsv'||ext==='txt'){
    readTextFile(file,function(err,text){if(err){bad();return;}done(c1Rows(text));});
  }else if(ext==='xls'){
    flash('Старый формат .xls не читается. Пересохраните файл как .xlsx (Файл → Сохранить как → Книга Excel) или вставьте строки таблицы в поле ниже.');
  }else if(ext==='pdf'){
    flash('PDF не читается. Сохраните тот же отчёт из 1С в Excel (.xlsx) и загрузите его.');
  }else flash('Нужен файл .xlsx, .ods, .csv или .txt с отчётом 1С.');
}

function doC1Apply(){
  var t=S.c1;if(!t)return;
  var g=curRegion(),P=t.parsed,picks=[],base={},rows=t.items.map(c1Row),id=P.from?phId(g,P.from,P.to):'',old=id?S.cfg[id]:null,oldPv={};
  if(!id){flash('В отчёте не найден период');return;}
  if(old)old.it.forEach(function(x){if(x.pv>0)oldPv[x.ing]=x.pv;});
  if(!rows.some(function(r){return r.st==='ok'||r.st==='check';})){flash('Нечего загружать: нет совпавших позиций');return;}
  var made={},nNew=0;
  rows.forEach(function(r,i){
    var x=t.items[i];
    if(!r.isNew||r.st!=='ok')return;
    var k=normKey(P.items[i].name);
    if(!made[k]){made[k]=addNewIng(P.items[i].name,'Добавлено из выгрузки 1С: значения КБЖУ не заполнены');nNew++;}
    x.ing=made[k];
  });
  rows.forEach(function(r,i){
    var x=t.items[i];
    if(r.st==='ok'||r.st==='check'){
      picks[i]={ing:x.ing,packG:r.pack};
      if(base[x.ing]===undefined){
        var pk=pricePerKg(S.ings[x.ing],g);
        if(oldPv[x.ing]>0)base[x.ing]=oldPv[x.ing];else if(pk!==null&&pk>0)base[x.ing]=pk;
      }
    }else picks[i]=null;
  });
  var b=phBuild(P.items,picks,{region:g,from:P.from,to:P.to,file:t.file,wh:P.wh,rule:t.rule,base:base,at:Date.now()});
  if(!b.it.length){flash('Нечего загружать: нет совпавших позиций');return;}
  var pcs={},pg={};
  rows.forEach(function(r,i){if(picks[i]&&P.items[i].unit==='pc'){pcs[picks[i].ing]=true;pg[picks[i].ing]=r.pack;}});
  var per=c1DateRu(b.from)+' – '+c1DateRu(b.to);
  b.it.forEach(function(x){
    var ing=S.ings[x.ing];if(!ing)return;
    var rec=recFor(ing,g,true);
    phSetPrice(rec,x.pr,pg[x.ing]||0,!!pcs[x.ing]);
    rec.priceSrc=('1С '+per+': '+x.nm).slice(0,200);
    queueSave('ingredients',x.ing);
  });
  var rem=0;
  rows.forEach(function(r,i){
    var x=t.items[i];
    if(!picks[i])return;
    if(x.remember&&x.how!=='alias'&&x.how!=='exact'){addAlias(x.ing,P.items[i].name);rem++;}
    if(P.items[i].unit==='pc'&&x.packUser>0)c1MemoSet(P.items[i].name,x.packUser);
  });
  lsSet('kbzhu:c1rule',t.rule);
  S.cfg[bId(b)]=b;queueSave('settings',bId(b));
  syPhPush(bId(b)).then(function(ok){if(ok===false)flash('История цен сохранена только у вас: в общую базу она не ушла');});
  S.c1=null;S.pflt='all';
  renderAll();
  flash('Загружено цен: '+b.it.length+' за '+phLabel(b)+(nNew?'. Новое сырьё: '+nNew:'')+(rem?'. Запомнено названий: '+rem:''));
}

function pNice(range,n){var raw=range/n,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),f=raw/mag;return(f<1.5?1:(f<3?2:(f<7?5:10)))*mag;}
function pChartDraw(){
  var box=$('#pChart');if(!box)return;

  var W=Math.max(300,Math.floor(box.clientWidth||680)),H=W<560?250:290,mL=W<560?46:56,mR=12,mT=16,mB=32,pw=W-mL-mR,ph=H-mT-mB;

    d0=Math.min(d0,dayNum(p.b.from));d1=Math.max(d1,dayNum(p.b.to));lo=Math.min(lo,p.x.pr);hi=Math.max(hi,p.x.pr);

  });

  });

      s+='<circle class="dt '+cls+'" cx="'+cx+'" cy="'+cy+'" r="4"/><circle class="hit" cx="'+cx+'" cy="'+cy+'" r="10" data-tip="'+esc(tip)+'"/>';
    });

/* разбор .docx из байтов: файл с компьютера или из облака */
function loadTtkBuffer(buf,name,extra){

    if(!u8)throw new Error('nodoc');
    var parsed=parseTtk(new TextDecoder('utf-8').decode(u8));
    if(!parsed.rows.length){flash('В файле не найдена таблица рецептуры с колонками «Брутто» и «Нетто»');return;}
    parsed.buf=buf;

    if(extra&&extra.review)parsed.review=extra.review;

function onTtkFile(file){

  var fr=new FileReader();
  fr.onerror=function(){flash('Не удалось прочитать файл');};

function importRows(text,kind){
  var lines=parseRecords(text);
  var add=0,upd=0,skip=[];
  var byLower={};Object.keys(S.ings).forEach(function(id){byLower[S.ings[id].name.trim().toLowerCase()]=id;});
  var kindByLabel={};Object.keys(KINDS).forEach(function(k){kindByLabel[KINDS[k].toLowerCase()]=k;});
  var lossKeys=['cold','boil','fry','stew','bake'];
  lines.forEach(function(parts,idx){
    var name=(parts[0]||'').trim(),p=parseNumL(parts[1]||''),f=parseNumL(parts[2]||''),c=parseNumL(parts[3]||'');
    if(!name||parts.length<2||!p.ok||!f.ok||!c.ok){if(idx>0||(name&&p.ok&&f.ok&&c.ok))skip.push(idx+1);return;}
    var src=(parts[4]||'').trim(),key=name.toLowerCase(),id=byLower[key];
    /* колонки выгрузки: 6 — ккал (игнорируется), 7 — тип данных, 8–12 — потери, 13 — синонимы */
    var rowKind=kindByLabel[(parts[6]||'').trim().toLowerCase()]||kind;
    var loss={},hasLoss=false;
    lossKeys.forEach(function(k,j){var cell=(parts[7+j]||'').trim(),q=cell===''?null:parseNumL(cell);loss[k]=(q&&q.ok)?q.v:null;if(loss[k]!==null)hasLoss=true;});
    var al=(parts[12]||'').split('|').map(normKey).filter(Boolean);
    /* колонки 14–17: цена, единица цены, масса упаковки, позиция в прайсе */
    var pq=(parts[13]||'').trim()===''?null:parseNumL(parts[13]),pu=/уп|шт/i.test(parts[14]||'')?'pack':'',pgq=(parts[15]||'').trim()===''?null:parseNumL(parts[15]),psrc=(parts[16]||'').trim();
    function setPrice(o){
      var g=curRegion();
      if(NOPRICE)return;
      if(!((pq&&pq.ok)||(pgq&&pgq.ok&&pgq.v>0)||psrc))return;
      var rec=recFor(o,g,true);
      if(pq&&pq.ok)rec.price=pq.v;
      if(pq&&pq.ok){if(pu)rec.priceUnit=pu;else delete rec.priceUnit;}
      if(pgq&&pgq.ok&&pgq.v>0)rec.packG=pgq.v;
      if(psrc)rec.priceSrc=psrc.slice(0,200);
      pruneRec(o,g);
    }
    var icat=(parts[17]||'').trim().replace(/\s+/g,' ').slice(0,40);
    if(id){var o=S.ings[id];if(icat){if(icat===autoCat(o.name))delete o.cat;else o.cat=icat;}o.p=p.v;o.f=f.v;o.c=c.v;o.kind=rowKind;if(src)o.source=src;if(hasLoss)o.loss=loss;if(al.length){o.aliases=(o.aliases||[]).concat(al.filter(function(a){return(o.aliases||[]).indexOf(a)<0;}));}setPrice(o);upd++;}
    else{id=newId();S.ings[id]={name:name,p:p.v,f:f.v,c:c.v,kind:rowKind,source:src};if(icat&&icat!==autoCat(name))S.ings[id].cat=icat;if(hasLoss)S.ings[id].loss=loss;if(al.length)S.ings[id].aliases=al;setPrice(S.ings[id]);byLower[key]=id;add++;}
    queueSave('ingredients',id);
  });
  return{add:add,upd:upd,skip:skip};

      if(abp.m==='raw')abp.rm=t.value==='kg'?'kg':'cost';else abp.dm=['rev','profit','qty'].indexOf(t.value)>-1?t.value:'rev';
      abSavePrefs();S.aflt='all';S.focusFk='a:metric';renderAll();break;
    case'abA':case'abB':t.value=toInput(curAbc()[act==='abA'?'a':'b']);t.classList.remove('invalid');break;
    case'salesRec':
      var si=Number(t.closest('.trow').getAttribute('data-i')),sx=S.sales&&S.sales.items[si];if(!sx)return;
      sx.rec=t.value;sx.how=t.value?'manual':'none';sx.remember=!!t.value;S.focusFk='sr:'+si;renderAll();break;
    case'salesRem':
      var si2=Number(t.closest('.trow').getAttribute('data-i'));if(S.sales&&S.sales.items[si2])S.sales.items[si2].remember=t.checked;break;
    case'salesClear':if(S.sales){S.sales.clear=t.checked;S.focusFk='sales:clear';renderAll();}break;
    case'mMk':case'mPrice':case'mMg':
      var mrow=t.closest('.mrow');if(mrow)mFill(mrow,true);break;
    case'priceIng':
      var pi=Number(t.closest('.trow').getAttribute('data-i')),px=S.price&&S.price.items[pi];if(!px)return;
      if(t.value==='__new__'){px.ing='';px.add=true;px.how='new';px.remember=false;}
      else{px.ing=t.value;px.add=false;px.how=t.value?'manual':'none';px.remember=!!t.value;}
      S.focusFk='pi:'+pi;renderAll();break;
    case'priceRem':
      var pi2=Number(t.closest('.trow').getAttribute('data-i'));if(S.price&&S.price.items[pi2])S.price.items[pi2].remember=t.checked;break;
    case'pUnit':
      var pid2=t.closest('[data-iid]').getAttribute('data-iid'),ig=S.ings[pid2];if(!ig)return;
      var rg1=curRegion(),rec1=recFor(ig,rg1,true);
      if(t.value==='pack')rec1.priceUnit='pack';else delete rec1.priceUnit;
      pruneRec(ig,rg1);
      queueSave('ingredients',pid2);S.focusFk=t.value==='pack'?'i:'+pid2+':pack':t.getAttribute('data-fk');renderAll();break;
    case'opSel':if(!r)return;setOp(r,t.getAttribute('data-k'),t.value);S.focusFk=t.getAttribute('data-fk');renderAll();break;
    case'tsAt':
      if(!r)return;
      var tsc=Number(t.closest('.tsr').getAttribute('data-si')),tsd=ttkSubs(r);
      if(tsd[tsc]){tsd[tsc].a=t.value;setSubs(r,tsd);}
      S.focusFk=t.getAttribute('data-fk');renderAll();break;
    case'ttfSel':if(!r)return;setTtk(r,t.getAttribute('data-k'),t.value);S.focusFk=t.getAttribute('data-fk');renderAll();break;
    case'refBasis':r.ref.basis=t.value==='portion'?'portion':'100';queueSave('recipes',S.active);updateCalc();break;
    case'ttkRem':
      var ti2=Number(t.closest('.trow').getAttribute('data-i'));if(S.ttk&&S.ttk.rows[ti2])S.ttk.rows[ti2].remember=t.checked;break;
    case'impFile':
      var fl=t.files&&t.files[0];if(!fl)return;
      readTextFile(fl,function(err,text){
        var ta2=$('#impText'),msg=$('#importMsg');
        if(err||!ta2){flash('Не удалось прочитать файл');return;}
        ta2.value=text;
        S.importMsg='Файл «'+fl.name+'» прочитан, строк: '+parseRecords(text).length+'. Проверьте текст и нажмите «Добавить в базу».';
        if(msg)msg.textContent=S.importMsg;
        try{t.value='';}catch(e3){}
      });break;
    case'catFilter':S.catF=t.value;refreshIngList();break;
    case'iCat':
      var ci=t.closest('.irow').getAttribute('data-iid');
      if(t.value==='__new__'){S.catNew=ci;refreshIngList();var cni=$('[data-fk="i:'+ci+':cat"]');if(cni)cni.focus();break;}
      setIngCat(ci,t.value);refreshIngList();flash('Сырьё перенесено в раздел «'+ingCat(S.ings[ci])+'»');break;
    case'iCatNew':
      var cj=t.closest('.irow').getAttribute('data-iid'),cv=t.value.trim();
      S.catNew=null;if(cv){setIngCat(cj,cv);flash('Сырьё перенесено в раздел «'+ingCat(S.ings[cj])+'»');}
      refreshIngList();break;
    case'iKind':
      var iid=t.closest('.irow').getAttribute('data-iid');S.ings[iid].kind=t.value;t.setAttribute('data-kind',t.value);
      queueSave('ingredients',iid);var ch=$('#chips');if(ch)ch.innerHTML=chipsHtml();break;
  }
}

});
view.addEventListener('keydown',function(e){
  var t=e.target;if(!(t.hasAttribute&&t.hasAttribute('data-pick')))return;
  var open=pickIsOpen(t);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    if(!open){pickOpen(t);return;}
    pickActive(t,(t._ai==null||t._ai<0?(e.key==='ArrowDown'?0:-1):t._ai+(e.key==='ArrowDown'?1:-1)));
  }else if(e.key==='Enter'){
    if(!open)return;
    e.preventDefault();
    var os=pickList(t).querySelectorAll('.ipo');
    if(os.length&&t._ai>=0&&os[t._ai])pickChoose(os[t._ai]);else if(os.length&&t._typed)pickChoose(os[0]);
  }else if(e.key==='Escape'){
    if(open){e.preventDefault();pickClose(t,true);}
  }
});

function startLocal(){
  S.mode='local';loadLocal();S.loaded.ingredients=S.loaded.recipes=true;
  if(S.seedMark){lsSet('kbzhu:seedfill',S.seedMark);if(S.seedFill)queueSave('ingredients','seed');}
  syLoad();
  cloudFromUrl();renderAll();cloudAutoLoad();
  if(S.tab==='sync')syOnOpen();else if(S.tab==='calc'||S.tab==='cloud')syFilesLoad(false);
  pfStart();
  bkStart();
  pgStart();
  rvStart();
}
function init(){
  S.region=lsGet('kbzhu:region')||MAIN;
  try{S.mclosed=JSON.parse(lsGet('kbzhu:mclosed')||'{}')||{};}catch(e0){S.mclosed={};}
  S.bsub=lsGet('kbzhu:bsub')==='price'?'price':'kbzhu';S.pview=lsGet('kbzhu:pview')==='an'?'an':'tbl';
  var st=lsGet('kbzhu:tab');if(st==='ttk')st='calc';S.tab=(st&&['menu','abc','calc','cloud','op1','base','sync'].indexOf(st)>-1)?st:'menu';
  renderStatus();
  var c=window.claude;
  if(!c||!c.use){startLocal();return;}
  Promise.all([c.use('db').then(function(x){return x;},function(){return null;}),c.use('user').then(function(x){return x;},function(){return null;}),c.use('downloads').then(function(x){return x;},function(){return null;})]).then(function(res){
    var db=res[0],user=res[1];S.dl=res[2];
    if(!db){startLocal();return;}
    S.db=db;S.mode='db';
    var gate=user&&user.can?user.can('data.write').then(function(v){if(v===false)S.readOnly=true;},function(){}):Promise.resolve();
    gate.then(function(){renderStatus();subscribe();});
  });
}
init();
pwaStart();
})();
